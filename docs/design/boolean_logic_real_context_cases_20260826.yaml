dataset:
  title: 规则抽取复杂逻辑真实上下文候选集
  schema_version: 2
  date: 2026-08-26
  source_context_dir: outputs/context_builder_full_20260826
  source_extraction_dir: outputs/rule_extraction_full_routed_20260826
  population: 911
  record_count: 40
  status: design_only
  note: 本文件只记录概念逻辑，不定义DSL语法，不进入生成、反思、解析或图存储流程。
  source_excerpt_policy: source_excerpt是从对应真实包核心原文中抽出的忠实摘要，规范化了省略内容和标点；源包仍是逐字核对依据。
  section_roles:
    graph_ready_examples: 按schema_version 2完整表达证据、对象状态、约束、逻辑树和规则，可用于后续入图原型。
    records: 40个候选包的逻辑适用性标注，用于覆盖面评测；尚未全部展开为图就绪结构。
  decision_values:
    required_for_semantics: 不表达该逻辑会改变原文真假条件或分支含义
    useful_for_compaction: 普通原子规则可正确表达，但逻辑组合能显著减少重复
    needs_domain_review: 文本提示存在逻辑关系，但是否互斥或可并存仍需领域判断
    prefer_atomic_rules: 文本可由分类、阈值或机理链清楚表达，不建议使用复杂逻辑

representation_model:
  principle: 先抽取完整对象状态命题，再分别组织约束表达式、前件表达式和后件表达式；约束不混入因果前件。
  layers:
    evidence:
      description: 保存标题、核心正文、临近正文、表格、公式或图片中的原始证据位置。
      required_fields: [source_unit_id, source_kind, source_excerpt]
    statements:
      description: 可独立入图和查询的完整对象状态命题；裸实体、裸数值不能成为命题。
      required_fields: [id, object, state, normalized_state]
    constraints:
      description: 对规则适用范围的限制，引用statement_id，并记录来源、选择结论和作用目标。
      required_fields: [id, statement_id, origin, decision, applies_to, evidence_refs]
      rejected_candidate_note: rejected记录允许statement_id为null，因为它只保留上游候选ID和排除理由，不进入最终图。
      origin_values: [title, nearby_text, core_text, table, formula, image, inherited_context]
      decision_values:
        applied: 作为最终规则的适用约束
        rejected: 虽由上下文包提供，但与当前规则无关
        needs_review: 当前证据不足以判断是否约束本规则
    expressions:
      description: 表达式树只引用statement或子expression，不复制或拼接实体状态。
      node_types:
        atom: 引用一个statement_id
        group: 使用AND、OR或XOR连接有序子项
      required_fields: [id, operator, operands]
    rules:
      description: Rule分别连接约束根、前件根、后件根；relation仍属于Rule。
      required_fields: [id, constraint_root, antecedent_root, consequent_root, relation, evidence_refs]

graph_projection:
  node_labels:
    StateExpression:
      identity: [object, raw_state, normalized_state]
      note: 继续遵守对象和状态完全相同才去重。
    LogicExpression:
      identity: [operator, ordered_operand_hashes]
      properties: [operator, structural_hash]
    Rule:
      identity: [context_package_id, rule_group_id, rule_index, relation, expression_root_hashes]
    ContextPackage:
      identity: [context_package_id]
    EvidenceUnit:
      identity: [source_unit_id]
  relationships:
    - (:Rule)-[:HAS_CONSTRAINT_EXPR]->(:LogicExpression)
    - (:Rule)-[:HAS_ANTECEDENT_EXPR]->(:LogicExpression)
    - (:Rule)-[:HAS_CONSEQUENT_EXPR]->(:LogicExpression)
    - (:LogicExpression)-[:OPERAND {position: int}]->(:LogicExpression)
    - (:LogicExpression)-[:ATOM]->(:StateExpression)
    - (:Rule)-[:DERIVED_FROM]->(:ContextPackage)
    - (:Rule)-[:SUPPORTED_BY {source_kind: string}]->(:EvidenceUnit)
    - (:LogicExpression)-[:SUPPORTED_BY {origin: string}]->(:EvidenceUnit)
  atom_encoding: 为保持统一查询，每个根都是LogicExpression；单命题使用operator=ATOM并通过ATOM边指向StateExpression。
  recursion_query_hint: 从Rule的三个表达式根分别沿OPERAND*和ATOM读取叶子，避免把逻辑表达式存成不可查询的字符串。
  compatibility:
    existing_condition_edges: 可从HAS_CONSTRAINT_EXPR展开后投影得到
    existing_antecedent_edges: 可从HAS_ANTECEDENT_EXPR展开后投影得到
    existing_consequent_edges: 可从HAS_CONSEQUENT_EXPR展开后投影得到
    migration_note: 现有CONDITION、ANTECEDENT、CONSEQUENT边可暂时保留为扁平兼容视图，LogicExpression作为无损主结构。

