records:
  - context_package_id: context_000004
    category: joint_inputs
    candidate_logic: AND
    logic_position: antecedent
    decision: required_for_semantics
    source_excerpt: 由于气体保护焊的电流密度大，又是明弧，所以弧光辐射强烈。
    propositions:
      A: 气体保护焊|电流密度大
      B: 气体保护焊|明弧
      C: 弧光辐射|强烈
    conceptual_expression: (A AND B) -> C
    reason: 拆成A->C和B->C会错误声称任一条件单独充分。
    construction_effect: 两条错误的独立因果规则收敛为一条共同前提规则。

  - context_package_id: context_000014
    category: joint_inputs
    candidate_logic: AND
    logic_position: antecedent
    decision: required_for_semantics
    source_excerpt: 电弧空间同时存在几种电离电压不同的气体，且低电离电压气体供应充分时，带电粒子主要由该气体电离提供。
    propositions:
      A: 电弧空间|同时存在多种不同电离电压气体
      B: 低电离电压气体|供应充分
      C: 带电粒子|主要由低电离电压气体电离提供
    conceptual_expression: (A AND B) -> C
    reason: “供应充分”不能脱离多气体共存场景单独成立。
    construction_effect: 防止作用域丢失，不以压缩为主要目的。

  - context_package_id: context_000069
    category: joint_inputs
    candidate_logic: AND
    logic_position: antecedent
    decision: required_for_semantics
    source_excerpt: A粒子动能大于e²/r，但与C粒子碰撞并传出大部分动能，剩余动能小于e²/r时，A与B也可复合。
    propositions:
      A: A粒子|初始动能大于e²/r
      B: A粒子|与C粒子碰撞并传出大部分动能
      C: A粒子|剩余动能小于e²/r
      D: A粒子与B粒子|产生复合
    conceptual_expression: (A AND B AND C) -> D
    reason: 当前两条R把必要条件拆开，任一条都不足以推出复合。
    construction_effect: 三段条件合为一个闭合前提，消除虚假充分条件。

  - context_package_id: context_000074
    category: joint_inputs
    candidate_logic: NESTED
    logic_position: antecedent
    decision: required_for_semantics
    source_excerpt: 当阴极材料为W、C且电流较小时，或阴极材料采用低熔点Al、Cu、Fe时，阴极表面温度不能升得很高。
    propositions:
      A: 阴极材料|W或C
      B: 焊接电流|较小
      C: 阴极材料|低熔点Al、Cu或Fe
      D: 阴极表面温度|受限不能升高
    conceptual_expression: ((A AND B) OR C) -> D
    reason: W、C材料分支还需要小电流，低熔点材料分支不依赖该条件。
    construction_effect: 当前两个规则组重复的后续机理链可以共享一次。

  - context_package_id: context_000126
    category: joint_inputs
    candidate_logic: AND
    logic_position: antecedent
    decision: required_for_semantics
    source_excerpt: 同时施加130V电源电压脉冲和300A电流脉冲，可以在15A焊接电流下获得稳定再引燃。
    propositions:
      A: 电源电压脉冲|130V
      B: 电流脉冲|300A
      C: 焊接电流|15A
      D: 电弧再引燃过程|稳定
    conceptual_expression: (A AND B AND C) -> D
    reason: 电压脉冲和电流脉冲是明示的联合措施。
    construction_effect: 阻止模型把任一脉冲单独抽成充分条件。

  - context_package_id: context_000400
    category: joint_inputs
    candidate_logic: AND
    logic_position: antecedent
    decision: required_for_semantics
    source_excerpt: 薄板焊接时如果工件具备装夹条件，应利用夹具进行焊接。
    propositions:
      A: 焊接对象|薄板
      B: 工件|具备装夹条件
      C: 焊接方式|利用夹具
    conceptual_expression: constraint(A) scopes (B -> C)
    reason: 薄板是规则适用场景，具备装夹条件才是触发采用夹具的前件；两者都不可缺，但图中角色不同。
    construction_effect: 避免把“具备装夹条件”推广到所有焊件，同时不把薄板场景误当作直接原因。

  - context_package_id: context_000449
    category: joint_inputs
    candidate_logic: AND
    logic_position: antecedent
    decision: required_for_semantics
    source_excerpt: 当某种元素浓度越大和它与氧的结合能力越强时，这种元素越容易氧化。
    propositions:
      A: 合金元素|浓度越大
      B: 合金元素|与氧结合能力越强
      C: 合金元素|越容易氧化
    conceptual_expression: (A AND B) -> C
    reason: 原文将浓度和亲氧能力作为共同判断条件。
    construction_effect: 当前两条独立R改为一个联合前提，避免过度断言。

  - context_package_id: context_000490
    category: joint_inputs
    candidate_logic: AND
    logic_position: antecedent
    decision: required_for_semantics
    source_excerpt: 在小电流和低电压的C区，电弧呈短路过渡。
    propositions:
      A: 焊接电流|小
      B: 电弧电压|低
      C: 熔滴过渡类型|短路过渡
    conceptual_expression: (A AND B) -> C
    reason: 过渡区域由电流和电压共同确定。
    construction_effect: 保留二维参数区间，不拆成两个一维充分条件。

  - context_package_id: context_000589
    category: joint_inputs
    candidate_logic: AND
    logic_position: antecedent
    decision: required_for_semantics
    source_excerpt: 随着焊接电流增加，在电弧电压适当匹配的情况下，熔深、熔宽和余高都增大。
    propositions:
      A: 焊接电流|增加
      B: 电弧电压|适当匹配
      C: 焊缝尺寸属性|增大
    conceptual_expression: constraint(B) scopes (A -> C)
