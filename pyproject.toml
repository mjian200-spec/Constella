[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constella"
version = "0.1.0"
description = "Traceable industrial-document context builder"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "neo4j>=6.0", "Pillow>=11.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
