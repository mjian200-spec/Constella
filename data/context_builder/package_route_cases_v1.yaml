id: package_route_cases_v1
version: 1.0
labels:
  concept:
    - 气体保护焊是利用外加气体保护电弧和焊接区的一类电弧焊方法。
    - 熔滴过渡可分为短路过渡、滴状过渡和喷射过渡。
    - 焊接接头由焊缝、熔合区和热影响区组成。
    - 金属惰性气体保护焊简称MIG焊。
    - 电弧电压是指电弧两端的电位差。
    - 焊丝包括实心焊丝和药芯焊丝两大类。
    - 保护气体主要分为惰性气体、活性气体及其混合气体。
    - 焊接电源由主电路、控制电路和送丝控制部分组成。
    - 阴极斑点是阴极表面集中发射电子的区域。
    - 熔深是母材熔化部分在焊缝横截面上的最大深度。
    - MAG焊又称熔化极活性气体保护焊。
    - 焊接位置包括平焊、横焊、立焊和仰焊。
    - 自由过渡是一种熔滴不与熔池短路接触的过渡形式。
    - 焊缝金属由熔化母材和填充金属共同组成。
    - 电弧由阴极区、弧柱区和阳极区组成。
    - 余高是焊缝表面高出母材表面的部分。
    - 坡口可分为I形、V形、X形和U形坡口。
    - 焊接循环是指焊接热源作用下经历的温度随时间变化过程。
    - 气孔包括氢气孔、氮气孔和一氧化碳气孔。
    - 送丝机构由电动机、减速器、送丝轮和压紧机构组成。
    - 脉冲喷射过渡属于喷射过渡的一种形式。
    - 接触式引弧也称短路引弧。
    - 焊接材料包括焊条、焊丝、焊剂和保护气体。
    - 热影响区是焊接热循环使组织和性能发生变化但未熔化的母材区域。
    - 焊枪通常由导电嘴、喷嘴、绝缘体和冷却结构构成。
  rule:
    - 当焊接电流增大时，焊缝熔深随之增加。
    - 为防止产生气孔，焊前必须清除坡口表面的油污和水分。
    - 电弧电压过高会使焊缝宽度增加并导致飞溅。
    - 焊接薄板时应采用较小的焊接电流。
    - 送丝速度增加会使焊接电流上升。
    - 当保护气体流量不足时，空气侵入会造成焊缝氧化。
    - 引弧前必须确认焊枪喷嘴内无飞溅物堵塞。
    - 焊丝伸出长度增加时，电阻热增加而熔化速度提高。
    - 为保证焊透，根部间隙不得小于工艺规定值。
    - 在强风环境下焊接应设置挡风装置。
    - 焊接速度过快会造成咬边和未熔合。
    - 若导电嘴磨损严重，应立即更换。
    - 采用反接时，焊丝熔化速度通常高于正接。
    - 多层焊时必须在下一道焊接前清除层间熔渣。
    - 环境温度低于规定值时应对工件进行预热。
    - 弧长缩短会使电弧电压降低。
    - 气体流量过大会卷入空气并降低保护效果。
    - 焊枪倾角增大时电弧力的轴向分量减小。
    - 当焊机过热报警时不得继续施焊。
    - 定位焊缝存在裂纹时必须清除后重新焊接。
    - 为减小变形，应采用对称焊接顺序。
    - 层间温度超过上限时应暂停焊接直至冷却。
    - 电流一定时，提高焊接速度会减小单位长度热输入。
    - 焊后应缓慢冷却以降低淬硬倾向。
    - 保护气路泄漏会使实际气体流量低于设定值。
  concept_and_rule:
    - 短路过渡是熔滴与熔池周期性短路的过渡形式，焊接薄板时应优先采用较低电压的短路过渡。
    - 氩气是一种惰性保护气体；采用氩气时电弧引燃较容易且电弧稳定。
    - 药芯焊丝由金属外皮和内部粉芯组成，使用前必须防止受潮。
    - 喷射过渡属于自由过渡，当电流超过临界电流后熔滴以细小颗粒高速过渡。
    - 焊接热输入是单位长度焊缝获得的能量，提高电压或电流会增加热输入。
    - 预热是焊前加热工件的工艺措施，厚板焊接时应按工艺规定进行预热。
    - 层间温度是多层焊相邻焊道之间的工件温度，超过上限时必须等待冷却。
    - 直流反接是焊件接负极、焊丝接正极的接法，焊接铝合金时应按工艺选择极性。
    - 咬边是沿焊趾形成的沟槽，电弧电压过高或速度过快时容易产生咬边。
    - 未熔合是焊缝金属与母材未完全熔合的缺陷，发现后必须清除并补焊。
    - 保护气体包括氩气、氦气和二氧化碳，选择气体时应考虑材料和过渡形式。
    - 导电嘴是向焊丝传导电流的部件，孔径磨损后应及时更换。
    - 焊接电流是流经焊接回路的电流，电流增大通常会提高熔深。
    - 坡口角度是两坡口面之间的夹角，角度过小可能导致根部未熔合。
    - 气孔是凝固金属中残留气体形成的孔穴，焊前清理可降低气孔倾向。
    - 焊后热处理是焊后对接头进行加热保温和冷却的过程，保温温度必须符合工艺要求。
    - 熔合比是焊缝中熔化母材所占比例，增大熔深会提高熔合比。
    - 焊丝干伸长是导电嘴到电弧端部的焊丝长度，干伸长增加会提高电阻热。
    - 送丝速度表示单位时间送出的焊丝长度，提高送丝速度会增大电流。
    - 弧坑是收弧处形成的低洼区域，收弧时应填满弧坑以防裂纹。
    - 焊接变形包括角变形、弯曲变形和波浪变形，采用对称焊可减小变形。
    - 飞溅是熔滴或熔池金属飞出的现象，电参数不匹配会增加飞溅。
    - 根部间隙是接头根部两构件之间的距离，间隙过大会导致烧穿。
    - 后拖角是焊枪指向已焊焊缝的倾角，角度过大会降低保护效果。
    - 冷裂纹是焊后较低温度下产生的裂纹，控制扩散氢和冷却速度可降低风险。
