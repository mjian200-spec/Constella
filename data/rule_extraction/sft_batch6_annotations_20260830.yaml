notes: 第101—120条人工复核样本，覆盖电离、熔滴、TIG、CO2工艺、双丝MAG及激光复合焊。
source_issue_log:
  - context_id: context_000028
    issue: 核心正文首尾截断；金标不补写解离前的分子过程及末尾原因。
  - context_id: context_000033
    issue: 开头缺失“电子获得四倍动能”的比较条件，金标不抽取该残缺倍数关系。
  - context_id: context_000034
    issue: 核心正文末尾逗号截断；金标只抽取已闭合的两轮碰撞增殖过程。
  - context_id: context_000217
    issue: 核心正文在“由大滴过渡时的阻力变为射滴过渡时”截断，不补写斑点压力最终方向。
  - context_id: context_000820
    issue: 核心正文以“当间距达到20mm时，可”截断，不生成20mm间距的后续用途规则。
annotations:
  - id: context_000028
    difficulty_tags: [解离吸热, 多属性比较, 备选气氛, 双端截断]
    construction_rationale: 解离吸热对带电粒子产生及电弧电热性能的影响是一般关系。相同弧长限定CO2、N2与单原子Ar的比较；CO2和N2是备选气氛，分别对电弧电压和温度作同属性比较，不能用“CO2或N2”合成实体。首尾残句均不补充。
    output: |-
      规则组1
      C: 无
      R: 气体解离过程|发生并吸热 —[影响]→ 带电粒子产生过程|变化
      R: 气体解离过程|发生并吸热 —[显著影响]→ 电弧电性能|变化
      R: 气体解离过程|发生并吸热 —[显著影响]→ 电弧热性能|变化
      规则组2
      C: 电弧长度|相同
      R: CO2气氛电弧|电弧电压 —[高于]→ Ar气氛电弧|电弧电压
      R: CO2气氛电弧|电弧温度 —[高于]→ Ar气氛电弧|电弧温度
      R: N2气氛电弧|电弧电压 —[高于]→ Ar气氛电弧|电弧电压
      R: N2气氛电弧|电弧温度 —[高于]→ Ar气氛电弧|电弧温度

  - id: context_000033
    difficulty_tags: [截断开头, 非弹性碰撞, 能量阈值]
    construction_rationale: 开头四倍动能缺少“相同条件”的具体含义，主动舍弃。闭合证据支持电子质量远小于离子、电子与中性粒子非弹性碰撞时把动能转为中性粒子内能、电子总能量超过电离能后发生电离，最终说明电场电离主要由这类碰撞引起。
    output: |-
      规则组1
      C: 无
      R: 电子|质量 —[远小于]→ 离子|质量
      R: 电子|与中性粒子非弹性碰撞 —[转换]→ 中性粒子内能|由电子动能转换
      R: 电子总能量|超过中性粒子电离能 —[使]→ 中性粒子|电离
      R: 电子与中性粒子|非弹性碰撞 —[主要引起]→ 电场作用下电离|发生

  - id: context_000034
    difficulty_tags: [强电场, 碰撞增殖, 多结果拆分, 截断句]
    construction_rationale: 强电场是整段共同场景。中性粒子和受激粒子是两种备选碰撞对象，不能用加号合并，故分别描述碰撞；一次碰撞同时生成一个新电子和一个正离子，两个结果拆R。新旧两个电子继续碰撞后生成两个新电子，保留第二轮增殖，末尾截断不再推导。
    output: |-
      规则组1
      C: 电场强度|强
      R: 电子|受电场作用 —[获得]→ 电子运动状态|加速
      R: 电子|加速运动 —[可碰撞]→ 中性粒子|发生碰撞
      R: 电子|加速运动 —[可碰撞]→ 受激粒子|发生碰撞
      R: 电子与中性粒子|碰撞 —[生成]→ 新电子数量|1个
      R: 电子与中性粒子|碰撞 —[生成]→ 新正离子数量|1个
      R: 电子与受激粒子|碰撞 —[生成]→ 新电子数量|1个
      R: 电子与受激粒子|碰撞 —[生成]→ 新正离子数量|1个
      R: 两个电子|继续与中性粒子碰撞 —[生成]→ 新电子数量|2个

  - id: context_000200
    difficulty_tags: [过渡形式对比, 温度上限, 图片原因链]
    construction_rationale: 铝焊丝及10~15mm伸出长度限定大滴与射流两种温度结论。两种过渡形式分别对应较低、较高温度，射流最高温度绑定2260℃；铝沸点2450℃是参照值，不与最高温度写成错误“对应”。过渡形式造成温度显著变化，再解释熔化速度曲线阶跃。
    output: |-
      规则组1
      C: 焊丝材质|铝 + 焊丝伸出长度|10~15mm
      R: 熔滴过渡形式|大滴过渡 —[对应]→ 熔滴温度|较低
      R: 熔滴过渡形式|射流过渡 —[对应]→ 熔滴温度|较高
      R: 熔滴过渡形式|射流过渡 —[对应]→ 熔滴最高温度|2260℃
      R: 铝|沸点 —[对应]→ 温度值|2450℃
      R: 熔滴过渡形式|由大滴转为射流 —[使]→ 焊丝熔化速度曲线|阶跃变化

  - id: context_000201
    difficulty_tags: [相反趋势, 温度范围, 共同决定因素, 图片核对]
    construction_rationale: 大滴和射流过渡中电流对熔滴温度的趋势相反，必须分组。射流过渡温度上、下限分别绑定2130℃和1570℃；钢的熔沸点仅作参照，不制造因果。正文明确钢焊丝电阻率与熔滴停留时间共同决定温度大幅变化，可使用加号。
    output: |-
      规则组1
      C: 熔滴过渡形式|大滴过渡
      R: 焊接电流|增加 —[使]→ 熔滴温度|增加
      规则组2
      C: 熔滴过渡形式|射流过渡
      R: 焊接电流|增加 —[使]→ 熔滴温度|减小
      R: 熔滴温度|最高值 —[对应]→ 温度值|2130℃
      R: 熔滴温度|最低值 —[对应]→ 温度值|1570℃
      R: 钢焊丝电阻率|大 + 熔滴在焊丝端头停留时间|变化 —[共同决定]→ 熔滴温度变化幅度|很大

  - id: context_000210
    difficulty_tags: [局部收缩力, 反常电流趋势, 越界规则删除]
    construction_rationale: 当前核心只描述收缩集中在熔滴底部狭小区域的情况，该状态作为C。向上电磁力阻碍过渡，电流增加反而形成大颗粒熔滴，再使喷射过渡难以实现。缓存初稿前两组重力和仰焊规则来自邻近段落而非本包核心，全部删除。
    output: |-
      规则组1
      C: 电磁收缩区域|集中在熔滴底部狭小区域
      R: 电磁力|向上作用 —[阻碍]→ 熔滴过渡|进行
      R: 焊接电流|增加 —[使]→ 熔滴颗粒尺寸|增大
      R: 熔滴颗粒尺寸|大 —[使]→ 喷射过渡实现难易|难以实现

  - id: context_000211
    difficulty_tags: [爆炸力, 气体积聚链, 多去向拆分]
    construction_rationale: 熔滴直接参与全部关系，不再设置重复C。停留时间长使冶金反应生成较多CO等气体，随后积聚、体积膨胀、内压升高并在足够大时爆破。爆破后大部分液态金属进入熔池、少量成为飞溅，是同一事件的两个并列去向，分别输出。
    output: |-
      规则组1
      C: 无
      R: 熔滴在电弧空间停留时间|较长 —[使]→ 熔滴内部冶金反应生成气体|较多
      R: 熔滴内部气体|生成较多 —[使]→ 熔滴内部气体|逐渐积聚
      R: 熔滴内部气体|逐渐积聚 —[使]→ 熔滴体积|膨胀
      R: 熔滴内部气体|逐渐积聚 —[使]→ 熔滴内压力|增大
      R: 熔滴内压力|足够大 —[使]→ 熔滴|爆破
      R: 熔滴|爆破 —[使]→ 大部分液态金属|向熔池过渡
      R: 熔滴|爆破 —[使]→ 少量金属|形成飞溅

  - id: context_000217
    difficulty_tags: [射滴过渡, 多种作用力, 图片核对, 截断句]
    construction_rationale: 射滴过渡是整段共同场景。弧根覆盖范围从熔滴大部延伸至全部表面时对应钟罩形；电流产生轴向电磁收缩力，钟罩形电弧产生等离子流力。弧根面积较大只支持斑点压力方向发生改变，原文在新方向处截断，因此删除初稿补写的“由阻力变推力”。
    output: |-
      规则组1
      C: 熔滴过渡形式|射滴过渡
      R: 电弧弧根|包围熔滴大部至全部表面 —[形成]→ 电弧形态|钟罩形
      R: 通过熔滴的电流|存在 —[产生]→ 电磁收缩力|促进过渡的轴向推力
      R: 电弧形态|钟罩形 —[产生]→ 等离子流力|存在
      R: 弧根面积|较大 —[使]→ 斑点压力方向|改变

  - id: context_000401
    difficulty_tags: [优点缺点, 应用原因, 方法组合前景]
    construction_rationale: TIG焊直接参与各条关系，C为空。电弧稳定使焊缝优质可靠，进而促使重要产品采用TIG；非熔化极属性分别导致效率低、速度慢、熔深浅和熔敷效率低。最后只保留与冶金和物理方法结合可产生高效特种方法的方向性结论，不虚构具体方法。
    output: |-
      规则组1
      C: 无
      R: TIG焊|电弧稳定 —[使]→ 焊缝质量|优质可靠
      R: 焊缝质量|优质可靠 —[促使]→ 重要焊接产品和结构|采用TIG焊
      R: TIG焊|非熔化极焊接 —[使]→ 焊接效率|低
      R: TIG焊|非熔化极焊接 —[使]→ 焊接速度|慢
      R: TIG焊|非熔化极焊接 —[使]→ 焊接熔深|浅
      R: TIG焊|非熔化极焊接 —[使]→ 焊接熔敷效率|低
      R: TIG焊|与其他冶金和物理方法结合 —[可形成]→ 特种焊接方法|高效

  - id: context_000410
    difficulty_tags: [方法比较, 厚度分支, 效率成本, 图片核对]
    construction_rationale: A-TIG焊提高效率和降低成本是一般结论；与常规TIG的熔深、正面宽度比较只在参数不变时成立。12mm不锈钢、中等厚度和更厚焊件是三个适用分支，分别对应单道焊透、开坡口一次焊透和减少层数，不能并成共同条件。
    output: |-
      规则组1
      C: 无
      R: 焊接方法|A-TIG焊 —[提高]→ 焊接效率|提高
      R: 焊接方法|A-TIG焊 —[降低]→ 焊接成本|降低
      规则组2
      C: 焊接参数|不变
      R: A-TIG焊|熔深 —[比常规TIG焊提高一倍以上]→ 常规TIG焊|熔深
      R: A-TIG焊|正面焊缝宽度 —[不大于]→ 常规TIG焊|正面焊缝宽度
      规则组3
      C: 焊接方法|A-TIG焊 + 母材材质|不锈钢 + 板厚|12mm
      R: 焊接工艺|实施 —[实现]→ 焊透方式|单道焊一次焊透
      规则组4
      C: 焊接方法|A-TIG焊 + 材料厚度|中等
      R: 焊接工艺|实施 —[允许]→ 焊透方式|开坡口一次焊透
      规则组5
      C: 焊接方法|A-TIG焊 + 焊件厚度|更厚
      R: 焊接工艺|实施 —[减少]→ 焊道层数|减少

  - id: context_000603
    difficulty_tags: [无填坑功能, 断续操作, 时间序列, 图片核对]
    construction_rationale: 无弧坑填充功能且弧坑未凝固是全部操作的共同前提。断续焊接用于填满弧坑，交替按压释放按钮实现断续燃弧，焊枪在填满前保持在弧坑上；图中①②③只明确燃烧时间依次缩短，保留序列趋势而不猜测具体时长。
    output: |-
      规则组1
      C: 焊枪功能|无弧坑填充功能 + 弧坑状态|未完全凝固
      R: 焊接操作|进行几次断续焊接 —[填充]→ 弧坑|填满
      R: 焊枪按钮|交替按压与释放 —[实现]→ 焊接方式|断续焊接
      R: 弧坑|尚未填满 —[要求]→ 焊枪位置|始终停留在弧坑上
      R: 断续燃烧次序|①至②至③ —[使]→ 每次燃烧时间|依次缩短

  - id: context_000606
    difficulty_tags: [成本原因, 材料管理, 健康危害, 设备要求]
    construction_rationale: 药芯焊丝CO2焊是共同场景。复杂制造设备与较高材料成本共同解释价格贵；有缝、不能镀铜、易锈吸湿和加强管理保持相邻链。烟尘分别连接环境与健康危害；非专用送丝机导致压扁，再降低送丝稳定性。无关的250A候选不加入C。
    output: |-
      规则组1
      C: 焊接方法|药芯焊丝CO2焊
      R: 焊丝制造设备|复杂 + 焊丝材料成本|较高 —[使]→ 药芯焊丝价格|昂贵
      R: 药芯焊丝|大多有缝 —[使]→ 焊丝镀铜能力|不能镀铜
      R: 焊丝镀铜能力|不能镀铜 —[使]→ 药芯焊丝|易生锈和吸湿
      R: 药芯焊丝|易生锈和吸湿 —[要求]→ 管理强度|加强
      R: 焊接烟尘|很大 —[污染]→ 环境|受污染
      R: 焊接烟尘|很大 —[影响]→ 人体健康|受不利影响
      R: 送丝设备|非专用送丝机 —[使]→ 药芯焊丝|压扁
      R: 药芯焊丝|压扁 —[降低]→ 送丝稳定性|降低

  - id: context_000608
    difficulty_tags: [共同触发条件, 送丝改进, 固定送丝力]
    construction_rationale: 药芯焊丝较软、使用实心焊丝送丝机且采用单主动轮，是正压力过大并压扁焊丝的共同场景。改进措施要求双主动轮和U形槽同时使用；送丝力不变限定措施效果，最终降低对焊丝的压力。远距250A候选与本段设备机理无关。
    output: |-
      规则组1
      C: 焊丝类型|药芯焊丝 + 焊丝刚度|较软 + 送丝机类型|实心焊丝送丝机 + 送丝方式|单主动轮
      R: 送丝正压力|过大 —[使]→ 药芯焊丝|压扁
      规则组2
      C: 送丝力|保持不变
      R: 送丝方式|双主动轮 + 送丝轮面|开U形槽 —[减小]→ 送丝轮对焊丝压力|减小

  - id: context_000610
    difficulty_tags: [参数匹配, 比例趋势, 调整幅度, 图片核对]
    construction_rationale: 药芯焊丝CO2焊是共同场景。电流增加要求电压成比例提高；某一固定电流下的“5~6V”表示电压可调整幅度，不是电弧电压绝对值。φ1.2mm焊丝的电流范围和电压要求分别绑定。图片视觉估值与正文数字不一致时以正文为金标。
    output: |-
      规则组1
      C: 焊接方法|药芯焊丝CO2焊
      R: 焊接电流|增加 —[要求]→ 电弧电压|成比例提高
      R: 焊接电流|固定某一数值 —[对应]→ 电弧电压可调整幅度|5~6V
      R: 焊丝直径|φ1.2mm —[对应]→ 焊接电流调节范围|130~320A
      R: 焊丝直径|φ1.2mm —[对应]→ 电弧电压要求范围|20~33V

  - id: context_000613
    difficulty_tags: [阶段链, 缩颈小桥, 再引燃]
    construction_rationale: 药芯焊丝短路过渡限定四个阶段。短路后熔滴铺展；电流增加形成缩颈，缓慢增加使缩颈细化成小桥，小桥破断后熔滴分离；分离又使电流迅速降低，并在小电流时再引燃。按阶段顺序保留相邻关系，不把所有阶段压成单条规则。
    output: |-
      规则组1
      C: 焊接方法|药芯焊丝电弧焊 + 熔滴过渡形式|短路过渡
      R: 短路|发生 —[使]→ 熔滴金属|向熔池铺展
      R: 焊接电流|增加 —[形成]→ 焊丝与熔滴间缩颈|出现
      R: 焊接电流|缓慢增加 —[使]→ 缩颈|细化并形成小桥
      R: 小桥|破断 —[使]→ 熔滴|分离
      R: 熔滴|分离 —[使]→ 焊接电流|迅速降低
      R: 焊接电流|降低至较小 —[使]→ 电弧|再引燃

  - id: context_000814
    difficulty_tags: [相位控制, 独立调节, 交替导通, 图片核对]
    construction_rationale: 双丝高效MAG且两弧由直流脉冲电源供电是共同场景。相位差180°避免同极性吸引，协同装置形成所需波形并允许参数独立调节；一个脉冲一滴是脉冲过程特征。5~7mm间距形成共同熔池，两弧交替导通减少干扰，图片用于核对相位和交替过程。
