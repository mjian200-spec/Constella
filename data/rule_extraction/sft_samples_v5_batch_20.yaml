      [unit_002531; type=passage; page=228]

      $\mathrm{CO}_{2}$ 气体是无色、无味和无毒的气体，其密度为空气密度的1.5倍，沸点为 $-78.9^{\circ} \mathrm{C}$ ，在常压下冷却时，气体将直接变成固体干冰。升高温度时，固态 $\mathrm{CO}_{2}$
      又直接变成气体。 $\mathrm{CO}_{2}$ 气体在较高压力下能变成无色液体，其密度随温度的变化而变化。当温度低于 $-11^{\circ} \mathrm{C}$ 时，液态 $\mathrm{CO}_{2}$ 比水重；当温度高于
