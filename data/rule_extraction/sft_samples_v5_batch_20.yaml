      $\mathrm{CO}_{2}$ 的多少。因为气瓶内除存在液态 $\mathrm{CO}_{2}$ 外，还存在气态 $\mathrm{CO}_{2}$ 。瓶内的气体压力是气态 $\mathrm{CO}_{2}$ 的饱和蒸气压，该压力的大小与环境的温度有关。当温度为
