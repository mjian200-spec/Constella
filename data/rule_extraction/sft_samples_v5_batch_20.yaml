    prompt_version: base@6+text@2
  input:
    text: '上下文包编号: context_001642


      标题路径:

      第2章 焊接电弧 > 2.5 焊接用保护气体 > 2.5.4 焊接方法与保护气体的选择


      核心正文:

      [unit_000893; type=passage; page=79]

      气体保护焊应用初期主要使用单一气体，如氩、氦、氢和 $\mathrm{CO}_{2}$ 气等。后来，人们发现在这些气体中掺入少量的其他气体的混合气体具有更好的性能，这就为选择保护气体提供了更为广泛的空间。


      支撑内容:

      [unit_000891; type=passage; page=79]

      近年来又出现了使用四元混合气体的TIME（Transferred Ionized Molten Energy）焊，它是一种高性能MAG焊，气体成分（体积分数）为 $\mathrm{Ar}65\% +\mathrm{He}26.5\%$
      $+ \mathrm { C O } _ { 2 } 8 \% + \mathrm { O } _ { 2 } 0 . 5 \%$ 。这种方法采用 $\phi 1.2\mathrm{mm}$ 焊丝，焊丝伸出长度为 $25\sim 35\mathrm{mm}$
      最大送丝速度达到 $28\sim 50\mathrm{m / min}$ 。可见，此方法是一种高熔敷效率的焊接方法，最大可达到 $450\mathrm{g / min}$ 。而 $\mathrm{CO}_{2}$ 用 $\phi 1.6\mathrm{mm}$
