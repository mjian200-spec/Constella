    text: "上下文包编号: context_000208\n\n标题路径:\n第3章 熔滴过渡与焊缝成形 > 3.2 熔滴过渡 > 3.2.2 熔滴上的作用力\n\n包条件（已由上游确定作用域）:\n- [constraint_000240]\
