      \  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_001153\", \"end_unit_id\": \"unit_001185\", \"target_unit_ids\"\
      : [], \"candidate_ranges\": []}\n  [unit_001153; type=passage; page=102]\n  $\\rho / \\sigma$ 越大时，则熔滴越细小。显然在焊接电流较小时进行立焊和仰焊的情况下，重力将阻碍熔滴过渡。\n\
      \n核心正文:\n[unit_001162; type=passage; page=102]\n电磁力对熔滴过渡也有阻碍力和促进力之分。电磁力直接帮助熔滴脱落的例子如图3-12所示。与水滴的情况类似，较小的熔滴与液面短路的场合，容易形成稳定于焊丝端部与熔池液面间的液柱，并保持短路形态而不破断。然而，当这个液柱中流过较大的电流时，受到电磁收缩力的作用，液柱将会收缩，电流通道变窄，收缩区中心的压力进一步增大，从而产生轴向上的压力梯度。驱使液体从颈缩部位向膨胀部位流动，即促进熔滴向熔池过渡（见图3-12a）。\n\
      \n支撑内容:\n[unit_001131; type=title; page=101]\n3.2.2 熔滴上的作用力\n\n资源文字化:\n[unit_001169; type=figure; page=103]\n题注: c)\
