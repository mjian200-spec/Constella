    difficulty_tags: [图片趋势, 角度最值, 参数作用]
    construction_rationale: TIG焊是共同场景。正文明确钨极端部几何形状影响熔池电弧力，并指出45°时压力最大。图2-38进一步明确在图示试验范围内电流增大使压力增大、相同电流下端部角度越小压力越大；这些是图中稳定可辨的趋势，不抄录散点近似数值。
