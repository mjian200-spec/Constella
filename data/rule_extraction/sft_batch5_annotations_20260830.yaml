      R: 焊接接头形式|水平对接 —[对应]→ 保护气体覆盖效果|较好
      R: 焊接接头形式|内角焊缝 —[对应]→ 保护气体覆盖效果|较好
      R: 焊接接头形式|外角焊缝 —[对应]→ 保护气体覆盖效果|较差
      R: 焊接接头形式|端角焊缝 —[对应]→ 保护气体覆盖效果|较差
      R: 保护气体覆盖效果|较差 —[要求采取]→ 加强保护措施|必要

