    difficulty_tags: [位置比较, 间隙趋势, 层数比较, 图片核对]
    construction_rationale: MIG焊是共同场景。横焊、仰焊与平焊的气孔倾向应写为同属性比较，不能仅说“产生气孔”而丢失基准；根部间隙增大对应气孔减少；多层焊与单道焊也保持同属性比较。图片核对间隙总体趋势，但局部末端回升未获正文确认，不额外抽取。
    output: |-
