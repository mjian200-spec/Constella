    construction_rationale: 接头形式直接参与覆盖能力关系，C为空。水平对接、内角、外角和端角是四种备选接头，当前DSL不使用OR，因此逐项拆分；前两者保护效果较好，后两者较差。较差效果再触发加强保护的必要措施，不把四种接头用“及”或“或”塞进同一状态。
    output: |-
