    construction_rationale: 交流短路过渡MIG/MAG焊限定当前试验。正文借图表明确I_en增大同时使过渡频率和焊接电流减小、熔滴增大，三个结果分别输出；熔滴增大被原文解释为熔化系数提高，再建立说明关系。表格用于核对趋势和固定试验参数，不强制转录每个单元格。
