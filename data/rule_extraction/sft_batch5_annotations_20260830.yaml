  - id: context_000021
    difficulty_tags: [辐射电离链, 方法比较, 共同场景]
    construction_rationale: 一般焊接电弧是本段共同场景。电弧发出多频率辐射并向气体粒子供能，中性粒子接受能量后可能激励或电离，两种结果分别表达；电离再产生带电粒子并维持导电。最后保留光辐射制造带电粒子次要于碰撞传递的同属性比较，不把远距阈值候选加入C。
    output: |-
      规则组1
      C: 焊接电弧|一般焊接电弧
      R: 电弧|发出多种频率光辐射 —[提供]→ 气体粒子辐射能量|增加
      R: 中性粒子|接受弧光辐射能 —[产生]→ 中性粒子状态|激励
      R: 中性粒子|接受弧光辐射能 —[产生]→ 中性粒子状态|电离
      R: 中性粒子|电离 —[产生]→ 带电粒子|增加
      R: 带电粒子|增加 —[维持]→ 电弧导电|持续
      R: 光辐射传递|制造带电粒子的重要性 —[低于]→ 碰撞传递|制造带电粒子的重要性

  - id: context_000208
    difficulty_tags: [液柱短路, 电磁收缩链, 图片核对]
    construction_rationale: 较小熔滴与熔池液面短路是液柱形成及后续过程的共同场景，较大电流则直接触发电磁收缩，放在R输入而非C。按液柱收缩、电流通道变窄、中心压力增大、形成轴向压力梯度、液体流动和促进过渡逐级抽取；图3-12只核对受力方向。
    output: |-
      规则组1
      C: 熔滴尺寸|较小 + 熔滴与熔池液面|短路
      R: 熔滴与熔池液面|短路 —[形成]→ 焊丝端部与熔池间液柱|稳定
      R: 液柱电流|较大 —[产生]→ 电磁收缩力|作用
      R: 电磁收缩力|作用 —[使]→ 液柱|收缩
      R: 液柱|收缩 —[使]→ 电流通道|变窄
      R: 电流通道|变窄 —[使]→ 收缩区中心压力|增大
      R: 收缩区中心压力|增大 —[形成]→ 轴向压力梯度|存在
      R: 轴向压力梯度|存在 —[驱使]→ 液体流动方向|由颈缩部位流向膨胀部位
      R: 液体|由颈缩部位流向膨胀部位 —[促进]→ 熔滴向熔池过渡|发生

  - id: context_000214
    difficulty_tags: [阈值, 压缩机理, 截断句]
    construction_rationale: 熔化极气体保护焊是共同场景。纯CO2只是“CO2体积分数达到30%以上”的极端示例，不另造一条重复充分条件。闭合证据支持CO2比例达到阈值后压缩作用使电弧集中，再使斑点电流密度增大；末尾“从而产生”缺少结果，必须停止抽取。
    output: |-
      规则组1
      C: 焊接方法|熔化极气体保护焊
      R: 保护气体中CO2体积分数|30%以上直至纯CO2 —[增强]→ CO2气体压缩作用|增强
      R: CO2气体压缩作用|增强 —[使]→ 电弧|集中
      R: 电弧|集中 —[使]→ 斑点处电流密度|较大

