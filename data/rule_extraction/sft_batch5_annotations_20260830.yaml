      R: 横焊|气孔产生倾向 —[大于]→ 平焊|气孔产生倾向
      R: 仰焊|气孔产生倾向 —[大于]→ 平焊|气孔产生倾向
      R: 根部间隙|增大 —[使]→ 气孔数量|减少
      R: 多层焊|气孔产生倾向 —[大于]→ 单道焊|气孔产生倾向

