  - id: context_002017
    difficulty_tags: [标准要求, 成分上下限, 数值绑定]
    construction_rationale: CO2作为焊接保护气体是共同适用场景。GB/T6052—1993Ⅱ类一级是两个成分限值的共同标准来源：CO2体积分数不低于99.5%，水分质量分数不高于0.005%。两个数值分别绑定正确成分与分数类型，不把“纯度不低于标准”重复放入R输入。
    output: |-
      规则组1
      C: 保护气体|焊接用CO2
      R: 气体标准等级|GB/T6052—1993Ⅱ类一级 —[要求]→ CO2体积分数|≥99.5%
      R: 气体标准等级|GB/T6052—1993Ⅱ类一级 —[要求]→ H2O质量分数|≤0.005%

