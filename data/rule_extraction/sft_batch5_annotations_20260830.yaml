    difficulty_tags: [同属性比较, 材料厚度约束, 裸事实改写, 截断句]
    construction_rationale: 熔深比较只在焊接参数和设备相同时成立，比较两端均保留焊法与熔深属性。板厚12mm以下不锈钢是无需坡口、一次完成和单面焊双面成形的共同适用范围，三项均改写成完整关系。末尾活性剂分解作用被截断，不从常识补充机理。
    output: |-
      规则组1
      C: 焊接参数|相同 + 焊接设备|相同
      R: 活性焊剂TIG焊|熔深 —[比常规TIG焊增加1~3倍]→ 常规TIG焊|熔深
      规则组2
      C: 焊接方法|活性焊剂TIG焊 + 母材材质|不锈钢 + 板厚|12mm以下
      R: 焊接工艺|实施 —[允许]→ 坡口|无需开设
      R: 焊接工艺|实施 —[允许]→ 焊接道次|一次完成
      R: 焊接工艺|实施 —[实现]→ 焊缝成形|单面焊双面成形

  - id: context_000600
    difficulty_tags: [禁止操作, 多后果拆分, 推荐起弧步骤]
    construction_rationale: CO2焊起弧是共同场景。焊丝接触母材与按下按钮由原文“在这种情况下”证明需共同成立，使用加号并分别连接飞溅、堵塞、反烧和烧毁；堵塞到端头粘连保留相邻链。正确操作拆成先保持距离、再允许按下开关，避免把“要求”箭头方向写反。
    output: |-
      规则组1
      C: 焊接方法|CO2焊 + 操作阶段|起弧
      R: 焊丝与母材|接触 + 焊枪按钮|按下 —[造成]→ 飞溅|很大
      R: 焊丝与母材|接触 + 焊枪按钮|按下 —[造成]→ 导电嘴|堵塞
      R: 导电嘴|堵塞 —[使]→ 焊丝与导电嘴端头|粘连
      R: 焊丝与母材|接触 + 焊枪按钮|按下 —[可能造成]→ 导电嘴|反烧
      R: 焊丝与母材|接触 + 焊枪按钮|按下 —[可能造成]→ 导电嘴|烧毁
      R: 起弧准备|进行 —[要求]→ 焊丝端头与母材表面距离|保持一定距离
      R: 焊丝端头与母材表面距离|保持一定距离 —[允许]→ 焊枪开关|按下

  - id: context_000612
    difficulty_tags: [位置约束, 缺陷原因, 操作参数, 图片核对]
    construction_rationale: 药芯焊丝CO2立向下角焊限定全部规则。熔敷金属下淌分别导致熔合不良和夹渣；焊枪倾角绑定5°~15°，不能输出裸角度。直线运条是防止夹渣的明确措施；原文“不应横向摆动”作为同一措施的限制说明，不再制造对象含糊的禁止规则。图片仅核对层道和参数范围。
    output: |-
      规则组1
      C: 焊接方法|药芯焊丝CO2焊 + 焊接位置|立向下角焊
      R: 熔敷金属|易向下淌 —[容易产生]→ 熔合不良|发生
      R: 熔敷金属|易向下淌 —[容易产生]→ 夹渣|发生
      R: 焊枪|向下倾斜 —[对应]→ 焊枪倾角|5°~15°
      R: 运条方式|直线运条且不横向摆动 —[防止]→ 夹渣|发生

  - id: context_000813
    difficulty_tags: [同向电流, 电弧吸引链, 共同措施, 气体替代]
    construction_rationale: 双丝高效MAG焊是共同场景。同向电流先导致两电弧相互吸引，再分别造成电弧不稳和飞溅，保持因果链。选脉冲电流与优化波形由“同时”证明为共同措施，可放在同一R输入；三元气体整体作为一个保护气体成分状态替代二元气体，内部加号不拆实体。
    output: |-
      规则组1
      C: 焊接方法|双丝高效MAG焊
      R: 两根焊丝电流方向|相同 —[使]→ 两个电弧|相互吸引
      R: 两个电弧|相互吸引 —[使]→ 电弧稳定性|降低
      R: 两个电弧|相互吸引 —[产生]→ 飞溅|发生
      R: 脉冲电流|选用 + 脉冲电流波形|优化 —[用于提高]→ 电弧稳定性|提高
      R: 保护气体|Ar + CO2 + O2三元气体 —[替代]→ 保护气体|二元气体

  - id: context_000825
    difficulty_tags: [尺寸要求链, 工艺不足, 段落边界]
    construction_rationale: 本段先描述单独激光焊的限制，再说明激光—MIG复合焊能够弥补。聚焦光斑不大于0.6mm分别提高坡口间隙和跟踪精度要求；尚未形成熔池限定激光热效率低。末句只概括复合焊能弥补这些不足，具体原因在后文，当前包不提前补造。
    output: |-
      规则组1
      C: 无
      R: 激光束|聚焦 —[形成]→ 光斑直径|0.6mm以下
      R: 聚焦光斑直径|0.6mm以下 —[要求]→ 坡口装配间隙|小
      R: 聚焦光斑直径|0.6mm以下 —[要求]→ 焊缝跟踪精度|高
      R: 激光焊接状态|尚未形成熔池 —[对应]→ 激光热效率|很低
      R: 焊接方法|激光—MIG复合焊 —[弥补]→ 单独激光焊上述不足|得到弥补

  - id: context_001010
    difficulty_tags: [碰撞类型, 动量守恒, 公式等价]
    construction_rationale: 非弹性碰撞的一般结论是总动量守恒；完全非弹性碰撞还增加碰后不分离和共同速度条件。动量守恒式以碰前总动量和碰后总动量作为等式两端，完整公式放入箭头；共同速度计算式另以初始质量与速度为输入，避免式号、自环或裸公式结果。
    output: |-
      规则组1
      C: 碰撞类型|非弹性碰撞
      R: 碰撞过程|发生 —[保持]→ 碰撞前后总动量|守恒
      规则组2
      C: 碰撞类型|完全非弹性碰撞
      R: 两粒子|碰撞 —[形成]→ 碰后分离状态|不再分离
      R: 碰前总动量|m₁u₁x+m₂u₂x —[$(m_1+m_2)v_x=m_1u_{1x}+m_2u_{2x}$]→ 碰后总动量|(m₁+m₂)vₓ
      R: 粒子质量与初速度|m₁、m₂、u₁x、u₂x —[$v_x=\frac{m_1u_{1x}+m_2u_{2x}}{m_1+m_2}$]→ 碰后共同速度|vₓ

