      R: 钨极端部几何形状|变化 —[影响]→ 电弧作用于熔池的力|变化
      R: 钨极端部角度|45° —[对应]→ 电弧压力|最大
      R: 焊接电流|增大 —[使]→ 电弧压力|增大
      R: 钨极端部角度|减小 —[使]→ 相同电流下电弧压力|增大

