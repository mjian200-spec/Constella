      \  [unit_002044; type=passage; page=182]\n  （1）方波交流TIG焊的工艺特点 正弦波交流TIG焊一方面提高了钨极的电流容量，另一方面又确保了阴极雾化作用和较大的熔深。但是进入EP极性半波必须施加较大的电弧再引燃电压。为了提高电弧再引燃的可靠性，关键是加快换向的速度，也就是尽量保持较高的电离度。当铝工件变为负时，先在工件表面积累正离子，使Al表面电场强度\
