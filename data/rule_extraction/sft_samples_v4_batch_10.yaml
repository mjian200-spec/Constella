  construction_rationale: 3000Hz高频、中低频和正弦波频率升高是三个不同作用域，分别建组。高频下电流与电压同向变化且过零所需再引燃电压较低；中低频仍需一定电压。正弦波频率升高后，过零变快，再结合热惯性导致电弧空间和电极来不及冷却，最终易再引燃。
