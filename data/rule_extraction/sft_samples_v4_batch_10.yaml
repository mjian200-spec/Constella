    text: '上下文包编号: context_000120


      标题路径:

      第2章 焊接电弧 > 2.3 交流电弧的特点 > 2.3.2 交流电弧动特性与电弧稳定性的关系


      核心正文:

      [unit_000704; type=passage; page=60]

      交流电频率对交流电弧的动特性有明显的影响，在一对热阴极材料（如钨极对钨极）的条件下， $3000\mathrm{Hz}$ 高频交流电弧焊接电流和电弧电压的关系几乎成比例变化，即随着焊接电流的增加，电弧电压增高，当焊接电流减小时，电弧电压也降低，焊接电流过零再引燃可以不需要那么高的再引燃电压。而在中频或低频的情况下，交流焊接电流过零时还要一定的再引燃电压。如图2-47所示是不同频率交流电弧的动特性曲线。对于正弦波，交流焊接电流频率增高时，要达到同样的焊接电流幅值，高频交流焊接电流过零变化快，由于焊接电弧的热惯性作用，使电弧空间及电极来不及冷却，当极性转换时很容易引燃电弧，造成图2-


      支撑内容:

      [unit_000689; type=title; page=59]

      2.3.2 交流电弧动特性与电弧稳定性的关系


      资源文字化:

      [unit_000711; type=figure; page=61]

