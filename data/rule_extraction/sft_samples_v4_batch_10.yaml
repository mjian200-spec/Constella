      : [], \"candidate_ranges\": []}\n  [unit_003646; type=passage; page=345]\n  脉冲焊可以扩大同种直径焊丝焊接电流的使用范围。熔化极脉冲氩弧焊的下限电流范围可以比普通熔化极氩弧焊的临界电流降低1/3左右，如图6-33所示。可以看出，脉冲焊在较小的平均电流时仍能稳定工作，有利于薄板焊接。\n\
