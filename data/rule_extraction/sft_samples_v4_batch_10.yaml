    text: "上下文包编号: context_000025\n\n标题路径:\n第2章 焊接电弧 > 2.1 电弧的物理基础 > 2.1.2 带电粒子的产生和消失\n\n包条件（已由上游确定作用域）:\n- [constraint_000004]\
      \ 电流: 低电压和大电流\n  来源 Unit: unit_000194\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_000194\", \"\
      end_unit_id\": \"unit_000470\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000194; type=passage; page=18]\n\
      \  由图2-2可见，在不同电流下有不同的放电形式。由于放电条件的影响，放电形式也将发生转化。在低电压和大电流条件下，将成为电弧放电。在电弧放电状态下，电弧中充满离子、电子、负离子和中性粒子等，为了保证电弧稳定，必须不断地产生带电粒子（离子、电子）。下面着重阐述电弧空间离子与电子的产生机理。\n\
      - [constraint_000006] 焊接电流: 焊接电流较小\n  来源 Unit: unit_000199\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
      : \"unit_000199\", \"end_unit_id\": \"unit_000480\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000199;\
      \ type=passage; page=19]\n  用电子伏（eV）为单位的能量转换为数值上相等的电压来处理，单位为伏（V）。因此在实际中常直接用电离电压（单位为V）来表示气体电离的难易。以伏（V）表示的电离电压在数值上等于以电子伏表示的电离能。要使中性气体粒子失去第二个电子则需要更大的电离电压，称为二次电离电压，生成的离子称为二价离子，这种电离称为二次电离，依此类推。普通焊接电弧中当焊接电流较小时只存在一次电离，而在大电流和压缩焊接电弧中，电弧温度达到几万度时可以出现二次或三次电离，即使这种情况下，一次电离仍居主要地位，所以一般书籍中只列出各种气体一次电离的电离电压。自由状态气体原子的一次电离电压在3.9V(Cs)到24.5V(He)之间，二次电离电压在十几伏到几百伏之间。一次电离电压低的粒子，二次电离电压不一定还低，这由粒子的原子结构决定。电弧气氛中可能遇到的气体粒子的电离电压见表2-1。\n\
      - [constraint_000028] 电压: $4.3\\mathrm{V}$\n  来源 Unit: unit_000263\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
      : \"unit_000263\", \"end_unit_id\": \"unit_000487\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000263;\
      \ type=passage; page=24]\n  萨哈公式是单一气体热电离度的表达式，如果某气体中混有其他成分时，各种气体电离程度不一样，此时电子密度与电离前中性粒子密度的比例称为实效电离度。混合气体的电离电压称为实效电离电压。利用萨哈公式求实效电离度时需代入实效电离电压。理论与实际都证明混合气体的实效电离电压主要决定于电离电压较低的气体成分，即使这种气体占有较小的比例。例如铁蒸气中混有钾蒸气时，其实效电离电压与混入的钾蒸气的比例关系如图2-5所示。铁蒸气电离电压为\
      \ $7.9\\mathrm{V}$ ，而钾蒸气的电离电压为 $4.3\\mathrm{V}$ 。当钾蒸气质量分数超过 $5\\%$ 时，则实效电离电压显著下降而接近钾的电离电压。因此，电弧焊时为了提高电弧的稳定性，在电弧气氛中只需要加入少量的低电离电压物质即可取得显著的效果。\n\
      - [constraint_000030] explicit_condition: 电弧气氛中含有 $\\mathrm{Ca}$ 、Fe、 $\\mathrm{O}_2$ 、 $\\mathrm{H}_{2}$\n  来源 Unit:\
      \ unit_000267\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_000267\", \"end_unit_id\": \"unit_000283\"\
      , \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000267; type=passage; page=25]\n  电离电压的差别而显著不同，低电离电压气体的电离过程在提供电弧需要的带电粒子方面起着关键作用。例如当电弧气氛中含有\
      \ $\\mathrm{Ca}$ 、Fe、 $\\mathrm{O}_2$ 、 $\\mathrm{H}_{2}$ 时（电离电压分别为 $6.1\\mathrm{V}$ 、 $7.8\\mathrm{V}$ 、 $12.2\\mathrm{V}$\
      \ 、 $15.4\\mathrm{V}$ ），当温度为 $5000\\mathrm{K}$ 、气压为 $1\\mathrm{atm}$ （101.325kPa）时，其电离度之比如下：\n- [constraint_000032]\
      \ 温度: $5000\\mathrm{K}$ 、气压为 $1\\mathrm{atm}$ （1\n  来源 Unit: unit_000267\n  作用域: {\"scope_type\": \"unit_range\", \"\
      start_unit_id\": \"unit_000267\", \"end_unit_id\": \"unit_000270\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n\
      \  [unit_000267; type=passage; page=25]\n  电离电压的差别而显著不同，低电离电压气体的电离过程在提供电弧需要的带电粒子方面起着关键作用。例如当电弧气氛中含有 $\\mathrm{Ca}$ 、Fe、\
      \ $\\mathrm{O}_2$ 、 $\\mathrm{H}_{2}$ 时（电离电压分别为 $6.1\\mathrm{V}$ 、 $7.8\\mathrm{V}$ 、 $12.2\\mathrm{V}$ 、 $15.4\\mathrm{V}$\
      \ ），当温度为 $5000\\mathrm{K}$ 、气压为 $1\\mathrm{atm}$ （101.325kPa）时，其电离度之比如下：\n\n核心正文:\n[unit_000270; type=passage; page=25]\n\
      一般在常压下的焊接电弧中，电子是电弧的主要带电粒子，电子密度的数量级为 $10^{14}$ 个 $\\mathrm{cm}^3$ 时，即可维持电弧的正常导电。实效电离度为 $10^{-4}$ 数量级时即可满足小电流电弧导电的需要，亦即1万个中性粒子中有一个中性粒子被电离即可。一般焊接电弧的电离度只有\
      \ $0.1\\times 10^{-3}\\sim 0.6\\times 10^{-3}$ 的数量级。而在强迫冷却、强迫压缩或大电流的电弧\n\n支撑内容:\n[unit_000193; type=title; page=18]\n\
      2.1.2 带电粒子的产生和消失"
  output: '规则组1

    C: 焊接电弧|常压

    R: 电弧带电粒子|组成 —[主要为]→ 带电粒子类型|电子

    R: 电子密度|10^14个/cm³数量级 —[可维持]→ 电弧导电状态|正常

    R: 实效电离度|10^-4数量级 —[可满足]→ 小电流电弧导电需要|满足

    R: 中性粒子总数|1万个 —[对应]→ 被电离中性粒子数量|1个

    R: 一般焊接电弧|电离度 —[对应]→ 电离度数量级|0.1×10^-3~0.6×10^-3'
