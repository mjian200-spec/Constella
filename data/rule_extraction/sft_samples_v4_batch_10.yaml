    text: "上下文包编号: context_000442\n\n标题路径:\n第5章 $\\mathrm{CO}_{2}$ 气体保护焊 > 5.2 $\\mathrm{CO}_{2}$ 焊的冶金特点与焊接材料 > 5.2.2 焊缝金属中的气孔\n\
      \n包条件（已由上游确定作用域）:\n- [constraint_000495] 温度: 焊缝金属的凝固温度\n  来源 Unit: unit_002437\n  作用域: {\"scope_type\": \"unit_range\"\
      , \"start_unit_id\": \"unit_002437\", \"end_unit_id\": \"unit_002476\", \"target_unit_ids\": [], \"candidate_ranges\"\
      : []}\n  [unit_002437; type=passage; page=220]\n  如果在焊缝金属中硅的质量分数大于 $0.2\\%$ 时，就可以防止CO气体所引起的气孔。这是由于在焊缝金属的凝固温度时硅具有强烈的脱氧作用［见方程式(5-13)]。硅与氧化亚铁作用而阻止了碳的氧化。除了硅作为脱氧元素以外，还可以加入锰、钛和铝等。在现代工业中由于使用了脱氧焊丝，而使得\
      \ $\\mathrm{CO}_{2}$ 气体保护焊可以得到致密的焊缝。\n\n核心正文:\n[unit_002444; type=passage; page=221]\n气体湿度的增加，焊接区域中氢的分压随之提高，同时氢在焊缝金属中的含量也提高，见表5-2。当\
      \ $\\mathrm{CO}_{2}$ 气体中含水量为 $1.92\\mathrm{g} / \\mathrm{m}^3$ 时， $100\\mathrm{g}$ 焊缝金属中的含氢量为 $4.7\\mathrm{mL}$ ，这时将开始出现单个气孔。如果进一步增加\
      \ $\\mathrm{CO}_{2}$ 气体的含水量，则焊缝中气孔的数量也增加。控制氢气孔最有效的办法是减少 $\\mathrm{CO}_{2}$ 气体中的水分（通常用露点来表示），目前大\n\n支撑内容:\n[unit_002435;\
      \ type=title; page=220]\n5.2.2 焊缝金属中的气孔\n\n资源文字化:\n[unit_002447; type=table; page=221]\n题注: 表 5-2 ${\\mathrm{{CO}}}_{2}$\
