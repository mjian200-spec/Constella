      \ E = (U2 - U1) / L。图中分布着多个空心圆圈（O）和实心小圆点（•）。一条由实心小圆点组成的折线路径从下方U1线附近开始，向上延伸，路径上包含多个空心圆圈，表示电子（•）与气体原子（O）的相互作用或碰撞过程。路径整体呈锯齿状向上移动，最终到达上方U2线附近。"
