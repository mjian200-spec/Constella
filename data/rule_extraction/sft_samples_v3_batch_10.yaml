      \ page=104]\n  熔滴过渡形式，两者之间有着密切的对应关系，如图3-15所示。通常透过电焊玻璃在目视观察时，可以根据电弧形态判断熔滴过渡形式。如大滴过渡为束状电弧；射滴过渡为钟罩状电弧；射流过渡为锥状电弧。\n\n核心正文:\n\
      [unit_001195; type=passage; page=105]\n循，由于电流密度较小，斑点压力不大，所以对熔滴的排斥作用也不大。这时施加于熔滴上的主要作用力是重力和表面张力，只有当熔滴积聚成较大的液滴状的球滴之后，其表面张力再也不能维持它的重量时，熔滴便脱离焊丝而向熔池过渡（见图3-16），这时熔滴的尺寸主要决定于焊丝材料的性质，这一关系见式（3-13）和图3-11。\n\
      \n支撑内容:\n[unit_001186; type=title; page=104]\n3.2.3 熔化极气体保护焊的主要熔滴过渡形式\n\n资源文字化:\n[unit_001198; type=figure; page=105]\n\
      题注: b)  图3-16 大滴过渡形态\n原始文字:\nb)  图3-16 大滴过渡形态\n资源标题: 图3-16 大滴过渡形态\n资源描述: 该图包含左右两幅黑白照片，展示了大液滴的过渡形态。左图显示一个液滴附着在垂直表面或物体边缘，液滴主体呈亮白色，上方连接处较暗，背景为网格状纹理。右图显示液滴形态发生变化，液滴主体依然呈亮白色，但形状似乎更圆润或正在脱离，上方连接处依然可见，背景同样为网格状纹理。\n\
      \n[unit_001156; type=figure; page=102]\n题注: 图3-11 熔滴脱离之前焊丝端头熔滴的形状 $r / R$ 和焊丝材料性质 $\\frac{R^2\\rho g}{\\sigma}$ 的关系\n\
