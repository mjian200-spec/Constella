      \ 电流: 低电压和大电流\n  来源 Unit: unit_000194\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_000194\", \"\
      end_unit_id\": \"unit_000470\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000194; type=passage; page=18]\n\
      \  由图2-2可见，在不同电流下有不同的放电形式。由于放电条件的影响，放电形式也将发生转化。在低电压和大电流条件下，将成为电弧放电。在电弧放电状态下，电弧中充满离子、电子、负离子和中性粒子等，为了保证电弧稳定，必须不断地产生带电粒子（离子、电子）。下面着重阐述电弧空间离子与电子的产生机理。\n\
      - [constraint_000006] 焊接电流: 焊接电流较小\n  来源 Unit: unit_000199\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
      : \"unit_000199\", \"end_unit_id\": \"unit_000480\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000199;\
      \ type=passage; page=19]\n  用电子伏（eV）为单位的能量转换为数值上相等的电压来处理，单位为伏（V）。因此在实际中常直接用电离电压（单位为V）来表示气体电离的难易。以伏（V）表示的电离电压在数值上等于以电子伏表示的电离能。要使中性气体粒子失去第二个电子则需要更大的电离电压，称为二次电离电压，生成的离子称为二价离子，这种电离称为二次电离，依此类推。普通焊接电弧中当焊接电流较小时只存在一次电离，而在大电流和压缩焊接电弧中，电弧温度达到几万度时可以出现二次或三次电离，即使这种情况下，一次电离仍居主要地位，所以一般书籍中只列出各种气体一次电离的电离电压。自由状态气体原子的一次电离电压在3.9V(Cs)到24.5V(He)之间，二次电离电压在十几伏到几百伏之间。一次电离电压低的粒子，二次电离电压不一定还低，这由粒子的原子结构决定。电弧气氛中可能遇到的气体粒子的电离电压见表2-1。\n\
      - [constraint_000028] 电压: $4.3\\mathrm{V}$\n  来源 Unit: unit_000263\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
      : \"unit_000263\", \"end_unit_id\": \"unit_000487\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000263;\
      \ type=passage; page=24]\n  萨哈公式是单一气体热电离度的表达式，如果某气体中混有其他成分时，各种气体电离程度不一样，此时电子密度与电离前中性粒子密度的比例称为实效电离度。混合气体的电离电压称为实效电离电压。利用萨哈公式求实效电离度时需代入实效电离电压。理论与实际都证明混合气体的实效电离电压主要决定于电离电压较低的气体成分，即使这种气体占有较小的比例。例如铁蒸气中混有钾蒸气时，其实效电离电压与混入的钾蒸气的比例关系如图2-5所示。铁蒸气电离电压为\
      \ $7.9\\mathrm{V}$ ，而钾蒸气的电离电压为 $4.3\\mathrm{V}$ 。当钾蒸气质量分数超过 $5\\%$ 时，则实效电离电压显著下降而接近钾的电离电压。因此，电弧焊时为了提高电弧的稳定性，在电弧气氛中只需要加入少量的低电离电压物质即可取得显著的效果。\n\
      - [constraint_000052] 材料: 使用铜、钢、铝、镁等材料做电极\n  来源 Unit: unit_000381\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
      : \"unit_000381\", \"end_unit_id\": \"unit_000461\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000381;\
      \ type=passage; page=32]\n  在实际焊接电弧中，电极的最高温度不可能超过其材料的沸点，当使用沸点高的钨或碳作电极材料时（其沸点分别为5950K和4200K），电极可能被加热到很高温度（一般可达3600K以上），这种电弧称为热阴极电弧。这种电弧的阴极区主要靠热发射来提供电子。当使用铜、钢、铝、镁等材料做电极时，由于它们的沸点较低（Fe为3008K，Cu为2868K，A1为2770K，Mg为1375K），电极加热温度受材料沸点限制不可能很高，此种电弧称为冷阴极电弧。这种电弧阴极区不可能通过热发射来提供足够的电子，必须依靠其他方式发射电子，才能满足导电的需要。\n\
      - [constraint_000060] 温度: 温度很低\n  来源 Unit: unit_000389\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"\
      unit_000389\", \"end_unit_id\": \"unit_000487\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000389;\
      \ type=passage; page=33]\n  比较式(2-16)与式(2-17)可以看到，电场的存在相当于使电极材料的逸出功降低 $U_{\\mathrm{w}}^{\\prime} = U_{\\mathrm{w}} -\
      \ \\sqrt{eE / \\pi\\varepsilon_{0}}$ 。当温度很低时，甚至是 $0^{\\circ}\\mathrm{C}(T = 273\\mathrm{K})$ ，如果存在足够强的电场强度，也可以从电极发射足够数量的电子流密度以供电弧导电的需要。\n\
      - [constraint_000061] explicit_condition: 金属表面接受光辐射\n  来源 Unit: unit_000392\n  作用域: {\"scope_type\": \"unit_range\"\
      , \"start_unit_id\": \"unit_000392\", \"end_unit_id\": \"unit_000397\", \"target_unit_ids\": [], \"candidate_ranges\"\
      : []}\n  [unit_000392; type=passage; page=33]\n  （3）光发射 当金属表面接受光辐射时，也可以使金属表面自由电子能量增加，冲破金属表面的制约飞到金属外面来，这种现象称为光发射。光发射的条件为\n\
      \n核心正文:\n[unit_000396; type=passage; page=33]\n在式（2-19）中代入不同元素的逸出功数值，则可得出该元素光发射所要求的临界波长。常见的一些元素的光发射的临界波长见表2-7。\n\n支撑内容:\n\
      [unit_000193; type=title; page=18]\n2.1.2 带电粒子的产生和消失\n\n资源文字化:\n[unit_000397; type=table; page=33]\n题注: 表 2-7 常见元素光发射的临界波长\n\
      表格正文:\n<table><tr><td>金属种类</td><td>K</td><td>\\( \\mathrm{{Ca}} \\)</td><td>\\( \\mathrm{{Mg}} \\)</td><td>Al</td><td>Cu</td><td>Fe</td><td>W</td></tr><tr><td>\\\
      ( {\\lambda }_{0}^{\\prime }/\\left( {\\times {10}^{-{10}}\\mathrm{\\;m}}\\right) \\)</td><td>6118</td><td>5830</td><td>3270</td><td>2908</td><td>2835</td><td>2759</td><td>2747</td></tr></table>\n\
      原始文字:\n<table><tr><td>金属种类</td><td>K</td><td>\\( \\mathrm{{Ca}} \\)</td><td>\\( \\mathrm{{Mg}} \\)</td><td>Al</td><td>Cu</td><td>Fe</td><td>W</td></tr><tr><td>\\\
      ( {\\lambda }_{0}^{\\prime }/\\left( {\\times {10}^{-{10}}\\mathrm{\\;m}}\\right) \\)</td><td>6118</td><td>5830</td><td>3270</td><td>2908</td><td>2835</td><td>2759</td><td>2747</td></tr></table>\n\
      资源标题: 表 2-7 常见元素光发射的临界波长\n资源描述: 表格展示了不同金属种类对应的光发射临界波长数值。第一行表头为“金属种类”，列出了K、Ca、Mg、Al、Cu、Fe、W七种元素。第二行表头为“λ₀′ / (×10⁻¹⁰\
      \ m)”，表示波长单位。对应的数值依次为：K为6118，Ca为5830，Mg为3270，Al为2908，Cu为2835，Fe为2759，W为2747。\n\n[unit_000395; type=formula; page=33]\n\
      题注: \n原始文字:\n$$\\lambda_ {0} = \\frac {h c}{e U _ {\\mathrm {w}}} \\quad \\lambda_ {0} ^ {\\prime} = 1 2 3 6 0 \\frac\
      \ {1}{U _ {\\mathrm {w}}} \\times 1 0 ^ {- 1 0} \\mathrm {m} \\tag {2-19}$$\n公式摘要: 不同材料产生光发射所要求的临界波长 $\\lambda_0^{\\\
      prime}$ 与逸出功 $U_{\\mathrm{w}}$ 的关系\n符号释义: [{\"symbol\": \"\\\\lambda_0^{\\\\prime}\", \"meaning\": \"不同材料产生光发射所要求的临界波长\"\
      , \"unit\": \"\\\\times 10^{-10}\\\\mathrm{m}\", \"evidence_unit_ids\": [\"unit_000394\"]}, {\"symbol\": \"U_{\\\\mathrm{w}}\"\
      , \"meaning\": \"逸出功\", \"unit\": null, \"evidence_unit_ids\": [\"unit_000394\", \"unit_000396\"]}, {\"symbol\": \"\
      h\", \"meaning\": null, \"unit\": null, \"evidence_unit_ids\": []}, {\"symbol\": \"c\", \"meaning\": null, \"unit\"\
      : null, \"evidence_unit_ids\": []}, {\"symbol\": \"e\", \"meaning\": null, \"unit\": null, \"evidence_unit_ids\": []}]"
