    text: "上下文包编号: context_000013\n\n标题路径:\n第2章 焊接电弧 > 2.1 电弧的物理基础 > 2.1.2 带电粒子的产生和消失\n\n包条件（已由上游确定作用域）:\n- [constraint_000004]\
      \ 电流: 低电压和大电流\n  来源 Unit: unit_000194\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_000194\", \"\
      end_unit_id\": \"unit_000470\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000194; type=passage; page=18]\n\
      \  由图2-2可见，在不同电流下有不同的放电形式。由于放电条件的影响，放电形式也将发生转化。在低电压和大电流条件下，将成为电弧放电。在电弧放电状态下，电弧中充满离子、电子、负离子和中性粒子等，为了保证电弧稳定，必须不断地产生带电粒子（离子、电子）。下面着重阐述电弧空间离子与电子的产生机理。\n\
      - [constraint_000006] 焊接电流: 焊接电流较小\n  来源 Unit: unit_000199\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
      : \"unit_000199\", \"end_unit_id\": \"unit_000480\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000199;\
      \ type=passage; page=19]\n  用电子伏（eV）为单位的能量转换为数值上相等的电压来处理，单位为伏（V）。因此在实际中常直接用电离电压（单位为V）来表示气体电离的难易。以伏（V）表示的电离电压在数值上等于以电子伏表示的电离能。要使中性气体粒子失去第二个电子则需要更大的电离电压，称为二次电离电压，生成的离子称为二价离子，这种电离称为二次电离，依此类推。普通焊接电弧中当焊接电流较小时只存在一次电离，而在大电流和压缩焊接电弧中，电弧温度达到几万度时可以出现二次或三次电离，即使这种情况下，一次电离仍居主要地位，所以一般书籍中只列出各种气体一次电离的电离电压。自由状态气体原子的一次电离电压在3.9V(Cs)到24.5V(He)之间，二次电离电压在十几伏到几百伏之间。一次电离电压低的粒子，二次电离电压不一定还低，这由粒子的原子结构决定。电弧气氛中可能遇到的气体粒子的电离电压见表2-1。\n\
      - [constraint_000007] 温度: 几万度时可以出现二次或三次电离\n  来源 Unit: unit_000199\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
      : \"unit_000199\", \"end_unit_id\": \"unit_000278\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000199;\
      \ type=passage; page=19]\n  用电子伏（eV）为单位的能量转换为数值上相等的电压来处理，单位为伏（V）。因此在实际中常直接用电离电压（单位为V）来表示气体电离的难易。以伏（V）表示的电离电压在数值上等于以电子伏表示的电离能。要使中性气体粒子失去第二个电子则需要更大的电离电压，称为二次电离电压，生成的离子称为二价离子，这种电离称为二次电离，依此类推。普通焊接电弧中当焊接电流较小时只存在一次电离，而在大电流和压缩焊接电弧中，电弧温度达到几万度时可以出现二次或三次电离，即使这种情况下，一次电离仍居主要地位，所以一般书籍中只列出各种气体一次电离的电离电压。自由状态气体原子的一次电离电压在3.9V(Cs)到24.5V(He)之间，二次电离电压在十几伏到几百伏之间。一次电离电压低的粒子，二次电离电压不一定还低，这由粒子的原子结构决定。电弧气氛中可能遇到的气体粒子的电离电压见表2-1。\n\
      - [constraint_000009] 电压: $9.5\\mathrm{V}$\n  来源 Unit: unit_000202\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
      : \"unit_000202\", \"end_unit_id\": \"unit_000205\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000202;\
      \ type=passage; page=19]\n  不仅原子状态的气体粒子可以被电离，分子状态的气体粒子也可以直接被电离。当电子从气体分子中被分离出来时，一般情况下需要克服两层约束（原子对电子的约束和分子对电子的约束），所以需要的电离电压比原子状态时的电离电压要高一些，如H（原子）为\
      \ $13.5\\mathrm{V}$ ，而 $\\mathrm{H}_{2}$ （分子）为 $15.4\\mathrm{V}$ 。然而，也有些气体原子结合为分子时反而使电子和原子的联系减弱，故分子的电离电压反而比原子的电离电压低，如NO分子的电离电压为\
      \ $9.5\\mathrm{V}$ ，而N原子和O原子的电离电压分别为 $14.5\\mathrm{V}$ 和 $13.5\\mathrm{V}$ 。\n\n核心正文:\n[unit_000205; type=passage; page=20]\n\
      气体电离电压的高低说明电子脱离原子或分子所需要的外加能量的高低，亦即说明在某种气氛中产生带电粒子的难易，在相同的外加能量条件下，电离电压低的气体提供带电粒子较容易，从这个角度看，有利于电弧的稳定。但电离电压高低只是影响电弧稳定的许多因素之一，而不是唯一的因素。因为气体的其他性能（如解离性能、热物理性能等）反过来会影响整个电弧空间的能量状态、带电粒子的产生和移动过程等。因此，在分析焊接电弧现象时，不能仅从电弧气体的电离电压来分析，还需要考虑气体各种性质的综合作用。\n\
      \n支撑内容:\n[unit_000193; type=title; page=18]\n2.1.2 带电粒子的产生和消失"
