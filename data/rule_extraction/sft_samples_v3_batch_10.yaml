      \ R²ρg/σ 的关系\n资源描述: 该图为二维坐标图，展示了焊丝端头熔滴形状与材料性质的关系。横坐标为无量纲参数 (R²ρg/σ)，刻度从0到2.0，间隔0.4；纵坐标为半径比 r/R，刻度从0到3，间隔1。图中包含一条从左上方向右下方延伸的实线曲线，表示\
      \ r/R 随 (R²ρg/σ) 增大而减小。图中还绘制了四个不同形状的焊丝端头熔滴示意图，从左至右依次排列，对应横坐标逐渐增大的情况。最左侧的熔滴最大，标注了焊丝直径 2R 和熔滴最大半径 2r。随着横坐标数值增加，熔滴形状逐渐变细、变短，且与焊丝连接处的颈部变细。虚线箭头指示了熔滴形状随横坐标变化的趋势。\n\
