  input:
    text: "上下文包编号: context_000094\n\n标题路径:\n第2章 焊接电弧 > 2.2 电弧的能量转换 > 2.2.1 电弧的产热机构及温度分布\n\n包条件（已由上游确定作用域）:\n- [constraint_000091]\
      \ 电流: 电流较大有等离子流产生\n  来源 Unit: unit_000501\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_000501\"\
      , \"end_unit_id\": \"unit_000556\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000501; type=passage;\
      \ page=43]\n  一般电弧焊过程中，弧柱的热量不能直接用于对焊条（焊丝）和母材的加热，只能有很少一部分热量通过辐射传给焊条（焊丝）和焊件。当电流较大有等离子流产生时，等离子流将把弧柱的一部分热量带到焊件[因为等离子流一般是由焊条（焊丝）流向焊件]，增加焊件的热量。\n\
      - [constraint_000092] 焊接电流: 焊接电流一定的\n  来源 Unit: unit_000536\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
      : \"unit_000536\", \"end_unit_id\": \"unit_000565\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000536;\
      \ type=passage; page=45]\n  由式（2-30）可见：在焊接电流一定的条件下，两个电极区的产热量之和决定于阴极和阳极压降数值的大小。前边已讲过，弧柱部分的热量通过辐射和对流影响焊条（焊丝）与母材的加热与熔化，但这种加热作用是很小的，同时在通常情况下两极压降\
      \ $(U_{\\mathrm{A}} + U_{\\mathrm{C}})$ 的数值都大于弧柱压降。表2-10给出了几种典型电弧 $U_{\\mathrm{A}} + U_{\\mathrm{C}}$ 与弧柱电场强度的数值比较。\n\
      \n核心正文:\n[unit_000543; type=passage; page=46]\n例如，在一般焊条电弧焊时，焊条未深入到熔池中的情况下，电弧电压数值为 $25\\mathrm{V}$ ，而阴极与阳极电压降之和（ $U_{\\\
      mathrm{C}} + U_{\\mathrm{A}}$ ）为 $19\\mathrm{V}$ ，则 $\\lambda = \\frac{19}{25} = 0.76$ ，与表2-9中的数据相符。对熔化极惰性气体保护焊或 $\\\
      mathrm{CO}_{2}$ 气体保护焊也有类似的情况，在 $\\mathrm{CO}_{2}$ 气体保护焊短路过渡焊接时， $U_{\\mathrm{C}} + U_{\\mathrm{A}} = 18\\mathrm{V}$\
      \ 左右，而电弧电压为 $20\\sim$ $21\\mathrm{V}$ ，则 $\\lambda = \\frac{18}{21} = 0.86$ 。 $\\mathrm{CO}_{2}$ 气体保护焊中等参数焊接时，电弧长度大，电弧电压数值较高，若焊丝不插入熔池则电弧的有效功率因数有所下降。\n\
      \n支撑内容:\n[unit_000493; type=title; page=42]\n2.2.1 电弧的产热机构及温度分布\n\n资源文字化:\n[unit_000530; type=table; page=45]\n题注: 表\
      \ 2-9 各种弧焊方法的有效功率因数 $\\lambda$ \n表格正文:\n<table><tr><td>弧焊方法</td><td>λ</td><td>弧焊方法</td><td>λ</td></tr><tr><td>焊条电弧焊</td><td>0.65~0.85</td><td>熔化极氩弧焊(MIG)</td><td>0.70~0.80</td></tr><tr><td>埋弧焊</td><td>0.80~0.90</td><td>钨极氩弧焊(TIG)</td><td>0.65~0.70</td></tr><tr><td>CO2气体保护焊</td><td>0.75~0.90</td><td></td><td></td></tr></table>\n\
      原始文字:\n<table><tr><td>弧焊方法</td><td>λ</td><td>弧焊方法</td><td>λ</td></tr><tr><td>焊条电弧焊</td><td>0.65~0.85</td><td>熔化极氩弧焊(MIG)</td><td>0.70~0.80</td></tr><tr><td>埋弧焊</td><td>0.80~0.90</td><td>钨极氩弧焊(TIG)</td><td>0.65~0.70</td></tr><tr><td>CO2气体保护焊</td><td>0.75~0.90</td><td></td><td></td></tr></table>\n\
      资源标题: 表 2-9 各种弧焊方法的有效功率因数 $\\lambda$ \n资源描述: 表格列出了不同弧焊方法对应有效功率因数 $\\lambda$ 的数值范围。表头分为左右两组，每组包含“弧焊方法”和“$\\lambda$”两列。左侧数据包括：焊条电弧焊（0.65~0.85）、埋弧焊（0.80~0.90）、CO2气体保护焊（0.75~0.90）。右侧数据包括：熔化极氩弧焊(MIG)（0.70~0.80）、钨极氩弧焊(TIG)（0.65~0.70）。"
