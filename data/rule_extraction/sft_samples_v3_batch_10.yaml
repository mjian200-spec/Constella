  construction_rationale: 两个算例分别以焊接方法和工艺状态作C，电压降之和与电弧电压是共同计算输入，不能拆成两个独立充分条件。中等参数CO2焊的长弧、电压升高和有效功率因数下降保持因果链。表2-9被正文用于核对算例，五种方法的范围逐行抽取并绑定有效功率因数属性。
  source:
