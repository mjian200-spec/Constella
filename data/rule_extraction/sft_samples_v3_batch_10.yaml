      \ 当气体中不存在电场时，无论是带电粒子还是中性粒子，总体看来只作无规则无定向的运动且相互频繁地碰撞。此时粒子的动能主要决定于气体的温度。当气体中有电场作用时，则带电粒子除了作无规则的热\n\n核心正文:\n[unit_000285;\
      \ type=passage; page=26]\n运动外，还产生一个受电场影响的定向运动。正、负带电粒子定向运动、方向相反，电场对带电粒子在电场方向的运动起加速作用，电能将转换为带电粒子的动能。当带电粒子的动能在电场的影响下增加到足够的数值，则可能与中性粒子产生非弹性碰撞而使之电离，这种电离称为电场作用下的电离。由于带电粒子是在充满气体粒子的空间运动，事实上它将一边与气体粒子发生碰撞，一边沿着电场方向运动，如图2-7所示。其总的运动趋势虽与电场方向一致，但是每次碰撞后的运动方\n\
