    text: "上下文包编号: context_000807\n\n标题路径:\n第6章 熔化极氩弧焊 > 6.6 先进的MIG焊方法 > 6.6.1 TIME焊\n\n包条件（已由上游确定作用域）:\n- [constraint_000917]\
      \ 送丝速度: 传统MAG焊工艺的两倍以上\n  来源 Unit: unit_004084\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_004084\"\
      , \"end_unit_id\": \"unit_004115\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_004084; type=passage;\
      \ page=410]\n  TIME焊工艺是由经过新的电源技术、强有力的送丝系统、遵循相关的气体物理性质而设计的焊接设备和完善的工艺参数相结合而共同作用所得的结果。它对焊接电源、送丝机构、焊枪、焊丝和保护气体提出了更高的要求。工艺上采用大的焊丝伸出长度，并以四元混合气体作为保护气体，在保证焊接质量的前提下，将送丝速度提高到传统MAG焊工艺的两倍以上，大幅度提高了焊丝熔敷效率。由于TIME焊工艺所使用的送丝速度远远超过传统工艺的适用范围，人们通常以送丝速度这一参数表征TIME焊工艺。\n\
      - [constraint_000919] 电流: 大电流\n  来源 Unit: unit_004094\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"\
      unit_004094\", \"end_unit_id\": \"unit_004115\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_004094;\
      \ type=passage; page=411]\n  综合上述分析可见，TIME气体与纯Ar相比，提高了电弧的电场强度，使电弧上爬高度降低，而有利于焊丝端头的液流束成为较短的铅笔尖状，在大电流时产生较大电磁力的情况下，使液流束偏离焊丝轴线，并发生旋转。于是形成短\n\
      - [constraint_000920] 焊接电流: $500\\mathrm{A}$\n  来源 Unit: unit_004097\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
      : \"unit_004097\", \"end_unit_id\": \"unit_004115\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_004097;\
      \ type=passage; page=411]\n  在TIME气体的基础上，日本学者对 $\\mathrm{Ar - He - CO_2}$ 三元气体对熔滴过渡的影响进行了较深入的研究，如图6-73所示。该图的试验条件是焊丝直径为\
      \ $\\phi 1.2\\mathrm{mm}$ 焊接电流为 $500\\mathrm{A}$ ，电弧电压为 $38\\sim 44\\mathrm{V}$ ，焊丝伸出长度为 $25\\mathrm{mm}$ ，采用DCEP接法。\n\
      - [constraint_000921] 电弧电压: $38\\sim 44\\mathrm{V}$\n  来源 Unit: unit_004097\n  作用域: {\"scope_type\": \"unit_range\"\
      , \"start_unit_id\": \"unit_004097\", \"end_unit_id\": \"unit_004115\", \"target_unit_ids\": [], \"candidate_ranges\"\
      : []}\n  [unit_004097; type=passage; page=411]\n  在TIME气体的基础上，日本学者对 $\\mathrm{Ar - He - CO_2}$ 三元气体对熔滴过渡的影响进行了较深入的研究，如图6-73所示。该图的试验条件是焊丝直径为\
      \ $\\phi 1.2\\mathrm{mm}$ 焊接电流为 $500\\mathrm{A}$ ，电弧电压为 $38\\sim 44\\mathrm{V}$ ，焊丝伸出长度为 $25\\mathrm{mm}$ ，采用DCEP接法。\n\
      \n核心正文:\n[unit_004098; type=passage; page=411]\n由图6-73可见，不同气体配比时，有三种熔滴过渡形态，其中 $\\mathrm{CO}_{2}$ 较多时为大滴过渡；Ar较多时为旋转射流过渡；He在不同配比时可能出现大滴过渡、射流过渡或旋转射流过渡。于是有人提出几种高效MAG焊的混合气体，见表6-46。\n\
      \n支撑内容:\n[unit_004080; type=title; page=409]\n6.6.1 TIME焊\n\n资源文字化:\n[unit_004101; type=figure; page=411]\n题注: 图6-73\
      \ $\\mathrm{Ar - He - CO_2}$ 三元气体的配比成分对熔滴过渡的影响\n原始文字:\n图6-73 $\\mathrm{Ar - He - CO_2}$ 三元气体的配比成分对熔滴过渡的影响\n资源标题: Ar-He-CO2\
      \ 三元气体的配比成分对熔滴过渡的影响\n资源描述: 这是一张三元相图，展示了Ar、He、CO2三种气体配比成分对熔滴过渡形式的影响。三角形的三个顶点分别代表100%的Ar（左下）、He（右下）和CO2（上）。三条边分别标注了各组分含量的刻度（0-100）。图中包含三条曲线，将相图划分为三个区域，分别对应不同的熔滴过渡形式：1.\
      \ 靠近Ar顶点的区域标注为“旋转射流过渡”，并配有相应的熔滴示意图；2. 中间区域标注为“喷射过渡”，配有示意图；3. 靠近CO2顶点的区域标注为“大滴过渡”，配有示意图。图周围有箭头指示气体含量的变化趋势：左侧箭头指向CO2表示“多”，指向Ar表示“少”；右侧箭头指向He表示“多”，指向CO2表示“少”；底部箭头指向Ar表示“多”，指向He表示“少”。\n\
      \n[unit_004107; type=table; page=412]\n题注: 表 6-46 高效 MAG 焊的气体组成配比 (体积分数)\n表格正文:\n<table><tr><td>气体成分</td><td>Ar</td><td>He</td><td>CO2</td><td>O2</td></tr><tr><td>TIME\
      \ II型</td><td>46.5%</td><td>26.5%</td><td>25%</td><td>2%</td></tr><tr><td>Corgon He30</td><td>60%</td><td>30%</td><td>10%</td><td>0</td></tr></table>\n\
      原始文字:\n<table><tr><td>气体成分</td><td>Ar</td><td>He</td><td>CO2</td><td>O2</td></tr><tr><td>TIME II型</td><td>46.5%</td><td>26.5%</td><td>25%</td><td>2%</td></tr><tr><td>Corgon\
      \ He30</td><td>60%</td><td>30%</td><td>10%</td><td>0</td></tr></table>\n资源标题: 表 6-46 高效 MAG 焊的气体组成配比 (体积分数)\n资源描述: 表格展示了两种高效MAG焊气体配方的体积分数。表头第一列为“气体成分”，后续列分别为“Ar”、“He”、“CO2”和“O2”。第一行数据为“TIME\
      \ II 型”，对应的数值依次为：Ar 46.5%、He 26.5%、CO2 25%、O2 2%。第二行数据为“Corgon He30”，对应的数值依次为：Ar 60%、He 30%、CO2 10%、O2 0。"
