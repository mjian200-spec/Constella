    R: 焊接时间|缩短 —[降低]→ 设备台班费|降低

    R: 焊接时间|缩短 —[降低]→ 人工费|降低

    R: 焊接过程|采用气体保护 —[减少]→ 清渣、打磨等辅助工时|减少'
- id: context_000008
  route: text
  difficulty_tags:
  - 截断开头
  - 阈值
  - 定义链
  construction_rationale: 开头回路组成被截断，因此不补造阴极等部件。室温且开关闭合只限定微弱电流事实；持续电流所需的导电性和带电粒子分别表达。达到5×10^5V/m后，粒子生成、绝缘破坏、连续流动和气体放电按原文顺序成链，不把中间结果并入共同输入。
  source:
    context_cache: outputs/rule_extraction_full_20260829/cache/contexts/context_000008.json
    model_output_cache: outputs/rule_extraction_full_20260829/cache/model_outputs/context_000008
    prompt_id: rule_generator_routed__text
    prompt_version: base@6+text@2
  input:
    text: '上下文包编号: context_000008


      标题路径:

      第2章 焊接电弧 > 2.1 电弧的物理基础 > 2.1.1 气体放电的基本概念


      核心正文:

      [unit_000185; type=passage; page=17]

      极、放电空间、阳极和直流电源等组成的回路，在室温状态下，回路开关S合上的瞬间，依赖于电源电压 $E$ ，回路及气体空间有微弱的电流通过。然而，为了获得持续的电流流动，必须提高气体空间的导电性能及生成更多的带电粒子。如果提高电源电压（如达到
      $5\times 10^{5}\mathrm{V / m})$ 则在气体中迅速生成许多新的带电粒子，破坏了气体绝缘，形成了带电粒子的连续流动，也就是气体放电。


      支撑内容:

      [unit_000183; type=title; page=17]

      2.1.1 气体放电的基本概念'
  output: '规则组1

    C: 回路温度|室温 + 回路开关S|合上瞬间

    R: 电源电压E|存在 —[使]→ 回路及气体空间电流|微弱

    规则组2

    C: 无

    R: 电流流动|持续 —[要求]→ 气体空间导电性能|提高

    R: 电流流动|持续 —[要求]→ 带电粒子数量|增加

    R: 电源电场强度|达到5×10^5V/m —[使]→ 新带电粒子|迅速大量生成

    R: 新带电粒子|迅速大量生成 —[破坏]→ 气体绝缘|破坏

    R: 气体绝缘|破坏 —[形成]→ 带电粒子流动|连续

    R: 带电粒子|连续流动 —[定义为]→ 放电类型|气体放电'
- id: context_000078
  route: text
  difficulty_tags:
  - 阴极压降
  - 能量转换
  - 相邻机理链
  construction_rationale: 阴极压降区存在是整条机理的共同场景，包中其他远距条件不参与当前链。正离子先受电场加速、动能增加，到达阴极后再转为热能，随后加强阴极加热和热发射，最终提供足量电子。每个中间状态都是下一关系的直接输入，不能压成一个长跳跃规则。
  source:
    context_cache: outputs/rule_extraction_full_20260829/cache/contexts/context_000078.json
    model_output_cache: outputs/rule_extraction_full_20260829/cache/model_outputs/context_000078
    prompt_id: rule_generator_routed__text
    prompt_version: base@6+text@2
  input:
    text: "上下文包编号: context_000078\n\n标题路径:\n第2章 焊接电弧 > 2.1 电弧的物理基础 > 2.1.2 带电粒子的产生和消失\n\n包条件（已由上游确定作用域）:\n- [constraint_000004]\
      \ 电流: 低电压和大电流\n  来源 Unit: unit_000194\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_000194\", \"\
      end_unit_id\": \"unit_000470\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000194; type=passage; page=18]\n\
      \  由图2-2可见，在不同电流下有不同的放电形式。由于放电条件的影响，放电形式也将发生转化。在低电压和大电流条件下，将成为电弧放电。在电弧放电状态下，电弧中充满离子、电子、负离子和中性粒子等，为了保证电弧稳定，必须不断地产生带电粒子（离子、电子）。下面着重阐述电弧空间离子与电子的产生机理。\n\
      - [constraint_000006] 焊接电流: 焊接电流较小\n  来源 Unit: unit_000199\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
      : \"unit_000199\", \"end_unit_id\": \"unit_000480\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000199;\
      \ type=passage; page=19]\n  用电子伏（eV）为单位的能量转换为数值上相等的电压来处理，单位为伏（V）。因此在实际中常直接用电离电压（单位为V）来表示气体电离的难易。以伏（V）表示的电离电压在数值上等于以电子伏表示的电离能。要使中性气体粒子失去第二个电子则需要更大的电离电压，称为二次电离电压，生成的离子称为二价离子，这种电离称为二次电离，依此类推。普通焊接电弧中当焊接电流较小时只存在一次电离，而在大电流和压缩焊接电弧中，电弧温度达到几万度时可以出现二次或三次电离，即使这种情况下，一次电离仍居主要地位，所以一般书籍中只列出各种气体一次电离的电离电压。自由状态气体原子的一次电离电压在3.9V(Cs)到24.5V(He)之间，二次电离电压在十几伏到几百伏之间。一次电离电压低的粒子，二次电离电压不一定还低，这由粒子的原子结构决定。电弧气氛中可能遇到的气体粒子的电离电压见表2-1。\n\
      - [constraint_000028] 电压: $4.3\\mathrm{V}$\n  来源 Unit: unit_000263\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
      : \"unit_000263\", \"end_unit_id\": \"unit_000487\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000263;\
      \ type=passage; page=24]\n  萨哈公式是单一气体热电离度的表达式，如果某气体中混有其他成分时，各种气体电离程度不一样，此时电子密度与电离前中性粒子密度的比例称为实效电离度。混合气体的电离电压称为实效电离电压。利用萨哈公式求实效电离度时需代入实效电离电压。理论与实际都证明混合气体的实效电离电压主要决定于电离电压较低的气体成分，即使这种气体占有较小的比例。例如铁蒸气中混有钾蒸气时，其实效电离电压与混入的钾蒸气的比例关系如图2-5所示。铁蒸气电离电压为\
      \ $7.9\\mathrm{V}$ ，而钾蒸气的电离电压为 $4.3\\mathrm{V}$ 。当钾蒸气质量分数超过 $5\\%$ 时，则实效电离电压显著下降而接近钾的电离电压。因此，电弧焊时为了提高电弧的稳定性，在电弧气氛中只需要加入少量的低电离电压物质即可取得显著的效果。\n\
      - [constraint_000060] 温度: 温度很低\n  来源 Unit: unit_000389\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"\
      unit_000389\", \"end_unit_id\": \"unit_000487\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000389;\
      \ type=passage; page=33]\n  比较式(2-16)与式(2-17)可以看到，电场的存在相当于使电极材料的逸出功降低 $U_{\\mathrm{w}}^{\\prime} = U_{\\mathrm{w}} -\
      \ \\sqrt{eE / \\pi\\varepsilon_{0}}$ 。当温度很低时，甚至是 $0^{\\circ}\\mathrm{C}(T = 273\\mathrm{K})$ ，如果存在足够强的电场强度，也可以从电极发射足够数量的电子流密度以供电弧导电的需要。\n\
      - [constraint_000070] 弧长: 电弧长度变化\n  来源 Unit: unit_000440\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
      : \"unit_000440\", \"end_unit_id\": \"unit_000487\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000440;\
      \ type=passage; page=36]\n  压降。阴极附近的区域为阴极区，其电压称为阴极电压降。中间部分为弧柱区，其电压称为弧柱电压降。阳极区和阴极区在电弧长度方向的尺寸都很小，约为 $10^{-4}$ 和 $10^{-6}\\\
      mathrm{cm}$ 。在电弧长度变化时几乎不发生变化，但电压降值很高，在电弧总体电压降中占有相当大的比例，所以电场强度很高。而弧柱区的长度几乎等于电弧总长度，电压降沿弧长方向呈线性变化，其电场强度较低。之所以如此，是由于这些区域导电机构不同所决定的，电弧电压\
      \ $U_{\\mathrm{a}}$ 是上述各电压降之和。即\n- [constraint_000073] 材料: W、C\n  来源 Unit: unit_000462\n  作用域: {\"scope_type\": \"unit_range\"\
      , \"start_unit_id\": \"unit_000462\", \"end_unit_id\": \"unit_000470\", \"target_unit_ids\": [], \"candidate_ranges\"\
      : []}\n  [unit_000462; type=passage; page=39]\n  （2）电场发射型阴极导电机构 当阴极材料为W、C，电流较小时或阴极材料采用熔点较低的Al、Cu、Fe时，阴极表面温度受沸点的限制而不能升得很高，只是在阴极的局部区域具有导通电流的有利条件，阴极的导电面积显著减小，在这些局部地方阴极表面出现电流密度很高的阴极斑点（电流密度的数量级达\
      \ $0.5 \\times 10^{6} \\sim 10^{7} \\mathrm{~A} / \\mathrm{cm}^{2}$ ），但是其温度不可能高于其沸点，在这样低的温度下不可能产生较强的热发射，以产生所需要的电子流，因此无法用热发射来解释这种情况下的阴极导电机构。事实上阴极温度降低时，它不可能单依靠热发射所产生的电子流来供应弧柱对电子流的需要。弧柱中由于电子质量大大小小于正离子，在电场的作用下，电子快速运动，使电子运动速度是离子运动速度的999倍左右，当靠阴极热发射不能提供足够数量的电子时，则在靠近阴极的区域，正负电荷的平衡关系将首先受到破坏，在这里正负电荷数量不等。电子数量不足，必然\n\
      \n核心正文:\n[unit_000470; type=passage; page=40]\n3）由于阴极压降区的存在，由2）已知阴极区的正离子增加，正离子通过阴极区将被电场加速使其动能增加，当正离子到达阴极时，将有更多的动能转换为热能，加强对阴极的加热作用，从而进一步增强阴极的热发射，使阴极区能提供足够数量的电子。\n\
      \n支撑内容:\n[unit_000193; type=title; page=18]\n2.1.2 带电粒子的产生和消失"
  output: '规则组1

    C: 焊接电弧|存在阴极压降区

    R: 正离子|通过阴极区 —[受到]→ 电场加速|加速

    R: 电场加速|作用 —[增加]→ 正离子动能|增加

    R: 正离子|到达阴极 —[转换]→ 热能|由动能转换

    R: 热能|增加 —[加强]→ 阴极加热作用|增强

    R: 阴极加热作用|增强 —[增强]→ 阴极热发射|增强

    R: 阴极热发射|增强 —[提供]→ 阴极区电子数量|足够'
- id: context_000091
  route: text
  difficulty_tags:
  - 能量去向
  - 固定条件
  - 不制造直接利用
  construction_rationale: 一般电弧焊是第一组共同场景，弧柱热量不能直接加热与少量辐射传热是两个独立事实。第二组只有在电流较大且产生等离子流时成立，等离子流把弧柱热量带到焊件，再增加焊件热量。括号中的流向用于说明作用方向，不另生成无必要规则。
  source:
    context_cache: outputs/rule_extraction_full_20260829/cache/contexts/context_000091.json
    model_output_cache: outputs/rule_extraction_full_20260829/cache/model_outputs/context_000091
    prompt_id: rule_generator_routed__text
    prompt_version: base@6+text@2
  input:
    text: "上下文包编号: context_000091\n\n标题路径:\n第2章 焊接电弧 > 2.2 电弧的能量转换 > 2.2.1 电弧的产热机构及温度分布\n\n包条件（已由上游确定作用域）:\n- [constraint_000088]\
      \ explicit_condition: 不同的气体中燃烧\n  来源 Unit: unit_000500\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"\
      unit_000500\", \"end_unit_id\": \"unit_000542\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000500;\
      \ type=passage; page=43]\n  弧柱的产热情况不像固态导体那样，只要电流一定，其产热量也就一定。而弧柱当电流一定时其产热量将因热损失的大小而自行调整，它是按最小电压原理通过电场强度 $E$ 而自行调节的。由于气体质量、导热性、解离程度的不同，电弧在不同的气体中燃烧时的热损失也不同，使弧柱部分的电场强度也不相同。当电流不变时，弧柱电场强度\
      \ $E$ 的升高意味着弧柱的产热量增加，当然意味着弧柱的温度升高。弧柱外围有强迫气流冷却时将带来电场强度 $E$ 的升高和弧柱温度的上升，气压的升高也将带来相同的倾向。\n\n核心正文:\n[unit_000501; type=passage;\
      \ page=43]\n一般电弧焊过程中，弧柱的热量不能直接用于对焊条（焊丝）和母材的加热，只能有很少一部分热量通过辐射传给焊条（焊丝）和焊件。当电流较大有等离子流产生时，等离子流将把弧柱的一部分热量带到焊件[因为等离子流一般是由焊条（焊丝）流向焊件]，增加焊件的热量。\n\
      \n支撑内容:\n[unit_000493; type=title; page=42]\n2.2.1 电弧的产热机构及温度分布"
  output: '规则组1

