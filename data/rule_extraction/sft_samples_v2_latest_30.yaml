- id: context_001501
  route: text
  difficulty_tags:
  - 成本链
  - 属性比较
  - 并列节约项
  construction_rationale: 气体保护焊是本段共同场景。坡口截面积减小分别减少药皮和焊条头浪费；CO2耗电量必须与焊条电弧焊作同属性比较。生产效率、时间和费用保持因果链，清渣与打磨只概括为正文明确的辅助工时减少，不扩展到其他工序。
  source:
    context_cache: outputs/rule_extraction_full_20260829/cache/contexts/context_001501.json
    model_output_cache: outputs/rule_extraction_full_20260829/cache/model_outputs/context_001501
    prompt_id: rule_generator_routed__text
    prompt_version: base@6+text@2
  input:
    text: '上下文包编号: context_001501


      标题路径:

      第1章绪论 > 1.3 气体保护焊的特点及发展前景


      核心正文:

      [unit_000163; type=passage; page=14]

      ① 因为减小了坡口截面积，减少了焊条药皮和焊条头的浪费。② 节约电能， $\mathrm{CO}_{2}$ 焊耗电量仅仅为焊条电弧焊的 $34.6\%$③ 气体保护焊生产效率高，缩短了焊接时间，所以降低了设备的台班费和人工费。④ 减少了清渣、打磨等辅助工时。


      支撑内容:

      [unit_000161; type=passage; page=14]

      ① MAG焊和 $\mathrm{CO}_{2}$ 焊是一种低氢焊接方法。焊缝中扩散氢的含量远远低于低氢焊条（ $\mathrm{CO}_{2}$ 焊时扩散氢含量 $[\mathrm{H}] \leqslant 1.6 \mathrm{~mL}
      / 100 \mathrm{~g}$ ，低氢焊条 $[\mathrm{H}] \leqslant 3.15 \mathrm{~mL} / 100 \mathrm{~g}$ ）。 $\mathrm{CO}_{2}$ 焊对铁锈和水分不敏感，气孔率低。②
      短路过渡法热输入低，热影响区小，变形小。③ 气体保护焊的力学性能可达到或高于低氢焊条。ER49-1 焊丝 $\mathrm{CO}_{2}$ 焊时和 ER50-3、ER50-4 焊丝 MAG 焊时，均可得到具有良好强度和韧性的焊缝。这时焊缝金属中的
      $w(\mathrm{Mn}) \approx 1.0\%$ ， $w(\mathrm{Si}) \approx 0.4\%$ 。④ 短路过渡焊搭桥性能好，适于进行打底焊；焊接熔池小，有利于全位置焊。


      [unit_000162; type=passage; page=14]

      3）气体保护焊的成本低


      [unit_000165; type=passage; page=14]

      4


      [unit_000174; type=passage; page=15]

      第1章绪论'
  output: '规则组1

    C: 焊接方法|气体保护焊

    R: 坡口截面积|减小 —[减少]→ 焊条药皮浪费|减少

    R: 坡口截面积|减小 —[减少]→ 焊条头浪费|减少

    R: CO2焊|耗电量 —[仅为]→ 焊条电弧焊|耗电量的34.6%

