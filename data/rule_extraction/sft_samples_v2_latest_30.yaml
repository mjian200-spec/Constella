      \ unit_000949\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_000949\", \"end_unit_id\": \"unit_000966\"\
      , \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000949; type=passage; page=85]\n  由于电弧具有这种刚直性，所以当焊条与焊件有一定的倾角时（见图2-71）电弧仍能保持沿焊条的轴线方向，而不是始终垂直于焊件表面。由于电弧自身磁场强度决定于产生此磁场的焊接电流大小，所以一般情况下焊接电流越大，电弧周围的冷空气流越大，电弧越受拘束，电弧的刚直性越大。保护气体的种类对电弧的刚直性也有影响，如\
