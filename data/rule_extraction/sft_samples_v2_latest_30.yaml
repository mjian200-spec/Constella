    prompt_id: rule_generator_routed__text
    prompt_version: base@6+text@2
  input:
    text: '上下文包编号: context_001689


      标题路径:

      第3章 熔滴过渡与焊缝成形 > 3.2 熔滴过渡 > 3.2.1 熔滴过渡的分类


      核心正文:

      [unit_001127; type=passage; page=100]

      第二类为接触过渡（Contact Transfer），这时焊丝端头的熔滴与熔池表面相接触而过渡。根据焊丝通电与否，又分为短路过渡（Short Circuits Transfering）与搭桥过渡（Bridging Transfer）。液体金属小桥通以焊接电流时为短路过渡，而不通电时为搭桥过渡。


      支撑内容:

      [unit_001126; type=passage; page=100]

      这里主要按熔滴过渡的行为进行分类，GMAW的熔滴过渡行为大体上分为两种类型，即自由过渡和接触过渡。第一类过渡为自由过渡（Free Transfer），是指熔滴经电弧空间自由飞行而焊丝端头和熔池之间不发生接触的过渡形式。其中包括如下几种，当熔滴直径大于焊丝直径时为大滴过渡（Globular
      Transfer），其中当焊接电流较小时为下垂滴状过渡（Drop Transfer），而在 $\mathrm{CO}_{2}$ 气体保护焊时可出现排斥滴状过渡（Repelled Transfer）；当熔滴直径小于或等于焊丝直径时为喷射过渡（Spray
      Transfer），其中当熔滴直径接近焊丝直径时称为射滴过渡（Projected Transfer），而当熔滴直径大约为焊丝直径的 $1/3 \sim 1/2$ 时称为射流过渡（Streaming Transfer）。在MIG和MAG焊时，还有一种过渡形式，通常称为旋转射流过渡（Rotating
      Transfer），这时焊接电流和焊丝伸出长度都较大，焊丝端头的液柱一方面绕焊丝轴线旋转，另一方面还随意甩动，同时沿焊丝端头抛出细滴，这时熔滴的尺寸都小于焊丝直径。在自由过渡形式中还包括一种过渡形式，为爆炸过渡，常发生在 $\mathrm{CO}_{2}$
      焊、MAG焊和焊条电弧焊时。这时焊丝端头的液体金属熔滴中形成气体，使其体积突然膨胀，当其中气体压力较高时，将使液球破碎，并以较细的熔滴向四周散开，其中一部分成为飞溅。


      [unit_001128; type=passage; page=100]

      以上只是几种主要的熔滴过渡形式，实际上熔滴过渡是十分复杂的。那么，到底是什么原因使熔滴过渡的呢？大家知道力是产生运动的原因，下面先围绕着与熔滴过渡有关的作用力加以说明。


      [unit_001130; type=passage; page=100]

      90'
  output: '规则组1

    C: 无

    R: 熔滴过渡形式|接触过渡 —[定义为]→ 焊丝端头熔滴|接触熔池表面后过渡

    R: 液体金属小桥|通焊接电流 —[对应]→ 熔滴过渡形式|短路过渡

    R: 液体金属小桥|不通电 —[对应]→ 熔滴过渡形式|搭桥过渡'
