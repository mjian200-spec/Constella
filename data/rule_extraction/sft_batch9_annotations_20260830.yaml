annotations:
  - id: context_000048
    difficulty_tags: [合金化成分, 多效果拆分, 目的链]
    construction_rationale: 钨极加入Th、Ce等成分是所有结果的直接输入，不再把远距Cs、Ba条件加入C。降低逸出功、提高电子发射能力和电流容量、改善引弧性能是四个并列效果，分别输出，避免用一个“工艺性能改善”概括而损失可检索属性。
    output: |-
      规则组1
      C: 无
      R: 钨极|加入Th、Ce等成分 —[降低]→ 钨极逸出功|降低
      R: 钨极|加入Th、Ce等成分 —[提高]→ 电子发射能力|提高
      R: 钨极|加入Th、Ce等成分 —[提高]→ 钨极电流容量|提高
      R: 钨极|加入Th、Ce等成分 —[改善]→ 引弧性能|改善

  - id: context_000055
    difficulty_tags: [材料差异, 光发射, 公式计算]
    construction_rationale: 不同材料逸出功导致光发射临界波长不同，是一般趋势；式(2-19)给出从逸出功Uw到临界波长的完整计算关系，公式放箭头中。临界波长是输出，不能像初稿再写一条含义重复的“逸出功确定临界波长”而不说明公式。
    output: |-
      规则组1
      C: 物理现象|金属表面光发射
      R: 材料逸出功|不同 —[使]→ 光发射临界波长|不同
      R: 材料逸出功|U_w —[$\lambda_0=\frac{hc}{eU_w},\ \lambda'_0=\frac{12360}{U_w}\times10^{-10}\mathrm m$]→ 光发射临界波长|λ₀′

  - id: context_000071
    difficulty_tags: [分区相反趋势, 气体影响, 图文冲突]
    construction_rationale: 弧柱所需电场强度表征导电性能，并与气体成分、电流有关。正文明确小电流区随电流增加而减小、大电流区反而增加，分两条保留。气体电离度及其他物性共同决定电场强度。图片文字化与大电流正文冲突，不覆盖正文结论。
    output: |-
      规则组1
      C: 无
      R: 弧柱导电性能|好坏 —[表征为]→ 弧柱导电所需电场强度|大小
      R: 电弧空间气体成分|变化 —[影响]→ 弧柱电场强度|变化
      R: 电流|在较小电流区增加 —[使]→ 弧柱电场强度|减小
      R: 电流|在较大电流区增加 —[使]→ 弧柱电场强度|增加
      R: 气体电离度|变化 + 气体其他物理性质|变化 —[共同决定]→ 电弧电场强度|变化

  - id: context_000085
    difficulty_tags: [正离子来源, 阳极压降, 图片趋势, 越界删除]
    construction_rationale: 当前核心从阳极区热量继续增加开始。热电离完全提供弧柱所需0.001I正离子流后，阳极压降可降至零；图2-16进一步显示阳极前弧柱温度升高时压降降低。缓存前六条金属蒸气和电流密度机理来自前文，不属于核心，删除。
    output: |-
      规则组1
      C: 阳极区热量|继续增加
      R: 阳极区热电离|完全提供弧柱所需0.001I正离子流 —[使]→ 阳极压降U_A|可降至零
      R: 阳极前弧柱温度|升高 —[使]→ 阳极压降U_A|降低

  - id: context_000097
    difficulty_tags: [多因素温度, 数值范围, 图片核对]
    construction_rationale: 弧柱温度受电极材料、气体、电流和拘束程度等因素影响，分别保留影响源。常压下电流1~1000A对应5000~30000K是正文给出的范围。图2-18用于核对中心高、外层低的等温分布，但文字化最外层500K疑似识别异常，不抄取分层数值。
    output: |-
      规则组1
      C: 焊接电弧|弧柱
      R: 电极材料|变化 —[影响]→ 弧柱温度|变化
      R: 气体介质|变化 —[影响]→ 弧柱温度|变化
      R: 焊接电流|变化 —[影响]→ 弧柱温度|变化
      R: 电弧拘束程度|变化 —[影响]→ 弧柱温度|变化
      规则组2
      C: 环境压力|常压
      R: 焊接电流|1~1000A —[对应]→ 弧柱温度范围|5000~30000K

  - id: context_000098
    difficulty_tags: [多机理温升, 金属蒸气, 多原子气体, 图片趋势]
    construction_rationale: 本段包含六种温度机制，按作用域分组。焊丝端和焊条端统一概括为小直径电极端，避免把备选电极写成共同条件；无蒸气、金属大量蒸发、K/Na稳弧剂、电流增大、高速气流以及多原子气体解离分别保持原文因果，不把互斥气氛合成共同条件。
    output: |-
      规则组1
      C: 电弧位置|靠近小直径电极端
      R: 电流密度|高 + 能量密度|高 —[使]→ 电弧温度|高
      规则组2
      C: 电弧空间|无金属蒸气 + 保护气体|Ar
      R: Ar电离势|较高 —[使]→ 电弧空间电离度|较小
      R: 电弧空间电离度|较小 —[使]→ 电场强度|提高
      规则组3
      C: 电极材料|大量蒸发
      R: 金属蒸气电离能|显著小于Ar —[使]→ 电弧空间电离度|增加
      R: 电弧空间电离度|增加 —[使]→ 电弧温度|降低
      规则组4
      C: 焊接方法|焊条电弧焊 + 药皮|含K、Na等稳弧剂
      R: 电弧空间|存在K、Na金属蒸气 —[使]→ 电弧温度|较低
      规则组5
      C: 无
      R: 焊接电流|增大 —[使]→ 弧柱温度|增加
      规则组6
      C: 焊接方法|等离子弧 + 电弧周围气体|高速流动
      R: 周围高速气流|冷却 —[使]→ 弧柱电场强度|显著升高
      R: 弧柱电场强度|显著升高 —[使]→ 弧柱温度|上升
      规则组7
      C: 周围气氛|CO2、O2、H2、H2O、N2等多原子气体
      R: 多原子气体|解离吸热 —[使]→ 电弧温度|升高

  - id: context_000107
    difficulty_tags: [高速熔滴, 动能, 多力共同结果, 图片核对]
    construction_rationale: 细颗粒重量、加速度和到池速度分别绑定量纲。等离子流使加速度达重力50倍以上，颗粒到熔池时速度达每秒数百米；大动能、电磁压力和等离子流力共同导致指状熔深。图片只核对颗粒冲击凹坑，不从图估算尺寸。
    output: |-
      规则组1
      C: 无
      R: 细颗粒熔滴|单颗重量 —[对应]→ 重量值|几十毫克
      R: 等离子流力|作用 —[使]→ 细颗粒熔滴加速度|很高
      R: 细颗粒熔滴加速度|很高 —[可达到]→ 重力加速度倍数|50倍以上
      R: 细颗粒熔滴|冲向熔池 —[对应]→ 到达熔池速度|每秒数百米数量级
      R: 细颗粒熔滴动能|很大 + 电磁压力|作用 + 等离子流力|作用 —[形成]→ 焊缝熔深形态|指状

  - id: context_000113
    difficulty_tags: [频率滞后, 高频比较, 图片波形]
    construction_rationale: 低频脉冲时压力能跟随电流；频率增加使压力变化逐渐滞后。高于数千赫兹且平均电流相同时，高频电磁效应增强，压力显著高于直流。两幅图片用于核对相位滞后与频率增压趋势，实验细节不扩大共同作用域。
    output: |-
      规则组1
      C: 焊接方法|低频脉冲焊
      R: 焊接电流|变化 —[使]→ 电弧压力|跟随变化
      R: 脉冲频率|增加 —[使]→ 电弧压力相对电流变化|逐渐滞后
      规则组2
      C: 脉冲频率|高于数千赫兹 + 平均电流|相同
      R: 高频电磁效应|增强 —[使]→ 高频脉冲电弧压力|显著高于直流电弧压力

  - id: context_000121
    difficulty_tags: [频率分支, 再引燃电压, 固定数值, 图片核对]
    construction_rationale: 钨极氩弧焊铝且含冷阴极限定比较。60Hz下电流增大使再引燃电压下降，但60A仍较高；3000Hz下电压近似固定，60A时超过150V。频率分组，不能把60Hz趋势错误推广到高频；图片只核对下降趋势。
    output: |-
      规则组1
      C: 焊接方法|钨极氩弧焊 + 焊接对象|铝 + 交流频率|60Hz
      R: 焊接电流|增大 —[使]→ 再引燃电压|下降
      R: 焊接电流|60A —[对应]→ 再引燃电压|仍较高
      规则组2
      C: 焊接方法|钨极氩弧焊 + 焊接对象|铝 + 交流频率|3000Hz
      R: 焊接电流|变化 —[对应]→ 再引燃电压|近似固定
      R: 焊接电流|60A —[对应]→ 再引燃电压|150V以上

  - id: context_000128
    difficulty_tags: [图像补充, 三段静特性, 截断正文]
    construction_rationale: 电弧静特性曲线按ab、bc、cd三段。正文闭合给出小电流负阻及电流增大电压下降；图2-53清晰显示中间水平段和后段上升，因此补充平特性与正阻特性。只抽取曲线类别和方向，不从图猜测电流分界数值。
    output: |-
      规则组1
      C: 焊接电弧|静特性曲线
      R: 焊接电流|较小且位于ab段 —[对应]→ 电弧静特性|负阻特性
      R: 焊接电流|在ab段增加 —[使]→ 电弧电压|减小
      R: 焊接电流|位于bc段 —[对应]→ 电弧静特性|平特性
      R: 焊接电流|位于cd段 —[对应]→ 电弧静特性|正阻特性
      R: 焊接电流|在cd段增加 —[使]→ 电弧电压|增加

  - id: context_000136
    difficulty_tags: [弧长影响, 静特性曲线, 图片关系]
    construction_rationale: 弧长变化使静特性曲线上下移动是一般结论；TIG焊时电压与弧长大致正比另组。图2-54和2-55展示不同焊法曲线但正文未要求提取每条；图2-56确认200A、400A下共同增压趋势，不抄取近似点值。
    output: |-
      规则组1
      C: 无
      R: 电弧长度|变化 —[使]→ 电弧静特性曲线位置|上下移动
      规则组2
      C: 焊接方法|TIG焊
      R: 电弧长度|增加 —[使]→ 电弧电压|大致成正比增加

  - id: context_000704
    difficulty_tags: [上下限曲线, 多种过渡区, 双曲线公式]
    construction_rationale: 一脉一滴区由临界脉冲电流下限与跳弧电流上限包围。上下界两侧分别对应几脉一滴、一脉一滴和一脉多滴；脉冲时间减小时临界电流按Ip^n·tp=C增大。公式以Ip和tp为变量置于箭头，不写成式号对应。
    output: |-
      规则组1
      C: 焊接方法|脉冲MIG/MAG焊
      R: 脉冲电流|高于临界脉冲电流下限 —[对应]→ 熔滴过渡区间|一脉一滴
      R: 脉冲电流|低于临界脉冲电流下限 —[对应]→ 熔滴过渡区间|几脉一滴
      R: 脉冲电流|低于临界跳弧电流上限 —[对应]→ 熔滴过渡区间|一脉一滴
      R: 脉冲电流|高于临界跳弧电流上限 —[对应]→ 熔滴过渡区间|一脉多滴
      R: 临界脉冲电流下限|存在 + 临界跳弧电流上限|存在 —[包围]→ 一脉一滴电流区间|两曲线之间
      R: 脉冲时间t_p|减小 —[$I_p^nt_p=C$]→ 临界脉冲电流I_p|增大

  - id: context_000229
    difficulty_tags: [能量判据, 公式不等式, 新旧通道比较]
    construction_rationale: 射滴过渡中，新弧根通道能耗应不大于原缩颈液态金属通道。式(3-17)把缩颈电压降与长度比值和弧柱电场强度放在不等式两端，完整判据置于箭头。核心开头残留“阳极弧根”不构成闭合命题，不单独抽取。
    output: |-
      规则组1
      C: 熔滴过渡形式|射滴过渡
      R: 新弧根弧柱通道|能量消耗 —[不大于]→ 原缩颈液态金属通道|能量消耗
      R: 缩颈液态金属|电压降U_j与长度L_j之比 —[$\frac{U_j}{L_j}\geq E$]→ 弧柱|电场强度E

  - id: context_000230
    difficulty_tags: [材料分支, 跳弧, 公式判据, 因果链]
    construction_rationale: MIG焊钢和铝分组。钢中电弧电场强度低使跳弧容易；铝电阻率小导致式(3-17)不易满足，继而难以形成射流过渡。关联公式用于明确判据含义，但正文没有要求重复输出公式，避免与前一案例形成完全重复规则。
    output: |-
      规则组1
      C: 焊接方法|MIG焊 + 焊接对象|钢
      R: 电弧电场强度|较低 —[使]→ 跳弧难易|容易
      规则组2
      C: 焊接方法|MIG焊 + 焊接对象|铝
      R: 铝|电阻率小 —[使]→ 式(3-17)判据|不易满足
      R: 式(3-17)判据|不易满足 —[使]→ 射流过渡|难以产生

  - id: context_000320
    difficulty_tags: [喷嘴结构, 共同设计条件, 尺寸公式]
    construction_rationale: TIG喷嘴设计是共同场景。良好流态与适当挺度共同获得可靠保护；上部缓冲室降速；下部断面、通道通畅和长度共同保证近壁层流厚度。公式以钨极直径dw为输入、喷嘴内孔Di为输出，保留2.5~3.5倍关系。
    output: |-
      规则组1
      C: 焊接方法|TIG焊 + 设计对象|保护气体喷嘴
      R: 保护气流流动状态|良好 + 保护气流挺度|适当 —[获得]→ 气体保护效果|可靠
      R: 喷嘴内上部|设置较大缓冲空间 —[降低]→ 气流速度|降低
      R: 喷嘴内下部断面|均匀 + 喷嘴通道|通畅 + 喷嘴通道长度|较长 —[保证]→ 近壁层流厚度|足够
      R: 钨极直径|d_w —[$D_i=(2.5\sim3.5)d_w$]→ 喷嘴内孔直径|D_i

  - id: context_000419
    difficulty_tags: [方法比较, 效率, 裂纹, 表格核对]
    construction_rationale: 窄间隙试样限定冷丝与热丝TIG比较。热丝TIG效率比冷丝提高一倍，并减少焊缝裂纹，均写成同属性比较。表4-29提供逐层参数但正文只用于证明总体效率，不强制转录几十个单元格；应用前景是预测，不作为确定工艺规则。
    output: |-
      规则组1
      C: 焊接对象|窄间隙试样
      R: 热丝TIG焊|焊接效率 —[比冷丝TIG焊提高一倍]→ 冷丝TIG焊|焊接效率
      R: 热丝TIG焊|焊缝裂纹数量 —[少于]→ 冷丝TIG焊|焊缝裂纹数量

  - id: context_000441
    difficulty_tags: [表格趋势, 内外气孔, 硅含量]
    construction_rationale: CO2焊低碳钢是表5-1试验场景。正文只要求从不同焊丝结果归纳含硅量增加使外部、内部气孔逐渐减少，两个属性分别输出。符号的具体气孔等级没有可靠文字定义，不猜测每个圆形符号，也不把远距0.2%条件自动作为C。
    output: |-
      规则组1
      C: 焊接方法|CO2气体保护焊 + 母材材质|低碳钢
      R: 焊丝含硅量|增加 —[使]→ 焊缝外部气孔数量|逐渐减少
      R: 焊丝含硅量|增加 —[使]→ 焊缝内部气孔数量|逐渐减少

  - id: context_000443
    difficulty_tags: [方法对照, 铁锈阈值, 表格证据, 公式截断]
    construction_rationale: 100mm焊缝是共同试验范围。0.5g铁锈下埋弧少量气孔而CO2无气孔，1g时CO2才少量气孔，按方法分别输出。铁锈水合氧化铁成分可作为事实，但冒号后的反应式缺失，不生成“发生化学反应”的空泛公式规则。
    output: |-
      规则组1
