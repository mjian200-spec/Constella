    prompt_id: rule_generator_routed__text__image
    prompt_version: base@6+text@2+image@4
  input:
    text: "上下文包编号: context_000210\n\n标题路径:\n第3章 熔滴过渡与焊缝成形 > 3.2 熔滴过渡 > 3.2.2 熔滴上的作用力\n\n包条件（已由上游确定作用域）:\n- [constraint_000242]\
      \ 焊接电流: 焊接电流较小\n  来源 Unit: unit_001153\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_001153\",\
      \ \"end_unit_id\": \"unit_001185\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_001153; type=passage;\
      \ page=102]\n  $\\rho / \\sigma$ 越大时，则熔滴越细小。显然在焊接电流较小时进行立焊和仰焊的情况下，重力将阻碍熔滴过渡。\n- [constraint_000244] 电流: 这个液柱中流过较大的电流\n\
      \  来源 Unit: unit_001162\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_001162\", \"end_unit_id\"\
      : \"unit_001185\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_001162; type=passage; page=102]\n  电磁力对熔滴过渡也有阻碍力和促进力之分。电磁力直接帮助熔滴脱落的例子如图3-12所示。与水滴的情况类似，较小的熔滴与液面短路的场合，容易形成稳定于焊丝端部与熔池液面间的液柱，并保持短路形态而不破断。然而，当这个液柱中流过较大的电流时，受到电磁收缩力的作用，液柱将会收缩，电流通道变窄，收缩区中心的压力进一步增大，从而产生轴向上的压力梯度。驱使液体从颈缩部位向膨胀部位流动，即促进熔滴向熔池过渡（见图3-12a）。\n\
      - [constraint_000245] explicit_condition: 仰焊位置焊接\n  来源 Unit: unit_001166\n  作用域: {\"scope_type\": \"unit_range\", \"\
      start_unit_id\": \"unit_001166\", \"end_unit_id\": \"unit_001184\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n\
      \  [unit_001166; type=passage; page=103]\n  磁收缩力也越大，并远远大于重力。因此实际焊接电弧中，在仰焊位置焊接时，尽管重力作用在熔滴过渡的相反方向上，但也可以实现小颗粒熔滴过渡，这正是电磁收缩力在起作用。\n\
      \n核心正文:\n[unit_001171; type=passage; page=103]\n收缩的多数情况是集中在熔滴底部一个极为狭小的区域，这种情况如图3-12c所示，电磁力向上作用，阻碍熔滴的过渡，当电流值增加后，反倒容易形成大颗粒熔滴，难以实现喷射过渡。\n\
      \n支撑内容:\n[unit_001131; type=title; page=101]\n3.2.2 熔滴上的作用力\n\n资源文字化:\n[unit_001169; type=figure; page=103]\n题注: c)\
