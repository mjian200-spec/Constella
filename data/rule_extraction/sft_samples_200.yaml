  - 最小电阻通道
  - 激光引弧
  - 图片核对
  construction_rationale: 激光—MIG复合焊及激光照射材料限定整条机理。金属汽化电离产生高密度光致等离子体；其电子离子提供最小电阻通道，使电弧吸附、压缩到激光区，形成激光引导并提高能量密度。按相邻机理逐步输出，图片只核对耦合位置和熔滴。
  source:
    context_cache: outputs/rule_extraction_full_20260829/cache/contexts/context_000826.json
    model_output_cache: outputs/rule_extraction_full_20260829/cache/model_outputs/context_000826
    prompt_id: rule_generator_routed__text__image
    prompt_version: base@6+text@2+image@4
  input:
    text: "上下文包编号: context_000826\n\n标题路径:\n第6章 熔化极氩弧焊 > 6.6 先进的MIG焊方法 > 6.6.3 激光—MIG复合焊\n\n包条件（已由上游确定作用域）:\n- [constraint_000931]\
      \ 材料: 激光束撞击到材料表面上\n  来源 Unit: unit_004209\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_004209\"\
      , \"end_unit_id\": \"unit_004246\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_004209; type=passage;\
      \ page=423]\n  焊接金属工件时，YAG激光器输出的激光束能量密度为 $10^{6}\\mathrm{W / cm}^{2}$ 。当激光束撞击到材料表面上时，受热表面立即达到蒸发温度并且因为流动的金属蒸气的作用，在被焊金属中产生凹坑。在此处能得到较大深宽比的焊缝。而GMAW电弧的能量密度略大于\
      \ $10^{4}\\mathrm{W / cm}^{2}$ ，它仅能得到较宽的焊缝，其深宽比小。从复合焊原理图（见图6-85）上可看到激光束与电弧在待焊处的同一区域合成。激光束与电弧相\n\n核心正文:\n[unit_004218;\
      \ type=passage; page=424]\n1）激光对电弧的引导作用。在纯激光辐射下，金属汽化和电离而产生高温大密度的光致等离子体。而在复合焊过程中，光致等离子体的电子和离子密度比较高，在外加电弧后光致等离子体为电弧提供了一条导电通道，该通道的电阻最小，这样电弧就被强烈地吸附在金属蒸气密度比较高的区域燃烧，这时电弧被牢固地吸引并压缩到激光照射在工件表面的区域内，从而出现激光引导电弧的现象，并提高了电弧能量密度。激光—MIG复合焊的激光与电弧的耦合形态如图6-87所示。激光与熔滴过渡如图6-88所示。\n\
      \n支撑内容:\n[unit_004205; type=title; page=423]\n6.6.3 激光—MIG复合焊\n\n资源文字化:\n[unit_004220; type=figure; page=424]\n题注: 图6-87\
      \ 激光—MIG复合焊的激光与电弧的耦合形态 图6-88 激光与熔滴过渡\n原始文字:\n图6-87 激光—MIG复合焊的激光与电弧的耦合形态 图6-88 激光与熔滴过渡\n资源标题: 激光与熔滴过渡\n资源描述: 这是一张黑白照片，展示了激光与熔滴过渡的微观形态。图像左侧有三个中文标签，通过水平引线指向图像中的特定区域：\n\
      1. 最上方的标签“电弧”指向图像右上方的明亮区域，该区域位于一根从右上角伸入的深色管状物（焊丝）的末端。\n2. 中间的标签“熔滴”指向图像中央的一个深色、近似球形的液滴。\n3. 最下方的标签“激光”指向图像左下方的一个高亮白色光斑，该光斑位于底部的深色基底表面。"
