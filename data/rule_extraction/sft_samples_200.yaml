    prompt_version: base@6+text@2
  input:
    text: '上下文包编号: context_001833


      标题路径:

      第4章 钨极惰性气体保护焊 > 4.1 TIG焊的原理、特点及分类 > 4.1.1 TIG焊的原理


      核心正文:

      [unit_001778; type=passage; page=158]

      氩气是惰性气体的一种。惰性气体也称为非活性气体，具有不与其他物质产生化学反应的性质，泛指氦、氩、氖等气体。TIG焊利用这一性质，以惰性气体完全覆盖电弧和熔化金属，使电弧不受周围空气的影响及保护熔化金属不与空气中的氧、氮等发生反应。


      支撑内容:

      [unit_001776; type=passage; page=158]

      钨极惰性气体保护焊是以纯钨或活化钨（钍钨、铈钨等）作为电极，在惰性气体保护下进行的电弧焊，又称TIG（Tungsten Inert Gas）焊或GTAW焊接（Gas Tungsten Arc Welding）。


      [unit_001777; type=passage; page=158]

      钨的熔点约为 $3380^{\circ}\mathrm{C}$ ，是熔点最高的一种金属，与其他金属相比，具有难熔化、可长时间处于高温的性质。TIG焊正是利用了这一性质，在圆棒状的钨极和母材间产生电弧进行焊接的。


      [unit_001779; type=passage; page=158]

      TIG焊的历史比较久远，1911年人们开始尝试在氦气中使用钨极的方法。当时主要使用氦气和氩气进行焊接，造价很高。1930年工业中开始大量使用镁金属，这时TIG焊才开始表现出它的真正价值，原因是镁熔化后极易被氧化，焊接时必须完全隔离空气的影响，从此，TIG焊随着铝、镁等金属焊接的需要而发展起来。到目前为止，几乎所有的金属焊接都在不同程度地使用TIG焊方法。'
  output: '规则组1

    C: 无

    R: 气体|Ar —[属于]→ 气体类型|惰性气体

    R: 惰性气体|存在 —[具有]→ 化学性质|不与其他物质反应

