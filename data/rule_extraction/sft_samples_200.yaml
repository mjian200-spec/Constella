      \ type=passage; page=62]\n  同气体的消离时间。从图中可以看出，电弧空间的电离气体完全中和消离要有一定的时间过程，因此在电弧热惯性的作用下还保持一定的电离度，这是与电极材料无关的。因此不同电极材料在高频交流作用下表现出来的差异，主要是由于电极材料物理性能差别引起的，冷阴极材料在高频电流作用下，尽管电弧空间还保持一定的电离状态，但由于这种材料熔点与沸点很低，使电极不能维持较高的温度，热发射电子能力很差，即使在高频交流作用下，仍需较高的再引燃电压。它的再引燃电压也受焊接电流的影响，即也受电弧的热惯性影响，随着焊接电流的增大，再引燃电压数值下降，但它总是要求较高的再引燃电压。在埋弧焊时，由于焊剂中有一定的稳弧成分，再加上钢的熔点较高，因此它的再引燃电压数值也随交流电频率的增加而下降。\n\
