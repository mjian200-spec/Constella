      : [], \"candidate_ranges\": []}\n  [unit_002437; type=passage; page=220]\n  如果在焊缝金属中硅的质量分数大于 $0.2\\%$ 时，就可以防止CO气体所引起的气孔。这是由于在焊缝金属的凝固温度时硅具有强烈的脱氧作用［见方程式(5-13)]。硅与氧化亚铁作用而阻止了碳的氧化。除了硅作为脱氧元素以外，还可以加入锰、钛和铝等。在现代工业中由于使用了脱氧焊丝，而使得\
      \ $\\mathrm{CO}_{2}$ 气体保护焊可以得到致密的焊缝。\n- [constraint_000495] 温度: 焊缝金属的凝固温度\n  来源 Unit: unit_002437\n  作用域: {\"scope_type\"\
      : \"unit_range\", \"start_unit_id\": \"unit_002437\", \"end_unit_id\": \"unit_002476\", \"target_unit_ids\": [], \"\
      candidate_ranges\": []}\n  [unit_002437; type=passage; page=220]\n  如果在焊缝金属中硅的质量分数大于 $0.2\\%$ 时，就可以防止CO气体所引起的气孔。这是由于在焊缝金属的凝固温度时硅具有强烈的脱氧作用［见方程式(5-13)]。硅与氧化亚铁作用而阻止了碳的氧化。除了硅作为脱氧元素以外，还可以加入锰、钛和铝等。在现代工业中由于使用了脱氧焊丝，而使得\
      \ $\\mathrm{CO}_{2}$ 气体保护焊可以得到致密的焊缝。\n\n核心正文:\n[unit_002438; type=passage; page=220]\n含脱氧元素不同的几种典型焊丝对气孔的影响也不同（见表5-1）。由表5-1可以清楚地看出，随着焊丝中含硅量的增加，焊缝中的外气孔和内气孔的数量逐渐减少。\n\
