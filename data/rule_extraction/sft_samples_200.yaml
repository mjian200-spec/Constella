source_issue_log:
- context_id: context_000004
  issue: 原文“设备的逆变化”疑似OCR或原书用词异常；金标保留原文，不自行改成“逆变化”。
- context_id: context_000022
  issue: 核心正文以“越大”开头，缺少前句主语；金标不抽取该残句。
- context_id: context_000124
  issue: 核心正文以“可以看到，这两”截断；金标不补写后续结论。
- context_id: context_000400
  issue: 核心正文以“目的之一”截断；金标只抽取此前已经闭合的命题。
- context_id: context_000422
  issue: 核心正文以“可以不开坡口或”截断；金标不抽取未完成的坡口规则。
- context_id: context_000074
  issue: 核心正文以“电子数量不足，必然”截断；金标不推断后续空间电荷结论。
- context_id: context_000186
  issue: 平行电弧只说明随电流方向不同可能吸引或排斥，未给出方向到结果的具体映射；金标不抽取证据未闭合的平行电弧关系。
- context_id: context_000357
  issue: 正文以“可以采用以下几种方法”结束，具体消除直流分量的方法缺失；金标只抽取必须限制或消除的要求。
- context_id: context_000449
  issue: 正文以“脱氧能力按递减次序排”截断；金标不补写元素排序。
- context_id: context_000008
  issue: 核心正文开头缺少回路首个组成项，金标不补全回路组成。
- context_id: context_000151
  issue: 核心正文以“斑点上将积聚很高”截断，金标不推断积聚的是温度或能量。
- context_id: context_000341
  issue: 核心正文以“从焊接参数稳定性方面”截断，金标只抽取此前闭合规则。
- context_id: context_001222
  issue: 核心正文在参数名称“钨”处截断；表4-17资源文字化内容完整，金标只补充该表明确提供的普通钢参数。
- context_id: context_000030
  issue: 核心正文首尾均被截断；金标只抽取中间语义闭合的电场电离过程，不补写截断内容。
- context_id: context_000038
  issue: 核心正文以“而对其”截断；金标不推断其后关于其他气体的结论。
- context_id: context_000049
  issue: 公式OCR将电子质量和速度下标识别为c，但紧邻符号说明明确为m_e和v_e；金标采用符号说明校正后的下标。
- context_id: context_000052
  issue: 关联式(2-16)的OCR指数符号存在疑点，且正文仅用其说明指数关系；金标保留正文趋势，不转录可疑公式。
- context_id: context_000025
  issue: 核心正文末句截断，金标不推断强迫冷却、强迫压缩或大电流电弧的后续结论。
- context_id: context_000120
  issue: 核心正文在“造成图2-”处截断，金标不补写图号及后续波形结论。
- context_id: context_000406
  issue: 核心正文以“降”开头，缺失前文变量；金标从其后闭合的电弧收缩链开始抽取。
- context_id: context_000442
  issue: 核心正文以“目前大”截断，金标不补写后续水分控制标准。
- context_id: context_000718
  issue: 核心正文以“侧壁打火”开头，缺失触发因素；金标不抽取该残句的因果关系。
- context_id: context_000214
  issue: 核心正文以“从而产生”截断，金标只保留此前闭合的CO2压缩、电弧集中和电流密度关系。
- context_id: context_000404
  issue: 核心正文末尾开始新的活性剂分解机理但被截断，金标不补写其后作用。
- context_id: context_001642
  issue: 模型缓存混入核心正文之外的TIG及材料选择内容；金标只依据本包单一气体与混合气体段落。
- context_id: context_002485
  issue: 核心正文只给出薄铝工件的两个频率范围；金标不采用模型补造的厚度变化趋势。
- context_id: context_000028
  issue: 核心正文首尾截断；金标不补写解离前的分子过程及末尾原因。
- context_id: context_000033
  issue: 开头缺失“电子获得四倍动能”的比较条件，金标不抽取该残缺倍数关系。
- context_id: context_000034
  issue: 核心正文末尾逗号截断；金标只抽取已闭合的两轮碰撞增殖过程。
- context_id: context_000217
  issue: 核心正文在“由大滴过渡时的阻力变为射滴过渡时”截断，不补写斑点压力最终方向。
- context_id: context_000820
  issue: 核心正文以“当间距达到20mm时，可”截断，不生成20mm间距的后续用途规则。
- context_id: context_000009
  issue: 核心正文在“电弧放电在”处截断，不抽取电弧放电电流区间。
- context_id: context_000044
  issue: 核心正文末句在“电子占有费米能级的几”处截断，不补写其概率结论。
- context_id: context_000202
  issue: 核心正文开头缺少“电弧电”主语，末尾在过渡形式名称“亚”处截断；两端均不补全。
- context_id: context_000413
  issue: 核心正文开头缺失氢气孔关系的主语和谓语，金标从完整的钛合金条件句开始。
- context_id: context_000617
  issue: 原文层间温度被OCR为“不低于100%”，结合温度属性校正为“不低于100℃”。
- context_id: context_000815
  issue: 核心正文以“池。所以”开头，前序熔池关系缺失；金标只使用其后闭合命题。
- context_id: context_001308
  issue: 核心正文在“焊丝与焊”处截断；图5-82明确展示接触母材后产生电弧，金标将图片时序作为证据。
- context_id: context_001311
  issue: 核心正文在“低电流范围内改”处截断，不抽取其后送丝速度曲线趋势。
- context_id: context_001801
  issue: 核心正文以“池。所以”开头，缺少此前动作；金标从闭合的熔池对流方向开始。
- context_id: context_001903
  issue: 核心正文以“电源电”截断，不补写电源波形或外特性。
- context_id: context_002006
  issue: 核心正文开头为前一SiO2段残句，且1270被OCR为1270%；金标不抽取SiO2残句，并将FeO-MnO-SiO2熔点校正为1270℃。
- context_id: context_002065
  issue: 核心正文以“点为斜率最大处”开头，缺失点名；金标以“曲线斜率最大点”保留闭合属性，不猜测字母。
- context_id: context_002067
  issue: 核心正文开头缺少造成熔滴受力均匀的主语；金标将已给出的受力和形态作为C，不补写其原因。
- context_id: context_002077
  issue: 核心正文开头“变时”截断，金标只使用I_m为常数后的闭合关系。
- context_id: context_002274
  issue: 核心正文首词缺失电弧形态名称，金标不猜测名称，只保留其余可确认特征与定义。
- context_id: context_000071
  issue: 图2-13资源文字化称所有曲线随电流增加而降低，与核心正文“大电流区增加”冲突；金标采用正文分区趋势。
- context_id: context_000085
  issue: 缓存初稿混入当前核心之前的阳极热电离规则；金标只保留核心闭合关系和图示温度趋势。
- context_id: context_000128
  issue: 核心正文在“焊接电流稍大时”截断；平特性和正阻特性仅依据清晰的图2-53曲线抽取。
- context_id: context_000443
  issue: 核心正文在化学反应冒号处截断且未关联反应公式，金标不抽取铁锈反应式。
- context_id: context_000478
  issue: 核心正文末句缺少句号但命题闭合；表5-10提供完整允许偏差，可逐组抽取。
- context_id: context_001012
