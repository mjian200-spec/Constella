  input:
    text: '上下文包编号: context_000490


      标题路径:

      第5章 $\mathrm{CO}_{2}$ 气体保护焊 > 5.3 $\mathrm{CO}_{2}$ 焊的熔滴过渡 > 5.3.1 $\mathrm{CO}_{2}$ 焊熔滴过渡的类型


      核心正文:

      [unit_002663; type=passage; page=249]

      $\mathrm{CO}_{2}$ 焊熔滴过渡类型与焊接电流、电弧电压有关，如图5-21所示。图5-21的试验条件为 $\phi1.6\mathrm{mm}$ 的H08Mn2SiA焊丝，图中给出了熔滴过渡与焊接电流的关系。虚线 $PQ$
      为负载线，大致与电弧静特性曲线相同。按熔滴过渡特点，根据焊接电流的大小，熔滴过渡分为三个区域：在小电流和低电压的 $C$ 区，电弧呈短路过渡；如果电压过高，则呈现大滴过渡；只有当电弧电压略低于 $PQ$ 线以下时，才能得到稳定的短路过渡。$A$
      区为大电流和高电压区域，最佳电弧电压略低于 $PQ$ 线以下，电弧呈潜弧状态。当焊接参数处于中间区域 $B$ 区时，电弧呈瞬时短路或明弧状态。图5-21中在 $PQ$ 线上下两条实线的包围区为合适的电弧电压区间。在合适的焊接参数区间之上为明弧区，熔滴呈排斥状，而在该区以下为顶丝区（这时焊丝与焊件发生固体短路）。


      支撑内容:

      [unit_002662; type=title; page=249]

      5.3.1 $\mathrm{CO}_{2}$ 焊熔滴过渡的类型'
