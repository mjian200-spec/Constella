  construction_rationale: 正文和图6-66共同支持电流增加时熔深增大且形状由指状变盆底状。“十分有利”没有说明具体评价属性，不生成含糊的整体优劣关系。φ5.6mm铝焊丝、Ar+He保护和1000A临界电流共同限定75mm双面单层焊能力，其他图表仅作核对。
