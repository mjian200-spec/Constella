      焊接电弧一般呈锥形，如图2-26所示，靠近电极（焊丝）一端的电弧断面积比靠近工件一端的小，由式（2-37）可知，电极端电弧的电磁收缩力比工件端的电磁收缩力大，于是在电弧中形成了电弧静压力，从电极 $A$ 点到工件 $B$ 点形


