    text: "上下文包编号: context_000107\n\n标题路径:\n第2章 焊接电弧 > 2.2 电弧的能量转换 > 2.2.2 电弧压力及其影响因素\n\n包条件（已由上游确定作用域）:\n- [constraint_000102]\
      \ 电流: 电流在一个导体中流过\n  来源 Unit: unit_000578\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_000578\"\
      , \"end_unit_id\": \"unit_000668\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000578; type=passage;\
      \ page=49]\n  当电流在一个导体中流过时，整个电流可看做由许多平行的电流线组成，这些电流线间将产生相互吸引力，使导体截面有收缩的倾向，如图2-21所示。对于固态导体，此收缩力不能改变导体外形，但对于液态或气态导体，其将产生截面收缩，如图2-22所示，这种现象称为电磁收缩效应，所产生的力称为电磁收缩力或电磁力，这种情况在\
      \ $\\mathrm{CO}_{2}$ 气体保护电弧焊熔滴短路过渡时表现得最为突出。\n- [constraint_000107] explicit_condition: 电极上形成熔滴并出现斑点\n  来源 Unit: unit_000628\n\
      \  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_000628\", \"end_unit_id\": \"unit_000646\", \"target_unit_ids\"\
      : [], \"candidate_ranges\": []}\n  [unit_000628; type=passage; page=52]\n  （1）正离子和电子对电极的撞击力 阳极接受电子撞击，阴极接受正离子的撞击。由于正离子的质量远远大于电子的质量，同时一般情况下阴极压降\
      \ $U_{\\mathrm{C}}$ 大于阳极压降 $U_{\\mathrm{A}}$ ，通常这种斑点力在阴极上表现较大，在阳极上表现较小。（2）电磁收缩力 当电极上形成熔滴并出现斑点时，焊丝、熔滴及电弧中电流的分布如图2-28所示，熔滴和电弧空间的电流线都在斑点处集中。根据前面电磁收缩力产生的原理，\n\
      \n核心正文:\n[unit_000643; type=passage; page=53]\n重量为几十毫克。这些细颗粒在等离子流力的作用下，以很高的加速度（可达重力加速度的50倍以上）冲向熔池，到达熔池时其速度可达每秒几百米的数量级，这些细颗粒熔滴带有很大的动能，再加上电磁压力及等离子流力的作用，使焊缝极易形成指状的熔深（见图2-31）。\n\
      \n支撑内容:\n[unit_000566; type=title; page=48]\n2.2.2 电弧压力及其影响因素\n\n资源文字化:\n[unit_000644; type=figure; page=53]\n题注: 图2-31\
      \ 熔滴的冲击力\n原始文字:\n图2-31 熔滴的冲击力\n资源标题: 图2-31 熔滴的冲击力\n资源描述: 该图包含两个子图 a) 和 b)，展示了熔滴与基体相互作用的过程。子图 a) 显示一个垂直的管状结构（焊丝）末端有一个黑色的椭圆形熔滴，该熔滴正接触下方的水平基体表面，基体表面下方有斜线阴影表示实体。子图\
      \ b) 显示熔滴撞击基体后的状态，熔滴呈向下喷射的锥形，冲击点在基体表面形成一个凹坑，凹坑内部有黑色填充，周围有虚线轮廓表示变形范围，基体表面同样有斜线阴影。"
