      气体保护焊焊接碳钢和低合金钢时，可以得到良好的效果，但是却降低了焊接接头的韧性。所以根据对焊接质量的要求不同，要选择不同的保护气体。要求低时，可以采用纯 $\mathrm{CO}_{2}$ 气体保护或（$\mathrm{CO}_{2}+\mathrm{O}_2$）混合气体保护；而要求较高时，可以采用富氩混合气体（$\mathrm{Ar+O}_2$）或（$\mathrm{Ar}+\mathrm{CO}_{2}$），这时因为有氧化性气体，在阴极破碎氧化膜的同时，还不断地生成新的氧化物，使阴极斑点被固定在熔池上，使得电弧稳定，并改善了焊缝成形。同时还应根据母材的板厚来选择混合气体，随着板厚的增加，应适当提高混合气体中
