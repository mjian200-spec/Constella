      - [constraint_000097] 电流: 电流由 $1\\sim 1000\\mathrm{A}$ 变化\n  来源 Unit: unit_000555\n  作用域: {\"scope_type\": \"unit_range\"\
      , \"start_unit_id\": \"unit_000555\", \"end_unit_id\": \"unit_000565\", \"target_unit_ids\": [], \"candidate_ranges\"\
      : []}\n  [unit_000555; type=passage; page=47]\n  弧柱的温度受电极材料、气体介质、电流大小、拘束程度等多种因素的影响。在常压下，当电流由 $1\\sim 1000\\mathrm{A}$\
      \ 变化时，弧柱温度可在5000 $\\sim 30000\\mathrm{K}$ 之间变化。钨和铜电极与碳和碳之间的电弧纵断面的等温线如图2-18所示\n\n核心正文:\n[unit_000563; type=passage; page=48]\n\
      焊接电弧的温度分布具有这样一个特点：靠近电极直径小的一端，如焊丝或焊条一端电流密度和能量密度高，电弧的温度也高。不管焊丝（或焊条）接正极还是接负极都有这个特点。电弧空间的温度高低，受电弧空间金属蒸气成分的影响。不同金属蒸气的电离能不一样，电弧温度也有很大的差异，图2-19就表示了弧柱温度与金属蒸气电离能的关系，如果电弧空间无金属蒸气，由于Ar的电离势较高，电弧空间的电离度较小，则电场强度提高。当电极材料大量蒸发时，由于金属蒸气的电离能显著小于Ar，故电离度增加，电弧温度却降低。如焊条电弧焊时，由于药皮中含有易电离的K、Na等稳弧剂，电弧空间存在有K、Na等金属蒸气，则电弧温度较低。焊接电流大小直接改变弧柱的能量密度，它也影响弧柱温度的高低。焊接电流增大，弧柱温度增加，如图2-20所示。另外，当电弧周围有气体高速流动时，如等离子弧，由于周围高速气流的冷却使弧柱电场强度显著升高，则温度上升。周围气氛是多原子气体时，如\
      \ $\\mathrm{CO}_{2}$ 、 $\\mathrm{O}_2$ 、 $\\mathrm{H}_{2}$ 、 $\\mathrm{H}_2\\mathrm{O}$ 、 $\\mathrm{N}_2$ 等，由于气体解离吸热，也将使电弧温度升高。\n\
      \n支撑内容:\n[unit_000493; type=title; page=42]\n2.2.1 电弧的产热机构及温度分布\n\n资源文字化:\n[unit_000564; type=figure; page=48]\n题注:\
      \ 图2-19 金属蒸气电离能与弧柱温度的关系\n原始文字:\n图2-19 金属蒸气电离能与弧柱温度的关系\n资源标题: 金属蒸气电离能与弧柱温度的关系\n资源描述: 该图为二维直角坐标系散点图。横轴表示电离能 $U_i$，单位为伏特\
      \ (V)，刻度范围从 4 到 12，间隔为 1。纵轴表示温度 $T$，单位为开尔文 (K)，刻度范围从 4000 到 7000，间隔为 1000。图中绘制了一条从左下方向右上方延伸的直线，表示电离能与温度呈正相关关系。直线上分布着代表不同金属元素的空心圆点，各点旁标注了对应的元素符号。从横轴数值较小（左下）到较大（右上）的顺序，各点依次标注为：K、Li、Al、Ca、Cr、Mn、Fe、B、Cd、Zn、C。\n\
      \n[unit_000565; type=figure; page=48]\n题注: 图2-20 弧柱温度与焊接电流的关系（钢焊条，空气中）\n原始文字:\n图2-20 弧柱温度与焊接电流的关系（钢焊条，空气中）\n资源标题: 弧柱温度与焊接电流的关系（钢焊条，空气中）\n\
      资源描述: 这是一张二维散点拟合图。横坐标为“焊接电流 /A”，刻度从0开始，标记有100、200、300、400。纵坐标为“T/K”，刻度标记有5000、5500、6000。图中包含约8个黑色实心圆点数据，以及一条穿过数据点的黑色实线拟合曲线。曲线显示随着焊接电流的增加，温度T呈上升趋势，且增长速率逐渐减缓（曲线斜率变小）。在电流较低时（约50A-100A区间），数据点分布在曲线下方；在电流较高时（约200A以上），数据点基本落在曲线上或略高于曲线。"
