      [unit_000187; type=passage; page=17]

      众所周知，金属导电时其中流过的电流与电压的关系遵守欧姆定律 $I = U / R$ 。而气体放电则不然，其不遵守欧姆定律，而是一个十分复杂的关系，如图2-2所示。它是在大气压为 $100\mathrm{Pa}$ 、电极距离为数厘米时的放电电流—电压特性。在较小的电流区间（
      $10^{-10} \sim 10^{-8}\mathrm{A}$ ），气体放电所需要的带电粒子不能通过导电过程本身产生，而需要外部注入带电粒子，否则它将失去导电性，这种气体导电现象被称为非自持放电。当电流变大时，气体导电过程本身就可以产生维持导电所需的带电粒子，这种放电过程称为自持放电。在自持放电区间，放电机构根据电流的不同其特性具有显著的差异。自持放电又分为暗放电、辉光放电和电弧放电三种基本形式。暗放电时电压较高，电流很小，约为
      $10^{-8} \sim 10^{-4}\mathrm{A}$ ，没有光亮。电流进一步提高到 $10^{-4}\mathrm{A}$ 以上一直到0.1A左右，具有明亮的辉光现象。电弧放电在


