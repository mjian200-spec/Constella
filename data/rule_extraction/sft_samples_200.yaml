      \n[unit_003666; type=table; page=347]\n题注: 表 6-10 锅炉联箱脉冲焊焊接参数\n表格正文:\n<table><tr><td>\\( f/\\mathrm{{Hz}} \\)</td><td>\\\
      ( {I}_{\\mathrm{p}}/\\mathrm{A} \\)</td><td>\\( {I}_{\\mathrm{b}}/\\mathrm{A} \\)</td><td>\\( {v}_{\\mathrm{s}}/\\left(\
      \ {\\mathrm{m}/\\mathrm{h}}\\right) \\)</td><td>气体 (体积分数)</td></tr><tr><td>50~100</td><td>450</td><td>240</td><td>\\\
      ( 7 \\sim  9 \\)</td><td>\\( \\mathrm{{Ar}} + {\\mathrm{O}}_{2}2\\% \\)</td></tr></table>\n原始文字:\n<table><tr><td>\\\
      ( f/\\mathrm{{Hz}} \\)</td><td>\\( {I}_{\\mathrm{p}}/\\mathrm{A} \\)</td><td>\\( {I}_{\\mathrm{b}}/\\mathrm{A} \\)</td><td>\\\
      ( {v}_{\\mathrm{s}}/\\left( {\\mathrm{m}/\\mathrm{h}}\\right) \\)</td><td>气体 (体积分数)</td></tr><tr><td>50~100</td><td>450</td><td>240</td><td>\\\
      ( 7 \\sim  9 \\)</td><td>\\( \\mathrm{{Ar}} + {\\mathrm{O}}_{2}2\\% \\)</td></tr></table>\n资源标题: 表 6-10 锅炉联箱脉冲焊焊接参数\n\
      资源描述: 表格包含两行五列。第一行为表头，依次为：f/Hz、Ip/A、Ib/A、vs/(m/h)、气体(体积分数)。第二行为数据，依次为：50~100、450、240、7~9、Ar + O2 2%。"
