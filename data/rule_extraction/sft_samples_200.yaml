      mathrm{CO}_{2}$ 焊工艺\n\n包条件（已由上游确定作用域）:\n- [constraint_000704] parameter: 250A以上\n  来源 Unit: unit_003173\n  作用域: {\"\
      scope_type\": \"unit_range\", \"start_unit_id\": \"unit_003173\", \"end_unit_id\": \"unit_003206\", \"target_unit_ids\"\
      : [], \"candidate_ranges\": []}\n  [unit_003173; type=passage; page=300]\n  （1）药芯焊丝 $\\mathrm{CO}_{2}$ 焊的优点 药芯焊丝 $\\\
      mathrm{CO}_{2}$ 焊与实心焊丝 $\\mathrm{CO}_{2}$ 焊相比，尽管表面上看有许多类似之处，但是药芯焊丝 $\\mathrm{CO}_{2}$ 焊仍有许多优势。1）由于药芯焊丝中加入了稳弧剂，所以焊接电弧稳定，电弧柔和，飞溅很少，焊缝外观成形良好。2）由于\
      \ $\\mathrm{CO}_{2}$ 气体与药芯中焊剂的联合保护作用，不仅屏蔽了空气，而且还能进行脱氧反应，从而提高了焊缝金属的抗气孔能力。3）药芯焊丝比实心焊丝具有更高的熔敷速度。这是因为相同直径的焊丝，药芯焊丝仅仅是外部的薄钢皮导电，实际导电截面积小，则电流密度大。另外药芯焊丝的焊丝伸出长度较大，通常焊接电流在250A以下时为\
      \ $15\\mathrm{mm}$ ，而在250A以上时为 $20\\sim 25\\mathrm{mm}$ ，因此焊丝的熔化效率更高。4）药芯焊丝对弧焊电源的适应性强，不仅可以选择直流电源，而且还可以选择交流电源；另外不仅可以选用平特性电源，而且还可以选择陡降特性电源。所以一般用于实心焊丝的\
      \ $\\mathrm{CO}_{2}$ 焊机均可用于药芯焊丝，勿需再开发新的焊机。5）焊接各种钢材的适应性强。尤其是焊接高强度钢，难以提供相应的实心焊丝，而对于药芯焊丝，通过调整药芯的成分和比例，就能满足需要。\n\n核心正文:\n\
      [unit_003175; type=passage; page=300]\n1）焊丝价格很贵。因制造焊丝的设备复杂，材料成本较高2）药芯焊丝大多有缝，不能镀铜，易生锈和吸湿，必须加强管理。3）焊接烟尘很大，污染环境，影响健康。4）需要专用送丝机，否则将压扁焊丝，而影响送丝的稳定性。\n\
      \n支撑内容:\n[unit_003170; type=title; page=300]\n5.4.4 药芯焊丝 $\\mathrm{CO}_{2}$ 焊工艺"
