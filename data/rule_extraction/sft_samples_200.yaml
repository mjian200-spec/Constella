      \ page=104]\n除上述几个主要作用力外，还有一个影响熔滴过渡的力就是爆炸力。当熔滴在电弧空间停留时间较长时，在熔滴内部由于冶金反应生成较多的气体（如CO等），这些气体逐渐积聚，并使熔滴体积膨胀，当内压力足够大时，熔滴将发生爆破，其中大部分液体金属向熔池过渡，而少量金属成为飞溅。\n\
