  input:
    text: '上下文包编号: context_000449


      标题路径:

      第5章 $\mathrm{CO}_{2}$ 气体保护焊 > 5.2 $\mathrm{CO}_{2}$ 焊的冶金特点与焊接材料 > 5.2.3 $\mathrm{CO}_{2}$ 气体保护焊的脱氧措施


      核心正文:

      [unit_002470; type=passage; page=223]

      脱氧的核心问题是尽量抑制式（5-15）的反应，尤其是在熔池尾部的较低温度区域内所发生的反应。合金元素氧化的强弱，不但取决于焊接区域中合金元素的浓度，而且还取决于合金元素与氧的结合能力。当某种元素的浓度越大和它与氧的结合能力越强时，则这种元素越容易氧化。脱氧作用就是利用与氧的结合力比铁大的元素优先氧化，从而保护了铁，使之不生成或少生成
      $\mathrm{FeO}$。金属氧化物的分解压 $p_{O_2}$ 可以作为判断金属对氧的结合力的标准。如 $\{p_{O_2}\}>p_{O_2}$，金属被氧化；$\{p_{O_2}\}=p_{O_2}$，处于平衡状态；$\{p_{O_2}\}<p_{O_2}$，金属被还原。假如在金属—金属氧化物系统中，氧的分压为
      $\{p_{O_2}\}$，则金属氧化物的分解压是温度的函数，它随着温度的升高而增加（见图5-13）。此外，液态金属中合金元素的浓度也对分解压有一定的影响。在较低温度下（$1117^{\circ}\mathrm{C}$时）元素的脱氧能力按递减次序排


      支撑内容:

      [unit_002468; type=title; page=223]

      5.2.3 $\mathrm{CO}_{2}$ 气体保护焊的脱氧措施


      关联表格/公式/资产:

      [unit_002430; type=formula; page=219]

