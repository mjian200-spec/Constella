    text: "上下文包编号: context_000113\n\n标题路径:\n第2章 焊接电弧 > 2.2 电弧的能量转换 > 2.2.2 电弧压力及其影响因素\n\n包条件（已由上游确定作用域）:\n- [constraint_000111]\
      \ 弧长: 短弧长\n  来源 Unit: unit_000654\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_000654\", \"end_unit_id\"\
      : \"unit_000675\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000654; type=passage; page=54]\n  （3）电极（焊丝）直径\
      \ 焊丝直径越细，电流密度越大，电磁力越大，同时电弧呈现锥形越明显，等离子流力增大，使电弧的总压力增加。电弧在短弧长时，电极直径对电弧力的影响明显。（4）电极（焊丝）极性 电极（焊丝）极性对电弧力有很大的影响。对钨极氩弧焊（TIG焊），钨极接负极时允许流过较大的电流，阴极区收缩的程度大，将形成锥度较大的锥形电弧，产生的轴向推力大，电弧压力也大。反之，钨极接正极则形成较小的电弧压力，一是需要使用较粗的钨极，同时电弧在钨极上的覆\n\
      - [constraint_000113] 焊丝: 焊丝接负极\n  来源 Unit: unit_000658\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\":\
      \ \"unit_000658\", \"end_unit_id\": \"unit_000675\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000658;\
      \ type=passage; page=55]\n  对于熔化极气体保护电弧焊（MIG焊），当焊丝接负极时，熔滴受到正离子的冲击，受到排斥作用。同时阴极斑点不稳定，不断地沿焊丝上爬和下滑，扩大了阴极表面积，使之难以形成较大的电磁力和等离子流力，因此电弧力小。在焊丝接正极时，所受到的斑点力小，容易形成细小的熔滴，有较大的电磁力和等离子流力，电弧力较大，如图2-37所示。\n\
      - [constraint_000114] explicit_condition: 把钨极前端加工成空心形状\n  来源 Unit: unit_000667\n  作用域: {\"scope_type\": \"unit_range\"\
      , \"start_unit_id\": \"unit_000667\", \"end_unit_id\": \"unit_000675\", \"target_unit_ids\": [], \"candidate_ranges\"\
      : []}\n  [unit_000667; type=passage; page=56]\n  当把钨极前端加工成空心形状时（在电弧-激光同心复合能源中使用），电弧压力也有明显降低，如图2-40所示。\n- [constraint_000115]\
      \ 电流: 电流以某一规律变化\n  来源 Unit: unit_000670\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_000670\"\
      , \"end_unit_id\": \"unit_000675\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000670; type=passage;\
      \ page=56]\n  （6）脉冲电流的影响 当电流以某一规律变化时，电弧压力也相应变化。TIG焊时交流电弧压力低于直流正接，但高于直流反接。\n\n核心正文:\n[unit_000671; type=passage; page=56]\n\
      低频脉冲焊时，电弧压力的变化能够跟随电流的变化，如图2-41所示：随着脉冲频率的增加，电弧压力的变化逐渐滞后于电流的变化。当脉冲频率高于几千赫兹以后，由于高频电磁效应增强，在平均电流值相同的情况下，电弧压力比直流电弧有很大程度的增加，如图2-42所示。\n\
      \n支撑内容:\n[unit_000566; type=title; page=48]\n2.2.2 电弧压力及其影响因素\n\n资源文字化:\n[unit_000672; type=figure; page=56]\n题注: 图2-41\
      \ 脉冲电流下电弧力的变化\n原始文字:\n图2-41 脉冲电流下电弧力的变化\n资源标题: 图2-41 脉冲电流下电弧力的变化\n资源描述: 该图包含上下两排波形图，横轴均为时间，纵轴左侧标注为“电弧压力/(×133Pa)”，右侧标注为“电弧电流/A”。\n\
      \n上排左侧图显示电流波形：电流在100A和200A之间呈方波跳变，高电平持续时间为5ms。\n上排右侧图显示对应的电流波形：电流呈正弦波变化，峰值约为200A，谷值约为100A，半个周期（峰值到谷值）的时间跨度标注为5ms。\n\n\
      下排左侧图显示对应的电弧压力波形：压力随电流方波变化，在电流为200A时压力约为150-170(×133Pa)，在电流为100A时压力约为30-40(×133Pa)。\n下排右侧图显示对应的电弧压力波形：压力随电流正弦波变化，峰值约为150(×133Pa)，谷值接近0。\n\
      \n[unit_000675; type=figure; page=57]\n题注: 图2-42 电弧力随电流频率的变化\n原始文字:\n图2-42 电弧力随电流频率的变化\n资源标题: 图2-42 电弧力随电流频率的变化\n资源描述:\
      \ 该图为电弧压力随频率变化的曲线图。纵坐标为电弧压力/kPa，刻度范围从0.1到0.4；横坐标为频率/kHz，刻度点包括D.C.、1、5、10、15。图中包含一条实线曲线，显示电弧压力随频率增加而上升，在10kHz后趋于平缓。图中还分布有若干黑色矩形块，内部带有白色水滴状图案，分别位于不同频率位置。图内标注了实验参数：平均电流50A，峰值电流150A，基值电流5A，电弧长度3.0mm，电极Th-W直径2.4mm，电极角60°，保护气Ar\
      \ 15L/min，铜阳极压力测定孔径1.0mm。"
