    规则组2

    C: 无

    R: 气体电离电压|高低 —[表征]→ 电子脱离气体粒子所需外加能量|高低

    R: 气体电离电压|高低 —[表征]→ 带电粒子产生难易|难易

    R: 气体其他性质|解离性能、热物理性能等 —[影响]→ 电弧空间能量状态|变化

    R: 气体其他性质|解离性能、热物理性能等 —[影响]→ 带电粒子产生和移动过程|变化

    R: 焊接电弧现象|分析 —[要求考虑]→ 气体各种性质|综合作用'
