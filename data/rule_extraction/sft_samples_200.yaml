schema_version: 2
dataset: constella_rule_extraction_sft_200
language: zh-CN
task: 从真实焊接技术资料上下文包抽取规则DSL
notes: 200条人工逐项复核金标；input.text为模型文本上下文，input.images为需要随消息传入的原始图片，output仅含目标DSL。
