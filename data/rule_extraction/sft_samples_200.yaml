      , \"end_unit_id\": \"unit_002324\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_002314; type=passage;\
      \ page=209]\n  预热焊丝用的电源可以是直流电源也可以是交流电源，由于流过焊丝的电流所产生的磁场影响，电弧会产生磁偏吹，在这种情况下，当加热电流不超过焊接电流的 $60\\%$ ，电弧摆动幅度被限制在 $30^{\\circ}$\
      \ 左右。为了使焊丝加热电流不超过焊接电流的 $60\\%$ ，通常焊丝最大直径限为 $1.2\\mathrm{mm}$ 。\n\n核心正文:\n[unit_002323; type=passage; page=210]\n表4-29为使用两种不同TIG焊方法焊接窄间隙试样比较，热丝TIG焊焊接效率整整提高了一倍。此外热丝TIG法还可减少焊缝中的裂纹。可以预见，热丝TIG焊方法在海底管线、油气输送管线、压力容器及堆焊等领域中的应用将会进一步扩大，是一种很有发展前途的焊接方法。\n\
