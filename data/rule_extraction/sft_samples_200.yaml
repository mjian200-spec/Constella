      : \"unit_001846\", \"end_unit_id\": \"unit_001876\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_001846;\
      \ type=passage; page=164]\n  钨极的中心应与喷嘴中心重合，以保证保护气体均匀地从喷嘴流出。钨极还应伸出气体喷嘴一定长度，它应根据焊件形状与坡口特点调整到合适高度，并固定住。焊枪的规格应根据焊接电流来选择。通常焊枪的额定电流为500A。小电流时（焊接电流小于150A）焊枪采用空冷。当焊接电流大于150A时，由于焊接电流增大，钨极与喷嘴被加热，必须用水冷。\n\
      - [constraint_000380] explicit_condition: 气体流量一定\n  来源 Unit: unit_001857\n  作用域: {\"scope_type\": \"unit_range\", \"\
      start_unit_id\": \"unit_001857\", \"end_unit_id\": \"unit_001876\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n\
      \  [unit_001857; type=passage; page=166]\n  如果气体流量过低，气体排除周围空气的能力弱，保护效果差；气体流量过大，气体排出时容易形成紊流，使空气卷入，也会降低保护效果。同样，在气体流量一定时，喷嘴直径过小，保护区域小，且因气流速度过高而形成紊流；喷嘴直径过大，不仅妨碍焊工观察，而且流速过低，保护效果也不好。一般手工TIG焊喷嘴内孔直径范围为\
      \ $5\\sim 20\\mathrm{mm}$ ，流量范围为 $5\\sim 25\\mathrm{L / min}$\n\n核心正文:\n[unit_001860; type=passage; page=166]\n1）保护气流具有良好的流动状态和适当的挺度，以获得可靠的保护。2）喷嘴内上部留有较大空间作为缓冲室，以降低气流速度。3）喷嘴内下部断面应均匀，通道通畅，通道长度较长，以保证近壁层流厚度。主要尺寸的关系式为\n\
      \n支撑内容:\n[unit_001844; type=title; page=164]\n4.2.2 TIG焊的焊接保护效果\n\n[unit_001863; type=passage; page=166]\n式中 $D_{\\\
      mathrm{i}}$ —喷嘴内孔直径（ $\\mathrm{mm}$ ）；\n\n[unit_001864; type=passage; page=166]\n$d_{\\mathrm{w}}$ ——钨极直径（mm）；\n\n[unit_001865;\
      \ type=passage; page=166]\n$L_{0}$ ——内孔通道长度（mm）。\n\n资源文字化:\n[unit_001861; type=formula; page=166]\n题注: \n原始文字:\n$$D\
      \ _ {\\mathrm {i}} = (2. 5 \\sim 3. 5) d _ {\\mathrm {w}} \\tag {4-1}$$\n公式摘要: 喷嘴内孔直径与钨极直径的比例关系\n符号释义: [{\"symbol\"\
      : \"D_{\\\\mathrm{i}}\", \"meaning\": \"喷嘴内孔直径\", \"unit\": \"mm\", \"evidence_unit_ids\": [\"unit_001863\"]}, {\"symbol\"\
      : \"d_{\\\\mathrm{w}}\", \"meaning\": \"钨极直径\", \"unit\": \"mm\", \"evidence_unit_ids\": [\"unit_001864\"]}]"
