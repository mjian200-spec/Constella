- id: context_001435
  route: text+image
  difficulty_tags:
  - CBT控制链
  - 再引燃预测
  - 飞溅抑制
  - 越界删除
  construction_rationale: EN和EP半波均由短路周期组成，但两者是备选半波，不能写入同一条件状态，因此拆成两组同构规则。为实现无飞溅采用CBT/STT技术，检测即将再引燃后立即降流，从而抑制小桥爆炸飞溅。缓存中的交流频率、板厚和成形规则来自后续上下文，全部删除。
  source:
    context_cache: outputs/rule_extraction_full_20260829/cache/contexts/context_001435.json
    model_output_cache: outputs/rule_extraction_full_20260829/cache/model_outputs/context_001435
    prompt_id: rule_generator_routed__text__image
    prompt_version: base@6+text@2+image@4
  input:
    text: '上下文包编号: context_001435


      标题路径:

      第6章 熔化极氩弧焊 > 6.6 先进的MIG焊方法 > 6.6.6 交流短路过渡MIG/MAG焊


      核心正文:

      [unit_004421; type=passage; page=443]

      EN和EP半波都是由若干短路过渡周期组成的，为了确保短路过程无飞溅，这里采用了CBT焊接法（Controlled Bridge Transfer），如图6-117所示。可见该法采用了STT法技术，在得到电弧即将再引燃的信息后，立即减少电流，从而抑制了短路小桥爆炸所引起的飞溅。


      支撑内容:

      [unit_004423; type=passage; page=443]

      AC-CBT法还存在一个限制，如图6-118所示。图中的试验条件为平均电流80A，焊接速度 $0.5\mathrm{m / min}$ ，板厚 $1.0\mathrm{mm}$ 。交流频率分别为 $1.0\mathrm{Hz}$ 、
      $3.0\mathrm{Hz}$ 和 $5.0\mathrm{Hz}$ 时的焊道外观。交流频率较低时（如 $1\mathrm{Hz}$ )，熔深和焊道外观用目测就可以看出周期性的波纹变化。当提高交流频率时（如从 $1\mathrm{Hz}$
      调到 $3\mathrm{Hz}$ )，就可以改善焊缝成形。所以交流频率必须与焊接速度相适应，如图6-119所示。


      [unit_004425; type=passage; page=443]

      433


