      核心正文:

      [unit_000309; type=passage; page=27]

      依此类推，使带电粒子快速增加，这种在强电场作用下的电离具有连锁反应的性质，如图2-8所示。但是带电粒子的增加是有一定限度的。这是因为在电弧导电中，除了电离过程外，还同时存在着带电粒子消失的过程。


      支撑内容:

      [unit_000306; type=passage; page=27]

      可见，在相同条件下，电子的平均自由行程是离子的4倍，在电场作用下电


      [unit_000307; type=passage; page=27]

      子可获得4倍于离子的动能，又因电子质量比离子小得多，故它与中性粒子发生非弹性碰撞时可将全部动能转换为中性粒子的内能。如果电子的总能量超过中性粒子的电离能，则产生电离。因此，电场作用下的电离现象也主要是电子与中性粒子的非弹性碰撞引起的。


      [unit_000308; type=passage; page=27]

      在强电场作用下，电子受到电场的加速作用，与中性或受激励的粒子相撞，可以生成一个新的电子与正离子，然后这两个电子继续前进分别又与中性粒子碰撞，又可生成两个新的电子，


      资源文字化:

      [unit_000310; type=figure; page=27]

      题注: 图2-8 连锁反应电离过程示意图

      原始文字:

      图2-8 连锁反应电离过程示意图

