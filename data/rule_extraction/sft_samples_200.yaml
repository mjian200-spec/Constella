    text: "上下文包编号: context_000213\n\n标题路径:\n第3章 熔滴过渡与焊缝成形 > 3.2 熔滴过渡 > 3.2.3 熔化极气体保护焊的主要熔滴过渡形式\n\n包条件（已由上游确定作用域）:\n- [constraint_000251]\
      \ explicit_condition: 目视观察\n  来源 Unit: unit_001190\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_001190\"\
      , \"end_unit_id\": \"unit_001212\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_001190; type=passage;\
      \ page=104]\n  熔滴过渡形式，两者之间有着密切的对应关系，如图3-15所示。通常透过电焊玻璃在目视观察时，可以根据电弧形态判断熔滴过渡形式。如大滴过渡为束状电弧；射滴过渡为钟罩状电弧；射流过渡为锥状电弧。\n\n核心正文:\n\
      [unit_001195; type=passage; page=105]\n循，由于电流密度较小，斑点压力不大，所以对熔滴的排斥作用也不大。这时施加于熔滴上的主要作用力是重力和表面张力，只有当熔滴积聚成较大的液滴状的球滴之后，其表面张力再也不能维持它的重量时，熔滴便脱离焊丝而向熔池过渡（见图3-16），这时熔滴的尺寸主要决定于焊丝材料的性质，这一关系见式（3-13）和图3-11。\n\
      \n支撑内容:\n[unit_001186; type=title; page=104]\n3.2.3 熔化极气体保护焊的主要熔滴过渡形式\n\n资源文字化:\n[unit_001198; type=figure; page=105]\n\
      题注: b)  图3-16 大滴过渡形态\n原始文字:\nb)  图3-16 大滴过渡形态\n资源标题: 图3-16 大滴过渡形态\n资源描述: 该图包含左右两幅黑白照片，展示了大液滴的过渡形态。左图显示一个液滴附着在垂直表面或物体边缘，液滴主体呈亮白色，上方连接处较暗，背景为网格状纹理。右图显示液滴形态发生变化，液滴主体依然呈亮白色，但形状似乎更圆润或正在脱离，上方连接处依然可见，背景同样为网格状纹理。\n\
      \n[unit_001156; type=figure; page=102]\n题注: 图3-11 熔滴脱离之前焊丝端头熔滴的形状 $r / R$ 和焊丝材料性质 $\\frac{R^2\\rho g}{\\sigma}$ 的关系\n\
      原始文字:\n图3-11 熔滴脱离之前焊丝端头熔滴的形状 $r / R$ 和焊丝材料性质 $\\frac{R^2\\rho g}{\\sigma}$ 的关系\n资源标题: 图3-11 熔滴脱离之前焊丝端头熔滴的形状 r/R 和焊丝材料性质\
      \ R²ρg/σ 的关系\n资源描述: 该图为二维坐标图，展示了焊丝端头熔滴形状与材料性质的关系。横坐标为无量纲参数 (R²ρg/σ)，刻度从0到2.0，间隔0.4；纵坐标为半径比 r/R，刻度从0到3，间隔1。图中包含一条从左上方向右下方延伸的实线曲线，表示\
      \ r/R 随 (R²ρg/σ) 增大而减小。图中还绘制了四个不同形状的焊丝端头熔滴示意图，从左至右依次排列，对应横坐标逐渐增大的情况。最左侧的熔滴最大，标注了焊丝直径 2R 和熔滴最大半径 2r。随着横坐标数值增加，熔滴形状逐渐变细、变短，且与焊丝连接处的颈部变细。虚线箭头指示了熔滴形状随横坐标变化的趋势。\n\
      \n[unit_001149; type=formula; page=101]\n题注: \n原始文字:\n$$\\frac {r}{R} = \\sqrt [ 3 ]{\\frac {3}{2} \\times \\frac {\\\
      sigma}{\\rho g R ^ {2}}} \\tag {3-13}$$\n公式摘要: 熔滴尺寸（r）与焊丝半径（R）的比值等于（3/2乘以表面张力系数σ除以密度ρ、重力加速度g和焊丝半径R平方的乘积）的立方根\n符号释义:\
      \ [{\"symbol\": \"r\", \"meaning\": \"熔滴尺寸\", \"unit\": null, \"evidence_unit_ids\": [\"unit_001152\", \"unit_001195\"\
      ]}, {\"symbol\": \"R\", \"meaning\": \"焊丝半径\", \"unit\": null, \"evidence_unit_ids\": [\"unit_001152\"]}, {\"symbol\"\
      : \"σ\", \"meaning\": \"表面张力系数\", \"unit\": null, \"evidence_unit_ids\": [\"unit_001152\"]}, {\"symbol\": \"ρ\", \"\
      meaning\": \"密度\", \"unit\": null, \"evidence_unit_ids\": [\"unit_001152\"]}, {\"symbol\": \"g\", \"meaning\": null,\
      \ \"unit\": null, \"evidence_unit_ids\": []}]"
