      核心正文:

      [unit_000437; type=passage; page=36]

      只有满足式（2-23）的条件，A粒子才能与B粒子复合。如果A粒子的动能大于 $\frac{e^2}{r}$，但A粒子能与C粒子发生碰撞，并将大部分动能传给C粒子（见图2-11）。而剩下的动能小于 $\frac{e^2}{r}$ 时，A粒子与B粒子也可产生复合。在电弧中心部分由于温度较高，所有粒子的热运动能量很高，不可能产生复合。在电弧周边由于粒子的温度较低，动能较小，由于扩散作用而存在一部分电子或负离子，如果这里有正离子扩散出来，就可能产生正、负离子的复合过程。交流电弧时，电流过零的瞬时电弧熄灭，电弧空间温度显著降低，也将大量产生正、负离子的复合。有时引起电弧再引燃的困难，就是因为在熄灭瞬间带电粒子的相互复合而使电弧空间丧失带电粒子所致。电子与正离子的复合过程，将以辐射和热能的形式释放出能量，其数量相当于电离能和原有的动能。


