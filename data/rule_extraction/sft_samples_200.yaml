      start_unit_id\": \"unit_004277\", \"end_unit_id\": \"unit_004337\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n\
      \  [unit_004277; type=passage; page=429]\n  （1）焊缝表面美观 铝合金是具有装饰性的金属材料，在有些场合要求焊缝表面要美观。虽然用低频脉冲TIG焊可以得到漂亮的鱼鳞状焊缝外观，但其生产效率低，往往难于满足大规模生产的要求。使用低频调制型脉冲MIG焊接方法，根据焊接速度调整低频调制频率，在得到漂亮鱼鳞状焊缝外观的同时，能保证较高的焊接生产率。图6-96所示是焊接速度为\
      \ $69\\mathrm{cm / min}$ 、平均焊接电流为110A、平均电弧电压为19V时的焊缝外观随低频调制频率的变化情况，在该焊接条件下，低频调制频率低于1Hz时焊缝表面波纹间隔过大，高于8Hz时波纹间隔过小，在2~6Hz范围内焊缝外观最漂亮，为了得到漂亮的焊缝外观，应主要根据焊接速度来选择低频调制脉冲的频率。焊接速度越高，设定的低频调制脉冲频率也应该越高。\n\
      - [constraint_000944] 间隙: 焊件间隙达 $3\\mathrm{mm}$\n  来源 Unit: unit_004284\n  作用域: {\"scope_type\": \"unit_range\", \"\
      start_unit_id\": \"unit_004284\", \"end_unit_id\": \"unit_004340\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n\
      \  [unit_004284; type=passage; page=429]\n  图6-97所示是低频调制型脉冲MIG焊接的焊缝断面形状。平均焊接电流90A，平均电弧电压 $18\\mathrm{V}$ ，焊接速度 $40\\\
      mathrm{cm / min}$ 。在焊件间隙达 $3\\mathrm{mm}$ 时仍能正常焊接，且焊缝断面形状能满足要求。\n- [constraint_000945] explicit_condition: 焊接铸铝焊件\n\
      \  来源 Unit: unit_004285\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_004285\", \"end_unit_id\"\
      : \"unit_004340\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_004285; type=passage; page=429]\n  （3）减少气孔发生率\
      \ 气孔是铝合金焊接时常见的质量问题之一，特别是在焊接铸铝焊件时显得更加突出。为了防止气孔的产生，一般要求保护气体纯度\n- [constraint_000953] 频率: $30\\mathrm{Hz}$ 时裂纹敏感性又呈增长趋势\n\
      \  来源 Unit: unit_004301\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_004301\", \"end_unit_id\"\
      : \"unit_004340\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_004301; type=passage; page=431]\n  裂纹敏感性和平均晶粒尺寸与低频调制频率的关系如图6-99所示。一般脉冲MIG焊接的平均晶粒尺寸较大，易产生凝固裂纹，裂纹敏感性高达\
      \ $70\\%$ 左右。采用低频调制型脉冲MIG焊接时，裂纹敏感性明显降低。虽然低频调制频率高于 $30\\mathrm{Hz}$ 时裂纹敏感性又呈增长趋势，但是仍然低于一般脉冲MIG焊接。在固液共存领域，晶粒细化能分散晶界变形，所以晶粒越细，裂纹敏感性越低，裂纹敏感性与平均晶粒尺寸的变化相一致。\n\
      - [constraint_000955] 送丝速度: $(8\\pm 2)\\mathrm{m / min}$ （即 $v_{\\mathr\n  来源 Unit: unit_004307\n  作用域: {\"scope_type\"\
      : \"unit_range\", \"start_unit_id\": \"unit_004307\", \"end_unit_id\": \"unit_004340\", \"target_unit_ids\": [], \"\
      candidate_ranges\": []}\n  [unit_004307; type=passage; page=431]\n  这种脉动送丝的焊机，首先根据工件厚度选择平均送丝速度和送丝脉动幅值。如平均送丝速度为 $8\\\
      mathrm{m / min}$ ，脉冲幅值为 $2\\mathrm{m / min}$ ，则可表示为送丝速度为 $(8\\pm 2)\\mathrm{m / min}$ （即 $v_{\\mathrm{max}} = 10\\mathrm{m\
      \ / min}$ 和 $v_{\\mathrm{min}} = 6\\mathrm{m / min})$ 。\n- [constraint_000956] 厚度: $1\\sim 5\\mathrm{mm}$ 的薄铝工件\n  来源\
      \ Unit: unit_004308\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_004308\", \"end_unit_id\": \"\
      unit_004340\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_004308; type=passage; page=431]\n  对于厚度为\
      \ $1\\sim 5\\mathrm{mm}$ 的薄铝工件，高频率 $f_{\\mathrm{H}} = 50\\sim 250\\mathrm{Hz}$ ，低频脉冲频率 $f_{\\mathrm{L}} = 0.1\\sim 3\\\
      mathrm{Hz}_{\\circ}$\n- [constraint_000960] 电流: 总电流值\n  来源 Unit: unit_004314\n  作用域: {\"scope_type\": \"unit_range\"\
      , \"start_unit_id\": \"unit_004314\", \"end_unit_id\": \"unit_004340\", \"target_unit_ids\": [], \"candidate_ranges\"\
      : []}\n  [unit_004314; type=passage; page=432]\n  （2）等速送丝方式 日本OTC公司采用这种方式。因为送丝速度不变，而脉冲电流是改变的。总的平均脉冲电流应该与送丝速度平衡，但在强脉冲电流时，其平均电流大于总平均值，所以此时弧长必然提高，则电压逐渐变大（见图6-101）；相反在弱脉冲电流时，其平均电流小于总电流值，所以此时弧长变短，则电压又有减小的趋势。可见这时送丝速度不变，而焊丝熔化速度却按电流强弱的频率而变化。弱脉冲电流时随着时间的延续，电压和弧长略降低，按弧长调节的规则必然增加电流频率，也就是提高平均电流和焊丝熔化速度，则弧长有增大趋势，从而起到调节弧长的作用。为了确保焊接过程稳定，强弱脉冲不要变化太大，通常两者的峰值电流变化不超过\
      \ $10\\%$ 。从上述的分析可以理解为什么变速送丝方式的焊接过程更容易稳定。\n\n核心正文:\n[unit_004327; type=passage; page=433]\n2）低频参数： $f_{\\mathrm{L}}$\
      \ 、 $T_{\\mathrm{s}}$ 、 $T_{\\mathrm{w}}$ 。根据PTIG焊的 $f = 0.5 \\sim 10\\mathrm{Hz}$ ，选 $f_{\\mathrm{L}} = 3 \\sim 5\\\
      mathrm{Hz}$ 选脉宽比为 $50\\%$ ，即 $T_{\\mathrm{s}} = T_{\\mathrm{w}}$ ，脉冲周期 $T = T_{\\mathrm{s}} + T_{\\mathrm{w}} = 1 /\
      \ 3 \\sim 1 / 5 = 0.2 \\sim 0.33\\mathrm{s}$ 则 $T_{\\mathrm{s}} = T_{\\mathrm{w}} = 0.1 \\sim 0.16\\mathrm{s}$3）求焊接速度\
      \ $v_{\\mathrm{w}}$ 。经验公式 $w = \\frac{v_{\\mathrm{w}}}{60f_{\\mathrm{L}}}$\n\n资源文字化:\n[unit_004328; type=formula; page=433]\n\
      题注: \n原始文字:\n$$v _ {\\mathrm {w}} = w \\times f _ {\\mathrm {L}} \\times 6 0$$\n公式摘要: 焊接速度 $v_{\\mathrm{w}}$ 等于 $w$\
      \ 乘以低频参数 $f_{\\mathrm{L}}$ 再乘以 60\n符号释义: [{\"symbol\": \"v_{\\\\mathrm{w}}\", \"meaning\": \"焊接速度\", \"unit\": null,\
      \ \"evidence_unit_ids\": [\"unit_004327\"]}, {\"symbol\": \"w\", \"meaning\": null, \"unit\": null, \"evidence_unit_ids\"\
      : []}, {\"symbol\": \"f_{\\\\mathrm{L}}\", \"meaning\": \"低频参数\", \"unit\": \"Hz\", \"evidence_unit_ids\": [\"unit_004327\"\
      ]}, {\"symbol\": \"60\", \"meaning\": null, \"unit\": null, \"evidence_unit_ids\": []}]"
  output: '规则组1

    C: 焊接方法|铝合金双脉冲MIG焊

    R: 低频调制频率f_L|3~5Hz —[$T=1/f_L$]→ 脉冲周期T|0.2~0.33s

    R: 脉宽比|50% —[使]→ 通电时间与断弧时间关系|T_s=T_w

    R: 低频调制频率f_L|3~5Hz + 脉宽比|50% —[对应]→ 通电时间T_s|0.1~0.16s

    R: 低频调制频率f_L|3~5Hz + 脉宽比|50% —[对应]→ 断弧时间T_w|0.1~0.16s

    R: 焊缝间距w|数值 + 低频调制频率f_L|数值 —[$v_w=60wf_L$]→ 焊接速度v_w|计算值'
