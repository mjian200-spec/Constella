      最小电压原理是电弧的一种特性，用以表征电弧的最小能量消耗的特性。焊接电弧通常是自由电弧，其截面积可以自由变大或缩小，但是当给定电流与边界条件一定的情况下，电弧稳定燃烧时，其弧柱半径（ $R$ ）或温度（ $T$ ）应使弧柱电场强度（\
      \ $E$ ）具有最小的数值。即\n\n[unit_000803; type=passage; page=70]\n这就是最小电压原理。\n\n资源文字化:\n[unit_000802; type=formula; page=70]\n\
      题注: \n原始文字:\n$$\\frac {\\partial E}{\\partial R} = 0 \\quad \\text {或} \\quad \\frac {\\partial E}{\\partial T} = 0\
      \ \\tag {2-40}$$\n公式摘要: 在给定电流与边界条件一定的情况下，电弧稳定燃烧时，其弧柱半径（R）或温度（T）应使弧柱电场强度（E）具有最小的数值。\n符号释义: [{\"symbol\": \"E\", \"meaning\"\
      : \"弧柱电场强度\", \"unit\": null, \"evidence_unit_ids\": [\"unit_000801\"]}, {\"symbol\": \"R\", \"meaning\": \"弧柱半径\",\
      \ \"unit\": null, \"evidence_unit_ids\": [\"unit_000801\"]}, {\"symbol\": \"T\", \"meaning\": \"温度\", \"unit\": null,\
      \ \"evidence_unit_ids\": [\"unit_000801\"]}]"
