- id: context_001642
  route: text
  difficulty_tags:
  - 初期用气
  - 混合气体
  - 越界内容删除
  construction_rationale: 核心正文只讨论气体保护焊从单一气体发展到混合气体。氩、氦、氢、CO2是初期单一气体的示例，可作为一个列举状态；少量其他气体加入后性能更好，并扩大保护气体选择空间，保留相邻链。缓存初稿中的TIG烧损、母材和厚度规则均无本包证据，全部删除。
  source:
    context_cache: outputs/rule_extraction_full_20260829/cache/contexts/context_001642.json
    model_output_cache: outputs/rule_extraction_full_20260829/cache/model_outputs/context_001642
    prompt_id: rule_generator_routed__text
    prompt_version: base@6+text@2
  input:
    text: '上下文包编号: context_001642


      标题路径:

      第2章 焊接电弧 > 2.5 焊接用保护气体 > 2.5.4 焊接方法与保护气体的选择


      核心正文:

      [unit_000893; type=passage; page=79]

      气体保护焊应用初期主要使用单一气体，如氩、氦、氢和 $\mathrm{CO}_{2}$ 气等。后来，人们发现在这些气体中掺入少量的其他气体的混合气体具有更好的性能，这就为选择保护气体提供了更为广泛的空间。


      支撑内容:

      [unit_000891; type=passage; page=79]

      近年来又出现了使用四元混合气体的TIME（Transferred Ionized Molten Energy）焊，它是一种高性能MAG焊，气体成分（体积分数）为 $\mathrm{Ar}65\% +\mathrm{He}26.5\%$
      $+ \mathrm { C O } _ { 2 } 8 \% + \mathrm { O } _ { 2 } 0 . 5 \%$ 。这种方法采用 $\phi 1.2\mathrm{mm}$ 焊丝，焊丝伸出长度为 $25\sim 35\mathrm{mm}$
      最大送丝速度达到 $28\sim 50\mathrm{m / min}$ 。可见，此方法是一种高熔敷效率的焊接方法，最大可达到 $450\mathrm{g / min}$ 。而 $\mathrm{CO}_{2}$ 用 $\phi 1.6\mathrm{mm}$
      焊丝的最大送丝速度为 $16\mathrm{m / min}$ 时，其熔敷速度也仅为 $144\mathrm{g / min}$ 。TIME焊的关键是当快速送丝（焊接电流达700A左右）时熔滴过渡呈稳定的旋转喷射过渡，焊丝的“铅笔尖”端头以焊丝为轴心进行旋转，焊接过程十分稳定，没有飞溅，焊缝成形良好，这时再也看不到通常大电流MIG焊时旋转射流过渡的飞溅四射现象。


      [unit_000892; type=title; page=79]

      2.5.4 焊接方法与保护气体的选择


      [unit_000894; type=passage; page=79]

      选择保护气体要根据母材的材质和焊件的厚度以及焊接方法来选择。母材金属在电弧的高温作用下，将与保护气体发生不同的冶金反应；焊件厚度对电弧功率也有不同的要求；焊接方法对保护气体也有选择，如TIG焊不宜用氧化性气体，以防钨极烧损，它只能选择惰性气体。这些就是选择保护气体的依据，同时还要考虑到焊接质量、焊接生产率和降低成本等因素。实际应用中保护气体的种类及应用特点见表2-18。'
  output: '规则组1

    C: 焊接方法|气体保护焊

    R: 保护气体类型|氩、氦、氢、CO2等单一气体 —[对应]→ 应用阶段|初期

    R: 单一保护气体|掺入少量其他气体 —[形成]→ 保护气体类型|混合气体

    R: 保护气体类型|混合气体 —[获得]→ 保护气体性能|更好

    R: 混合气体|性能更好 —[扩大]→ 保护气体选择空间|更广泛'
