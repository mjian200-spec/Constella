    text: "上下文包编号: context_000718\n\n标题路径:\n第6章 熔化极氩弧焊 > 6.4 脉冲MIG/MAG焊 > 6.4.5 脉冲MIG/MAG焊的应用\n\n包条件（已由上游确定作用域）:\n- [constraint_000847]\
      \ 厚度: $1.6\\mathrm{mm}$ 的铝板和 $1\\mathrm{mm}$ 的钢板\n  来源 Unit: unit_003645\n  作用域: {\"scope_type\": \"unit_range\", \"\
      start_unit_id\": \"unit_003645\", \"end_unit_id\": \"unit_003669\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n\
      \  [unit_003645; type=passage; page=345]\n  用连续电流射流过渡氩弧焊焊接厚度小于 $4.5\\mathrm{mm}$ 的铝板及厚度小于 $2\\mathrm{mm}$ 的钢板已经很困难了。可是用熔化极脉冲氩弧焊可以焊接更薄的焊件，能成功地焊接厚度为\
      \ $1.6\\mathrm{mm}$ 的铝板和 $1\\mathrm{mm}$ 的钢板。\n- [constraint_000848] 电流: 较小的平均电流\n  来源 Unit: unit_003646\n  作用域: {\"\
      scope_type\": \"unit_range\", \"start_unit_id\": \"unit_003646\", \"end_unit_id\": \"unit_003670\", \"target_unit_ids\"\
      : [], \"candidate_ranges\": []}\n  [unit_003646; type=passage; page=345]\n  脉冲焊可以扩大同种直径焊丝焊接电流的使用范围。熔化极脉冲氩弧焊的下限电流范围可以比普通熔化极氩弧焊的临界电流降低1/3左右，如图6-33所示。可以看出，脉冲焊在较小的平均电流时仍能稳定工作，有利于薄板焊接。\n\
      - [constraint_000849] 材料: $12\\mathrm{Cr1MoV}$ 的钢管\n  来源 Unit: unit_003654\n  作用域: {\"scope_type\": \"unit_range\",\
      \ \"start_unit_id\": \"unit_003654\", \"end_unit_id\": \"unit_003670\", \"target_unit_ids\": [], \"candidate_ranges\"\
      : []}\n  [unit_003654; type=passage; page=346]\n  制。而熔化极脉冲氩弧焊可以满意地进行全位置焊接。现已成功地用于电站锅炉主蒸气管道的现场安装焊接。如管径为 $\\phi 750\\\
      mathrm{mm}$ ，管壁厚 $\\delta = 30\\sim 35\\mathrm{mm}$ ，材料为 $12\\mathrm{Cr1MoV}$ 的钢管，用 $\\phi 1.0\\mathrm{mm}$ 的 $08\\\
      mathrm{Mn}2\\mathrm{SiMoV}$ 焊丝， $\\mathrm{Ar + }$ $\\mathrm{O}_21\\%$ （体积分数）混合气体保护熔化极脉冲氩弧焊，进行全位置焊接取得了满意的结果。接头的坡口形式如图6-34所示。所用的焊接参数见表6-9。\n\
      \n核心正文:\n[unit_003660; type=passage; page=346]\n侧壁打火，破坏焊接过程的稳定性。用短路过渡进行焊接又容易形成夹渣及熔合不良。大电流射流过渡焊接时，增加成形系数容易产生裂纹，且由于热输入过大而使焊缝金属综合性能不满足要求。而采用脉冲氩弧焊取得了满意的结果。如焊接壁厚为\
      \ $30 \\sim 50\\mathrm{mm}$ 的锅炉联箱，坡口宽度为 $10 \\sim 12\\mathrm{mm}$ 的窄间隙（见图6-35）。用 $\\phi 3\\mathrm{mm}$ 直径焊丝，所用的焊接参数见表6-10。\n\
      \n支撑内容:\n[unit_003642; type=title; page=345]\n6.4.5 脉冲MIG/MAG焊的应用\n\n资源文字化:\n[unit_003662; type=figure; page=346]\n\
