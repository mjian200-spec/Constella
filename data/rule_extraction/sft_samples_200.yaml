      \ 电压: $4.3\\mathrm{V}$\n  来源 Unit: unit_000263\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_000263\"\
      , \"end_unit_id\": \"unit_000487\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000263; type=passage;\
      \ page=24]\n  萨哈公式是单一气体热电离度的表达式，如果某气体中混有其他成分时，各种气体电离程度不一样，此时电子密度与电离前中性粒子密度的比例称为实效电离度。混合气体的电离电压称为实效电离电压。利用萨哈公式求实效电离度时需代入实效电离电压。理论与实际都证明混合气体的实效电离电压主要决定于电离电压较低的气体成分，即使这种气体占有较小的比例。例如铁蒸气中混有钾蒸气时，其实效电离电压与混入的钾蒸气的比例关系如图2-5所示。铁蒸气电离电压为\
      \ $7.9\\mathrm{V}$ ，而钾蒸气的电离电压为 $4.3\\mathrm{V}$ 。当钾蒸气质量分数超过 $5\\%$ 时，则实效电离电压显著下降而接近钾的电离电压。因此，电弧焊时为了提高电弧的稳定性，在电弧气氛中只需要加入少量的低电离电压物质即可取得显著的效果。\n\
      - [constraint_000060] 温度: 温度很低\n  来源 Unit: unit_000389\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"\
      unit_000389\", \"end_unit_id\": \"unit_000487\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000389;\
      \ type=passage; page=33]\n  比较式(2-16)与式(2-17)可以看到，电场的存在相当于使电极材料的逸出功降低 $U_{\\mathrm{w}}^{\\prime} = U_{\\mathrm{w}} -\
      \ \\sqrt{eE / \\pi\\varepsilon_{0}}$ 。当温度很低时，甚至是 $0^{\\circ}\\mathrm{C}(T = 273\\mathrm{K})$ ，如果存在足够强的电场强度，也可以从电极发射足够数量的电子流密度以供电弧导电的需要。\n\
      - [constraint_000070] 弧长: 电弧长度变化\n  来源 Unit: unit_000440\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
      : \"unit_000440\", \"end_unit_id\": \"unit_000487\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000440;\
      \ type=passage; page=36]\n  压降。阴极附近的区域为阴极区，其电压称为阴极电压降。中间部分为弧柱区，其电压称为弧柱电压降。阳极区和阴极区在电弧长度方向的尺寸都很小，约为 $10^{-4}$ 和 $10^{-6}\\\
      mathrm{cm}$ 。在电弧长度变化时几乎不发生变化，但电压降值很高，在电弧总体电压降中占有相当大的比例，所以电场强度很高。而弧柱区的长度几乎等于电弧总长度，电压降沿弧长方向呈线性变化，其电场强度较低。之所以如此，是由于这些区域导电机构不同所决定的，电弧电压\
      \ $U_{\\mathrm{a}}$ 是上述各电压降之和。即\n- [constraint_000078] 材料: 电极材料的熔点较高或逸出功较小\n  来源 Unit: unit_000471\n  作用域: {\"scope_type\"\
      : \"unit_range\", \"start_unit_id\": \"unit_000471\", \"end_unit_id\": \"unit_000487\", \"target_unit_ids\": [], \"\
      candidate_ranges\": []}\n  [unit_000471; type=passage; page=40]\n  通过上述三方面作用，阴极区进行自我调节，直到阴极区所提供的电子流与弧柱需要的电子流一致，则达到平衡。在小电流钨极氩弧焊和熔化极气体保护焊时，这种阴极导电机构起着重要作用。用\
      \ $\\mathrm{Cu}$ 、Fe、Al材料作阴极材料焊接时（这种阴极也称冷阴极），实际上（1）和（2）两种阴极导电机构是并存的，而且互相补充和自动调节，阴极压降区的电压值因具体条件的不同而变化，一般在几伏到十几伏之间波动，这主要决定于电极材料的种类、电流大小和气体介质的成分。当电极材料的熔点较高或逸出功较小时，则热发射的比例较大，阴极压降较小；反之则电场发射的比例增大，阴极压降也较大。当电流较大时，一般热发射的比例增大，阴极压降将减小。\n\
      - [constraint_000084] 焊接电流: 焊接电流较小\n  来源 Unit: unit_000481\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
      : \"unit_000481\", \"end_unit_id\": \"unit_000487\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000481;\
      \ type=passage; page=41]\n  值一般较大， $U_{\\mathrm{A}} > U_{\\mathrm{i}}$ （ $U_{\\mathrm{i}}$ 为气体介质的电离电压），阳极区的长度约为 $10^{-3}\
      \ \\sim 10^{-2}\\mathrm{cm}$ 。当焊接电流较小时，阳极区的导电常常属于这种机构。\n- [constraint_000085] 电流: 电流密度增加到一定程度\n  来源 Unit: unit_000482\n\
      \  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_000482\", \"end_unit_id\": \"unit_000487\", \"target_unit_ids\"\
      : [], \"candidate_ranges\": []}\n  [unit_000482; type=passage; page=41]\n  （2）阳极区的热电离 当电流密度较大，阳极温度很高，甚至使阳极材料发生蒸发，靠近阳极前面的空间也被加热到很高的温度。当电流密度增加到一定程度时，聚集在这里的金属蒸气将发生热电离，通过这种热电离生成正离子供弧柱需要，生成的电子奔向阳极。由于在这里是靠热电离生成的正离子，不再需要\
      \ $U_{\\mathrm{A}}$ 来增加电子动能以产生碰撞电离，所以 $U_{\\mathrm{A}}$ 可以较低。随着电流密度的增加，\n\n核心正文:\n[unit_000485; type=passage; page=42]\n\
      阳极区热量继续增加，当弧柱所需要的0.001I的正离子流完全由这种阳极区热电离来提供时，则 $U_{\\mathrm{A}}$ 可以降到零，从图2-16可以看出 $U_{\\mathrm{A}}$ 与阳极前面弧柱温度的关系。\n\n\
      支撑内容:\n[unit_000193; type=title; page=18]\n2.1.2 带电粒子的产生和消失\n\n资源文字化:\n[unit_000487; type=figure; page=42]\n题注: 图2-16\
      \ 阳极前面弧柱温度与阳极压降的关系\n原始文字:\n图2-16 阳极前面弧柱温度与阳极压降的关系\n资源标题: 图2-16 阳极前面弧柱温度与阳极压降的关系\n资源描述: 该图为二维直角坐标系折线图。纵轴表示阳极压降 $U_A$，单位为伏特（V），刻度范围从0到5，间隔为1。横轴表示温度\
      \ $T$，单位为 $\\times 10^3 K$，刻度范围从15到20，间隔为1。图中包含一条从左上方向右下方倾斜的直线，显示 $U_A$ 随 $T$ 的增加而线性减小。直线起点位于横坐标约16.5、纵坐标约4.8处，终点位于横坐标约20.2、纵坐标约0.2处。图表右上角标注有实验条件文本：“电流100~500A”和“保护气体\
      \ Ar”。"
