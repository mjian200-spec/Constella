      。


      [unit_002532; type=passage; page=228]

      焊接用 $\mathrm{CO}_{2}$ 气体以液态形式储存于气瓶中供用户使用。气瓶涂银白色，写有“ $\mathrm{CO}_{2}$ ”标记。气瓶中 $\mathrm{CO}_{2}$ 的数量只能用称重法测定，而不能用气瓶内的压力来测定。气瓶内气体压力的大小不代表瓶中液态
