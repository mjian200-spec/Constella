      资源标题: 表 2-9 各种弧焊方法的有效功率因数 $\\lambda$ \n资源描述: 表格列出了不同弧焊方法对应有效功率因数 $\\lambda$ 的数值范围。表头分为左右两组，每组包含“弧焊方法”和“$\\lambda$”两列。左侧数据包括：焊条电弧焊（0.65~0.85）、埋弧焊（0.80~0.90）、CO2气体保护焊（0.75~0.90）。右侧数据包括：熔化极氩弧焊(MIG)（0.70~0.80）、钨极氩弧焊(TIG)（0.65~0.70）。"
