      caption: 图2-16 阳极前面弧柱温度与阳极压降的关系
      path: /CODE/jm/Constella/GMAW/hybrid_ocr/images/0dd055f307329b81c620715928ddc8dc9e896680b3fdfaf12289f14d43751e74.jpg
