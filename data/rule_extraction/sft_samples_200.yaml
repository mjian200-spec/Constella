  construction_rationale: 常压焊接电弧是闭合事实的共同场景。电子作为主要载流粒子、维持正常导电所需电子密度、满足小电流导电所需实效电离度分别抽取；“一万个中性粒子中一个被电离”是10^-4数量级的等价解释。末尾强迫冷却等内容被截断，不补写趋势。
  source:
