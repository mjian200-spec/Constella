      \ 左右，而电弧电压为 $20\\sim$ $21\\mathrm{V}$ ，则 $\\lambda = \\frac{18}{21} = 0.86$ 。 $\\mathrm{CO}_{2}$ 气体保护焊中等参数焊接时，电弧长度大，电弧电压数值较高，若焊丝不插入熔池则电弧的有效功率因数有所下降。\n\
      - [constraint_000096] 材料: 阴极和阳极时的温度数据\n  来源 Unit: unit_000554\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
