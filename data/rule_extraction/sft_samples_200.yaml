    text: "上下文包编号: context_000217\n\n标题路径:\n第3章 熔滴过渡与焊缝成形 > 3.2 熔滴过渡 > 3.2.3 熔化极气体保护焊的主要熔滴过渡形式\n\n包条件（已由上游确定作用域）:\n- [constraint_000252]\
      \ explicit_condition: $\\mathrm{CO}_{2}$ 焊焊接钢及MIG焊焊接纯铝\n  来源 Unit: unit_001206\n  作用域: {\"scope_type\": \"unit_range\"\
      , \"start_unit_id\": \"unit_001206\", \"end_unit_id\": \"unit_001232\", \"target_unit_ids\": [], \"candidate_ranges\"\
      : []}\n  [unit_001206; type=passage; page=106]\n  态可以分为两种形式，其中图3-18a为再引燃电弧型，图3-18b为引渡电弧型。前者当熔滴脱落之前，电弧烁亮区上爬到熔滴的上部，烁亮区距再引燃电弧点很近，所以当熔滴一分离，电弧烁亮区立即由熔滴上表面跳到焊丝端头的新的表面上，从而使电弧重又稳定燃烧。这时电弧再引燃较容易，所以电弧电压上跳值比较小，一般在5V以下，通常MAG焊焊钢和MIG焊焊铝合金时常为此种过渡形式。后者当熔滴脱落瞬间，产生一个与原有电弧相串联的电弧，这两个电弧同时存在时间极短，产生后随即将原有电弧由熔滴底部“引渡”到熔滴上部，两个串联电弧合并为一个电弧，因此称之为引渡电弧型。引渡电弧产生的瞬间出现较大的电弧电压上跳和焊接电流下跳。电压上跳值达15V以上，同时伴随较大的爆破力，该力甚至可以将球状熔滴冲击成扁平状和造成飞溅。通常在\
      \ $\\mathrm{CO}_{2}$ 焊焊接钢及MIG焊焊接纯铝时经常发生此种过渡。\n\n核心正文:\n[unit_001211; type=passage; page=106]\n从图3-17可以清楚地看到，射滴过渡时电弧的弧根总是包围着熔滴的大部或全部表面，电弧成钟罩形。电弧形态改变了，则作用在熔滴上的力也发生变化。这时作用在熔滴上的力的特点是，通过熔滴的电流将产生促使熔滴过渡的轴向推力，即电磁收缩力\
      \ $F_{\\mathrm{e}}$ 和由于钟罩形电弧形态将产生等离子流力 $F_{\\mathrm{pl}}$ 。同时由于弧根面积较大，斑点压力的方向改变了，由大滴过渡时的阻力变为射滴过渡时\n\n支撑内容:\n[unit_001186;\
      \ type=title; page=104]\n3.2.3 熔化极气体保护焊的主要熔滴过渡形式\n\n资源文字化:\n[unit_001203; type=figure; page=105]\n题注: 图3-17 射滴过渡的典型目视形态\n\
