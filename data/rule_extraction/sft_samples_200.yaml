  construction_rationale: 接触过渡先按熔滴接触熔池表面的行为定义，再以液体金属小桥是否通电作为分类依据。短路过渡和搭桥过渡互斥，分别用通电与不通电两条R表达，不使用加号或含“或”的状态。章节范围足以限定熔滴过渡，无需额外制造过程入口规则。
  source:
