- id: context_001680
  route: text
  difficulty_tags:
  - 材料表面
  - 因果链
  - 多属性影响
  construction_rationale: 一般关系中，焊丝材料和表面状态是两个独立影响源。具体活化涂层场景下，Ca、Cs等元素使逸出功降低，继而对应更低的阴极压降并使阴极产热下降；按原文顺序保留因果链，不把所有结果压成一个宽泛状态。
  source:
    context_cache: outputs/rule_extraction_full_20260829/cache/contexts/context_001680.json
    model_output_cache: outputs/rule_extraction_full_20260829/cache/model_outputs/context_001680
    prompt_id: rule_generator_routed__text
    prompt_version: base@6+text@2
  input:
    text: '上下文包编号: context_001680


      标题路径:

      第3章 熔滴过渡与焊缝成形 > 3.1 焊丝的加热和熔化特性


      核心正文:

      [unit_001070; type=passage; page=95]

      焊丝材料及焊丝表面状态对阴极压降和逸出功的影响很大。如果焊丝表面涂有活化物质，如 $\mathrm{Ca}$ 、Cs等元素，这时逸出功较低，而阴极压降更低，因此阴极产热也下降。


      支撑内容:

      [unit_001069; type=passage; page=95]

      可见，阳极区与阴极区的产热主要决定于阴极压降和电极材料的逸出功。阳极区的产热比较单纯，而阴极区却十分复杂，因为阴极压降受外界影响很大，所以阴极区产热也变化很大。一般情况下对于熔化极气体保护焊来说， $U_{\mathrm{C}} >>
      U_{\mathrm{W}}$ ，则阴极产热总是大于阳极产热，所以阴极的熔化速度总是大于阳极的熔化速度。


      [unit_001071; type=passage; page=95]

      除了电弧热以外，焊丝伸出长度部分的电阻热的影响也很大。所谓焊丝伸出长度是指从焊丝与导电嘴的接触点到电弧端头的这段焊丝的长度（见图3-6）。细丝气体保护焊焊接时，焊丝伸出长度部分通过较大的电流，并产生较大的电阻热，其值可用下式计算：'
  output: '规则组1

    C: 无

    R: 焊丝材料|变化 —[影响]→ 阴极压降|变化

    R: 焊丝材料|变化 —[影响]→ 逸出功|变化

    R: 焊丝表面状态|变化 —[影响]→ 阴极压降|变化

    R: 焊丝表面状态|变化 —[影响]→ 逸出功|变化

    规则组2

    C: 焊丝表面|涂有Ca、Cs等活化物质

    R: 活化物质涂层|存在 —[使]→ 逸出功|较低

    R: 逸出功|较低 —[对应]→ 阴极压降|更低

    R: 阴极压降|更低 —[使]→ 阴极产热|下降'
- id: context_001684
  route: text
  difficulty_tags:
  - 公式定义
  - 单位绑定
  - 越界控制
  construction_rationale: 核心只完成熔化系数的定义和单位说明，输入端应列出公式变量，公式置于箭头，输出为αm。单位另作属性关系，避免把g/A·min当成裸对象。支撑段虽然解释物理意义和后续影响，但本样本聚焦当前核心，不扩展到后续材料实例。
  source:
    context_cache: outputs/rule_extraction_full_20260829/cache/contexts/context_001684.json
    model_output_cache: outputs/rule_extraction_full_20260829/cache/model_outputs/context_001684
    prompt_id: rule_generator_routed__text
    prompt_version: base@6+text@2
  input:
    text: '上下文包编号: context_001684


      标题路径:

      第3章 熔滴过渡与焊缝成形 > 3.1 焊丝的加热和熔化特性


      核心正文:

      [unit_001103; type=passage; page=97]

      令 $\frac{U_{\mathrm{m}} + I_{\mathrm{a}}R_{\mathrm{s}}}{(cT_{\mathrm{f}} + H)J} = \alpha_{\mathrm{m}}$ ， $\alpha_{\mathrm{m}}$
      称为熔化系数（ $\mathrm{g / A}\cdot \mathrm{min})$ 。


      支撑内容:

      [unit_001102; type=passage; page=97]

      式中 $J$ ——热功当量， $J = 4.2\mathrm{J / cal}$ 。


      [unit_001104; type=passage; page=97]

      熔化系数的意义是单位时间内通过单位电流时熔化焊丝金属的重量。该值与焊接材料、焊接电流极性及焊接参数有关。下面以铝合金氩弧焊为例，焊丝为正极时， $U_{\mathrm{A}}$ 近似为0，则 $U_{\mathrm{m}} \approx
      U_{\mathrm{w}}$ ，又因铝的电阻率较小，所以焊丝伸出长度部分的电阻热可忽略不计。总之，从式（3-10）可见，这时熔化系数只决定于材料，而不受焊接电流的影响，可视为常数。因此可以认为，焊丝的熔化速度正比于焊接电流，如图3-3所示。可是熔化系数
      $\alpha_{\mathrm{m}}$ 还受熔滴含热量（即温度 $T_{\mathrm{f}}$ ）的影响而发生变化。熔滴含热量如图3-9所示。图3-9a为焊丝伸出长度小或电阻小的情况，如铝合金。图3-9b为焊丝伸出长度大或电阻大的情况，碳钢和不锈钢通常


      [unit_001106; type=passage; page=97]

      87'
  output: '规则组1

    C: 无

    R: 焊丝熔化参数|U_m、I_a、R_s、c、T_f、H、J —[$\alpha_m=\frac{U_m+I_aR_s}{(cT_f+H)J}$]→ 熔化系数|α_m

    R: 熔化系数|α_m —[采用单位]→ 熔化系数单位|g/(A·min)'
- id: context_001698
  route: text
  difficulty_tags:
  - 空间形态
  - 力学链
  - 平方比例
  - 截断删除
  construction_rationale: 长弧且未短路是整组共同场景。底部电弧形态使电流向下扩展，产生向内和向下的电磁力，其中向下分力促进脱滴。末句虽截断，但“电磁收缩力与电流平方成比例”本身已闭合，可保留比例关系而不续写缺失文字。
  source:
    context_cache: outputs/rule_extraction_full_20260829/cache/contexts/context_001698.json
    model_output_cache: outputs/rule_extraction_full_20260829/cache/model_outputs/context_001698
    prompt_id: rule_generator_routed__text
    prompt_version: base@6+text@2
  input:
    text: '上下文包编号: context_001698


      标题路径:

      第3章 熔滴过渡与焊缝成形 > 3.2 熔滴过渡 > 3.2.2 熔滴上的作用力


      核心正文:

      [unit_001163; type=passage; page=102]

      在电弧较长、熔滴未与熔池液面短路的场合，焊丝端头熔滴的底部形成图3-12b所示的电弧形态，熔滴中流过的电流出现下方扩展型分布，此时的电磁力不仅是指向内侧，而且也指向下方。其中向下的分力使熔滴受到向下的作用力，促使熔滴从焊丝端部脱离。由于电磁收缩力与电流的平方成比例，电流越大，电


      支撑内容:

      [unit_001161; type=passage; page=102]

      由此可以看到，要真实地表现现象，还存在一个很大的问题，即在导体内部电流是如何流动着的。由于含有熔滴的焊丝端部是电流到电弧的流入、流出部位，要合理地确定电流流经路线是很难的。此外，在熔化金属及等离子体作为导电流体的场合，由于其具有流动性及形状的变化，使现象更趋于复杂化。


      [unit_001162; type=passage; page=102]

      电磁力对熔滴过渡也有阻碍力和促进力之分。电磁力直接帮助熔滴脱落的例子如图3-12所示。与水滴的情况类似，较小的熔滴与液面短路的场合，容易形成稳定于焊丝端部与熔池液面间的液柱，并保持短路形态而不破断。然而，当这个液柱中流过较大的电流时，受到电磁收缩力的作用，液柱将会收缩，电流通道变窄，收缩区中心的压力进一步增大，从而产生轴向上的压力梯度。驱使液体从颈缩部位向膨胀部位流动，即促进熔滴向熔池过渡（见图3-12a）。


      [unit_001165; type=passage; page=102]

      92


      [unit_001179; type=passage; page=103]

      第3章 熔滴过渡与焊缝成形'
  output: '规则组1

    C: 电弧|较长 + 熔滴|未与熔池液面短路

    R: 熔滴底部电弧形态|形成 —[使]→ 熔滴内电流分布|向下方扩展

    R: 熔滴内电流分布|向下方扩展 —[使]→ 电磁力方向|指向内侧和下方

    R: 电磁力|向下分力 —[促进]→ 熔滴|从焊丝端部脱离

    R: 焊接电流平方|增大 —[成比例增大]→ 电磁收缩力|增大'
