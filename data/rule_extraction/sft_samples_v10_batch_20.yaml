  input:
    text: "上下文包编号: context_000792\n\n标题路径:\n第6章 熔化极氩弧焊 > 6.5 各种金属的MIG/MAG焊工艺 > 6.5.4 铝及铝合金的MIG焊\n\n包条件（已由上游确定作用域）:\n- [constraint_000901]\
      \ explicit_condition: 送进\n  来源 Unit: unit_003982\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_003982\"\
      , \"end_unit_id\": \"unit_004044\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_003982; type=passage;\
      \ page=395]\n  直径较细的铝合金焊丝在送进时易失稳弯曲而难以送丝。直接采用直径 $0.8\\mathrm{mm}$ 和 $1.0\\mathrm{mm}$ 的焊丝进行铝合金短路过渡焊接时，一般使用 $0.5\\mathrm{kg}$\
      \ 的小型焊丝盘以及特殊的送丝焊枪。对板厚 $1\\sim 2\\mathrm{mm}$ 薄板的对缝焊、搭接角焊缝、端部接头的全位置焊接所采用的焊接条件见表6-36。\n- [constraint_000909] 电弧电压: 电弧电压较低\n\
      \  来源 Unit: unit_004014\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_004014\", \"end_unit_id\"\
      : \"unit_004044\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_004014; type=passage; page=400]\n  铝合金的熔滴过渡形式不但与焊接电流有关，而且还与电弧电压有关，如图6-62所示。图6-62中所示的焊丝熔化特性曲线，在电弧电压较高时与电弧电压无关，而在电弧电压较低时该曲线向左弯曲，说明焊丝的熔化系数提高。在电弧电压较高时，熔滴过渡为大（粗）滴过渡和喷射过渡。当电弧电压较低时为短路过渡。介于喷射过渡与短路过渡之间的电压范围内为亚射流过渡规范区（即焊丝熔化特性曲线左转弯处），在此区间内采用恒流电源与等速送丝控制系统就可以进行稳定的焊接过程。\n\
      - [constraint_000913] 厚度: $50\\mathrm{mm}$ 以上使用 $\\mathrm{Ar}+$ He混合\n  来源 Unit: unit_004030\n  作用域: {\"scope_type\"\
      : \"unit_range\", \"start_unit_id\": \"unit_004030\", \"end_unit_id\": \"unit_004044\", \"target_unit_ids\": [], \"\
      candidate_ranges\": []}\n  [unit_004030; type=passage; page=402]\n  2）根据板厚选择合适的保护气体，在双面单层焊的情况下，厚度为 $50\\mathrm{mm}$\
      \ 以下时使用纯氩，而厚度大于 $50\\mathrm{mm}$ 以上使用 $\\mathrm{Ar}+$ He混合气体。混合比大致为 $\\mathrm{Ar} + \\mathrm{He}$ （ $50\\sim$ $70)\\\
      %$ （体积分数）。3）严格清理焊件和焊丝。4）正确选择焊接参数，采用粗焊丝，减小焊接速度和缩短可见弧长。5）尽量减小焊接过程中电流的变化，如果电流超过 $500\\mathrm{A}$ 时，直接采用恒流特性电源。\n- [constraint_000914]\
      \ 电流: $500\\mathrm{A}$ 时\n  来源 Unit: unit_004030\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_004030\"\
      , \"end_unit_id\": \"unit_004044\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_004030; type=passage;\
      \ page=402]\n  2）根据板厚选择合适的保护气体，在双面单层焊的情况下，厚度为 $50\\mathrm{mm}$ 以下时使用纯氩，而厚度大于 $50\\mathrm{mm}$ 以上使用 $\\mathrm{Ar}+$ He混合气体。混合比大致为\
      \ $\\mathrm{Ar} + \\mathrm{He}$ （ $50\\sim$ $70)\\%$ （体积分数）。3）严格清理焊件和焊丝。4）正确选择焊接参数，采用粗焊丝，减小焊接速度和缩短可见弧长。5）尽量减小焊接过程中电流的变化，如果电流超过\
      \ $500\\mathrm{A}$ 时，直接采用恒流特性电源。\n\n核心正文:\n[unit_004035; type=passage; page=402]\n大电流MIG焊时电流、焊丝直径对熔深的影响如图6-66所示。随着焊接电流的增加，同时熔深的形状也由一般喷射过渡的指状熔深改变为盆底状熔深，这是十分有利的。典型焊接参数见表6-40和图6-67。可见，可焊厚度大大提高，例如用\
      \ $\\phi 5.6\\mathrm{mm}$ 的铝焊丝、选用（Ar+He）混合气体保护，起皱临界电流可提高到1000A，这时进行双面单层焊时的最大厚度可达 $75\\mathrm{mm}$ ，其焊缝断面形貌如图6-68所示。\n\
      \n支撑内容:\n[unit_003943; type=title; page=386]\n6.5.4 铝及铝合金的MIG焊\n\n资源文字化:\n[unit_004036; type=figure; page=402]\n题注:\
      \ 图6-66大电流MIG焊时电流与熔深的关系\n原始文字:\n图6-66大电流MIG焊时电流与熔深的关系\n资源标题: 大电流MIG焊时电流与熔深的关系\n资源描述: 该图展示了大电流MIG焊时电流（$I_a$）与熔深（$H$）的关系。横坐标为电流\
      \ $I_a$，单位A，范围从0到1100；纵坐标为熔深 $H$，单位mm，范围从0到50。图中包含三条曲线，分别对应直径为 $×3.2mm$、$×4.8mm$ 和 $×6.4mm$ 的焊丝。随着电流增加，熔深增加。在 $×3.2mm$\
      \ 和 $×4.8mm$ 的曲线上方标注了“产生起皱”区域。左上角插图展示了焊缝横截面尺寸，包括宽度40、深度20、总高50等。右下角文本框列出了焊接参数：焊丝Al-Mg，母材Al-Mg，气体Ar50%+He50%（体积分数），焊接速度20cm/min，母材升角5°。\n\
      \n[unit_004039; type=figure; page=403]\n题注: 图6-67 对接接头大电流MIG焊的焊接范围\n原始文字:\n图6-67 对接接头大电流MIG焊的焊接范围\n资源标题: 对接接头大电流MIG焊的焊接范围\n\
      资源描述: 该图为二维坐标图，展示了大电流MIG焊平焊时的焊接参数范围。横坐标为板厚 t/mm，范围从0到100；左侧纵坐标为焊接电流 Ia/A，范围从200到1000；右侧纵坐标为焊接速度 vw/(cm/min)，范围从0到60以上。图中包含两个主要的阴影区域，分别表示“2层焊道”和“2层以上焊道”的推荐参数范围。上方阴影区域表示焊接电流\
      \ Ia 随板厚 t 的增加而增加，下方阴影区域表示焊接速度 vw 随板厚 t 的增加而减小。图的右侧列出了不同焊丝直径对应的参数范围，包括焊丝直径 φ2.4mm、φ3.2mm、φ4.0mm、φ4.8mm、φ5.6mm 和 φ6.4mm，并用箭头指示了这些直径在图中的对应位置。\n\
      \n[unit_004040; type=figure; page=403]\n题注: 图6-68 大电流MIG焊焊缝断面形貌\n原始文字:\n图6-68 大电流MIG焊焊缝断面形貌\n资源标题: 大电流MIG焊焊缝断面形貌\n资源描述:\
      \ 这是一张黑白显微照片，展示了金属焊缝的横截面。图像中央是一个垂直延伸的焊缝区域，呈现出明显的“鱼尾纹”状或层叠状结构，由多层交替的明暗条纹组成，显示出熔池的多次摆动或振荡特征。焊缝上部较宽，向下逐渐收窄，底部呈圆弧形。焊缝两侧是母材，左侧母材区域显示出较粗糙的颗粒状纹理，右侧母材纹理相对平滑。图像底部有一条深色的水平基线。\n\
