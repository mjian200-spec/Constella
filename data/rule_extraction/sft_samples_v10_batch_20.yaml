  input:
    text: '上下文包编号: context_001702


      标题路径:

      第3章 熔滴过渡与焊缝成形 > 3.2 熔滴过渡 > 3.2.2 熔滴上的作用力


      核心正文:

      [unit_001183; type=passage; page=104]

      此外，熔滴从焊丝端部脱落过渡的促进力还有电弧空间产生的等离子气流的作用，对熔滴产生摩擦力。等离子气流起因于电弧弧柱中的电磁压力之差，也可以看做是电磁力的一部分。


      支撑内容:

      [unit_001181; type=passage; page=104]

      的作用。在阳极区直径小于焊丝直径时， $F_{\mathrm{m}}$ 是负值，电磁力阻碍熔滴的脱落。


      [unit_001182; type=passage; page=104]

      式（3-15）忽略了熔滴金属的流动，并设阳极区的电流密度分布是均一的。实际使用中应根据熔滴尺寸及电流通道的分布进行电磁力的修正。


      [unit_001184; type=passage; page=104]

      4. 爆炸力


      [unit_001185; type=passage; page=104]

      除上述几个主要作用力外，还有一个影响熔滴过渡的力就是爆炸力。当熔滴在电弧空间停留时间较长时，在熔滴内部由于冶金反应生成较多的气体（如CO等），这些气体逐渐积聚，并使熔滴体积膨胀，当内压力足够大时，熔滴将发生爆破，其中大部分液体金属向熔池过渡，而少量金属成为飞溅。'
  output: '规则组1

    C: 熔滴|从焊丝端部脱落过渡

    R: 电弧弧柱电磁压力|存在差值 —[产生]→ 等离子气流|形成

    R: 等离子气流|作用于熔滴 —[产生]→ 熔滴摩擦力|形成

    R: 熔滴摩擦力|作用 —[促进]→ 熔滴|从焊丝端部脱落

    R: 等离子气流力|作用 —[属于]→ 电磁力|一部分'
