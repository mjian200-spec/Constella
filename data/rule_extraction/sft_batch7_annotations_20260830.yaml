annotations:
  - id: context_000009
    difficulty_tags: [放电定义, 电流区间, 图片核对, 截断句]
    construction_rationale: 100Pa气压和数厘米极距限定图示放电特性。小电流下需外部注入带电粒子，否则失去导电性，由此定义非自持放电；电流增大后放电自身产粒子，定义自持放电。暗放电和辉光区间由正文闭合给出；电弧放电句截断，不采用初稿或图片推断阈值。
    output: |-
      规则组1
      C: 气体压力|100Pa + 电极距离|数厘米
      R: 气体放电电流电压关系|复杂 —[不遵守]→ 欧姆定律|适用
      R: 放电电流|10^-10~10^-8A —[要求]→ 带电粒子来源|外部注入
      R: 带电粒子|未从外部注入 —[使]→ 气体导电性|失去
      R: 带电粒子|必须由外部注入 —[定义为]→ 放电形式|非自持放电
      R: 放电电流|增大 —[使]→ 带电粒子来源|由气体导电过程自身产生
      R: 带电粒子|由放电过程自身产生并维持导电 —[定义为]→ 放电形式|自持放电
      R: 放电电流|10^-8~10^-4A —[对应]→ 放电形式|暗放电
      R: 暗放电|发生 —[对应]→ 发光状态|无光亮
      R: 放电电流|10^-4A以上至约0.1A —[对应]→ 放电形式|辉光放电
      R: 辉光放电|发生 —[对应]→ 发光状态|明亮辉光

  - id: context_000035
    difficulty_tags: [区域作用域, 电离方式比较, 备选压降区]
    construction_rationale: 弧柱、阴极压降区和阳极压降区是三个不同作用域。弧柱约10V/cm弱场使电子由电场获得的动能远小于热作用，故热电离为主、电场电离为次；两个压降区是备选区域，分别在10^5~10^7V/cm强场下可能电场电离，不用加号伪装同时存在。
    output: |-
      规则组1
      C: 电弧区域|弧柱
      R: 电场强度|约10V/cm —[使]→ 电子由电场获得动能|较小
      R: 电子由电场获得动能|较小 —[远小于]→ 电子由热作用获得动能|大小
      R: 弧柱|电离方式 —[主要为]→ 电离类型|热电离
      R: 弧柱|电离方式 —[次要为]→ 电离类型|电场作用电离
      规则组2
      C: 电弧区域|阴极压降区
      R: 电场强度|10^5~10^7V/cm数量级 —[可能产生]→ 电场作用电离|发生
      规则组3
      C: 电弧区域|阳极压降区
      R: 电场强度|10^5~10^7V/cm数量级 —[可能产生]→ 电场作用电离|发生

  - id: context_000044
    difficulty_tags: [费米能级, 温度分支, 概率趋势, 截断句]
    construction_rationale: 绝对零度和大于零温度分组。0K时低于费米能级占据几率约1、高于费米能级存在几率为0；T>0时只有费米能级附近电子受扰动，温度升高使少数低能电子进入高能级，且高能级电子数继续增加。末尾概率句截断，不补出常数值。
    output: |-
      规则组1
      C: 温度|绝对0K
      R: 低于费米能级E_F的能级|电子占据几率 —[对应]→ 概率值|约1
      R: 高于费米能级E_F的能级|电子存在几率 —[对应]→ 概率值|0
      规则组2
      C: 温度|大于0K
      R: 电子能量受扰动范围|位置 —[集中于]→ 能量区域|费米能级E_F附近小范围
      R: 温度|升高 —[使]→ 略低于E_F的电子|占据高于E_F的能级
      R: 温度|越高 —[使]→ 占据高于E_F能级的电子数|越多

  - id: context_000053
    difficulty_tags: [有效逸出功, 公式计算, 低温强场共同条件]
    construction_rationale: 电场降低有效逸出功是一般关系，完整U'w公式以原逸出功Uw和电场强度E为输入、有效逸出功为输出。0℃低温与足够强电场由“如果”共同限定电子发射结果，二者缺一不可。关联式(2-16)只用于比较背景，不重复抄录不属于直接结论的热发射式。
    output: |-
      规则组1
      C: 无
      R: 电极材料逸出功|Uw + 电场强度|E —[$U'_w=U_w-\sqrt{eE/(\pi\varepsilon_0)}$]→ 电极材料有效逸出功|U'w
      R: 电场强度|增加 —[降低]→ 电极材料有效逸出功|降低
      规则组2
      C: 电极温度|0℃即273K + 电场强度|足够强
      R: 电极|电子发射 —[提供]→ 电子流密度|足以满足电弧导电需要

  - id: context_000202
    difficulty_tags: [等熔化曲线, 固有调节定义, 过渡变化, 双端截断]
    construction_rationale: MIG焊铝且送丝速度不变限定Q-R-S段结论。电压降低使熔化相同焊丝所需电流变小并提高熔化系数；弧长减小伴随系数提高被定义为固有调节作用。进一步降压转为短路过渡后该特性消失。首句和末尾过渡名称截断，不使用缓存补全。
    output: |-
      规则组1
      C: 焊接方法|MIG焊 + 焊接对象|铝 + 送丝速度|不变
      R: 电弧电压|降低 —[使]→ 熔化相同长度焊丝所需电流|减小
      R: 电弧电压|降低 —[使]→ 焊丝熔化系数|提高
      R: 弧长|减小 + 焊丝熔化系数|提高 —[定义为]→ 电弧自身作用|固有调节作用
      R: 电弧电压|进一步降低 —[使]→ 熔滴过渡形式|变为短路过渡
      R: 熔滴过渡形式|短路过渡 —[使]→ 上述焊丝熔化特性|消失

  - id: context_000402
    difficulty_tags: [优缺点链, 厚度阈值, 方法起源, 材料应用]
    construction_rationale: TIG焊稳定、保护好和质量优异共同解释广泛应用；钨极载流有限导致熔深浅，再限制不开坡口板厚，6mm以上通常多道焊。A-TIG另组，活性剂用于不锈钢和钛合金并分别获得大熔深和良好效益。方法发明时间是历史事实，不强行转为工艺规则。
    output: |-
      规则组1
      C: 焊接方法|TIG焊
      R: 焊接过程|稳定 + 保护效果|好 + 焊接质量|优异 —[使]→ 应用范围|广泛
      R: 钨极载流能力|有限 —[使]→ 焊接熔深|浅
      R: 焊接熔深|浅 —[限制]→ 不开坡口平板对接板厚|3mm以下
      R: 材料厚度|6mm以上 —[通常采用]→ 焊接方式|多道焊
      规则组2
      C: 焊接方法|A-TIG焊
      R: 活性剂|用于焊接不锈钢和钛合金 —[获得]→ 焊接熔深|较大
      R: 活性剂|用于焊接不锈钢和钛合金 —[获得]→ 应用效益|良好

  - id: context_000407
    difficulty_tags: [验证方法, 分区试验, 图片趋势, 固定参数]
    construction_rationale: 测试电弧电压用于验证电弧收缩是一般方法。试验规则则由不锈钢试件、右半区SiO2和相同电弧参数限定；电弧从无活性剂区进入有活性剂区后电压明显增加。图片只用于核对约8V到约12V的阶跃趋势，不抄取近似曲线点。
    output: |-
      规则组1
      C: 焊接方法|A-TIG焊
      R: 电弧电压|测试 —[可验证]→ 电弧收缩|发生
      规则组2
      C: 试件材质|不锈钢 + 试件右半区域|涂敷SiO2活性剂 + 电弧参数|相同
      R: 电弧位置|由无活性剂区进入有活性剂区 —[使]→ 电弧电压|明显增加

  - id: context_000408
    difficulty_tags: [活性剂机理, 双对流共同结果, 适用范围]
    construction_rationale: 该解释只适用于非金属化合物型活性剂，因此作为共享C。活性剂抑制金属蒸气，蒸气减少缩小阳极斑点并紧缩导电通道；通道紧缩同时增强内部电磁对流、减弱表面等离子对流，两者共同形成大熔深。另明确该解释不适用于金属化合物型活性剂。
    output: |-
      规则组1
      C: 焊接方法|A-TIG焊 + 活性剂类型|非金属化合物型
      R: 活性剂|添加 —[抑制]→ 熔池金属蒸气产生|减少
      R: 熔池金属蒸气|减少 —[使]→ 阳极斑点范围|较小
      R: 阳极斑点范围|较小 —[使]→ 电弧导电通道|紧缩
      R: 电弧导电通道|紧缩 —[增强]→ 熔池内部电磁对流|增强
      R: 电弧导电通道|紧缩 —[减弱]→ 熔池表面等离子对流|减弱
      R: 熔池内部电磁对流|增强 + 熔池表面等离子对流|减弱 —[形成]→ 焊接熔深|较大
      规则组2
      C: 活性剂类型|金属化合物型
      R: 上述机理解释|适用性 —[对应]→ 适用状态|不适用

  - id: context_000411
    difficulty_tags: [备选薄板策略, 厚板图片比较, 作用域拆分]
    construction_rationale: 薄板A-TIG有两个备选策略：提高速度，或采用小参数以减小热输入和变形，分别表达而不使用加号。厚板1m不锈钢焊缝是图片比较场景，A-TIG分别减少层数和缩短时间。图片中的其他焊法与近似数值未被正文点名，不扩展成排名规则。
    output: |-
      规则组1
      C: 焊接方法|A-TIG焊 + 焊接对象|薄板
      R: 焊接工艺|实施 —[可提高]→ 焊接速度|提高
      R: 焊接参数|采用小参数 —[减小]→ 焊接热输入|减小
      R: 焊接热输入|减小 —[减小]→ 焊接变形|减小
      规则组2
      C: 焊接对象|不锈钢厚板 + 焊缝长度|1m
      R: 焊接方法|A-TIG焊 —[减少]→ 焊道层数|减少
      R: 焊接方法|A-TIG焊 —[缩短]→ 焊接时间|缩短

  - id: context_000413
    difficulty_tags: [备选缺陷条件, 方法对照, 截断开头]
    construction_rationale: 钛合金常规TIG是缺陷场景。表面清理不当、保护问题和潮湿气候是三个备选条件，逐条连接气孔，不能用加号变成必须共同成立。活性剂焊接另组，明确不出现气孔且正反面成形好。开头氢气孔与净化残句缺主干，不抽取。
    output: |-
      规则组1
      C: 焊接对象|钛合金 + 焊接方法|常规TIG焊
      R: 表面清理|不当 —[容易产生]→ 气孔|发生
      R: 焊接保护|出现问题 —[容易产生]→ 气孔|发生
      R: 焊接气候|潮湿 —[容易产生]→ 气孔|发生
      规则组2
      C: 焊接对象|钛合金 + 焊接方法|活性剂焊接
      R: 焊接过程|进行 —[避免]→ 气孔|发生
      R: 焊缝正面|熔化成形 —[对应]→ 成形质量|好
      R: 焊缝反面|熔化成形 —[对应]→ 成形质量|好

  - id: context_000617
    difficulty_tags: [工序衔接, 摆动选择, 时间温度控制, OCR校正]
    construction_rationale: 打底层结束后限定后续操作。除过高接头外无需打磨即可热焊；坡口两侧熔合良好时，可不摆动或小之字摆动，两种是备选方式。热焊需控制伸出长度和参数，打底至热焊间隔小于5min、层间温度不低于100℃分别绑定属性；百分号按温度语义校正。
    output: |-
      规则组1
      C: 焊接阶段|打底焊层结束
      R: 焊缝接头|不过高 —[允许]→ 打磨要求|无需打磨
      R: 打磨要求|无需打磨 —[允许]→ 热焊层焊接|进行
      规则组2
      C: 坡口两侧熔合|良好 + 焊接阶段|热焊道
      R: 运条方式|不摆动 —[可采用]→ 热焊道焊接|进行
      R: 运条方式|较小之字形摆动 —[可采用]→ 热焊道焊接|进行
      R: 热焊道焊接|进行 —[要求控制]→ 焊丝伸出长度|合适
      R: 热焊道焊接|进行 —[要求控制]→ 各项焊接参数|合适
      R: 焊接工序|打底焊至热焊 —[要求]→ 时间间隔|小于5min
      R: 层间温度|控制要求 —[不低于]→ 温度值|100℃

  - id: context_000815
    difficulty_tags: [双因素结果, 电弧搅拌链, 焊接质量]
    construction_rationale: 双丝高效MAG焊是共同场景。热分布改变与温度梯度降低由原文共同导向咬边倾向降低，并实现高速焊；两个电弧交替燃烧搅拌熔池，分别改善结晶和促进气体逸出，两项共同提高质量。开头残缺内容不补充其前一触发原因。
    output: |-
      规则组1
      C: 焊接方法|双丝高效MAG焊
      R: 熔池热分布状态|改变 + 熔池周围温度梯度|降低 —[降低]→ 咬边倾向|降低
      R: 咬边倾向|降低 —[有利于实现]→ 焊接速度|高速
      R: 两个电弧|交替燃烧 —[搅拌]→ 熔池|发生搅拌
      R: 熔池|受到搅拌 —[改善]→ 熔池结晶特点|改善
      R: 熔池|受到搅拌 —[促进]→ 熔池气体|逸出
      R: 熔池结晶特点|改善 + 熔池气体|顺利逸出 —[提高]→ 焊接质量|提高

  - id: context_001002
    difficulty_tags: [低频参数, 脉宽比, 周期公式, 速度公式]
    construction_rationale: 铝合金双脉冲MIG焊是共同场景。fL取3~5Hz计算周期0.2~0.33s；脉宽比50%意味着Ts=Tw，再得到各0.1~0.16s。焊接速度经验式以焊缝间距w和低频fL为输入、vw为输出，公式放箭头中。包内远距案例参数不限制该计算段。
    output: |-
      规则组1
      C: 焊接方法|铝合金双脉冲MIG焊
      R: 低频调制频率f_L|3~5Hz —[$T=1/f_L$]→ 脉冲周期T|0.2~0.33s
      R: 脉宽比|50% —[使]→ 通电时间与断弧时间关系|T_s=T_w
      R: 低频调制频率f_L|3~5Hz + 脉宽比|50% —[对应]→ 通电时间T_s|0.1~0.16s
      R: 低频调制频率f_L|3~5Hz + 脉宽比|50% —[对应]→ 断弧时间T_w|0.1~0.16s
      R: 焊缝间距w|数值 + 低频调制频率f_L|数值 —[$v_w=60wf_L$]→ 焊接速度v_w|计算值

  - id: context_001014
    difficulty_tags: [气体分子理论, 公式输入, OCR常数规避]
    construction_rationale: 气体粒子体系直接参与温度、总能量和平均速度关系，C为空。温度高低分别表征总体能量与平均速度高低；完整符号公式以温度T和粒子质量m为输入、平均速度c为输出。资源数值系数存在OCR空格和指数风险，保留无歧义的sqrt(3kT/m)形式，不猜测常数。
    output: |-
      规则组1
      C: 无
      R: 气体粒子体系温度|高低 —[表征]→ 气体粒子总体能量|高低
      R: 气体粒子体系温度|高低 —[表征]→ 气体粒子平均运动速度|高低
      R: 体系温度|T + 气体粒子质量|m —[$c=\sqrt{3kT/m}$]→ 气体粒子平均运动速度|c

  - id: context_001025
