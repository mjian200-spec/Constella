    C: 无

    R: 气体解离过程|发生并吸热 —[影响]→ 带电粒子产生过程|变化

    R: 气体解离过程|发生并吸热 —[显著影响]→ 电弧电性能|变化

    R: 气体解离过程|发生并吸热 —[显著影响]→ 电弧热性能|变化

    规则组2

    C: 电弧长度|相同

    R: CO2气氛电弧|电弧电压 —[高于]→ Ar气氛电弧|电弧电压

    R: CO2气氛电弧|电弧温度 —[高于]→ Ar气氛电弧|电弧温度

    R: N2气氛电弧|电弧电压 —[高于]→ Ar气氛电弧|电弧电压

    R: N2气氛电弧|电弧温度 —[高于]→ Ar气氛电弧|电弧温度'
