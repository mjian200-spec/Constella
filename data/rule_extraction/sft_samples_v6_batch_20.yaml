  construction_rationale: 强电场是整段共同场景。中性粒子和受激粒子是两种备选碰撞对象，不能用加号合并，故分别描述碰撞；一次碰撞同时生成一个新电子和一个正离子，两个结果拆R。新旧两个电子继续碰撞后生成两个新电子，保留第二轮增殖，末尾截断不再推导。
