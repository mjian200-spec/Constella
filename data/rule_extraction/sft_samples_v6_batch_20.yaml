    text: "上下文包编号: context_000410\n\n标题路径:\n第4章 钨极惰性气体保护焊 > 4.6 特种TIG焊方法 > 4.6.1 A-TIG焊技术\n\n包条件（已由上游确定作用域）:\n- [constraint_000463]\
      \ 厚度: $6\\mathrm{mm}$ 以上的材料时\n  来源 Unit: unit_002263\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"\
      unit_002263\", \"end_unit_id\": \"unit_002310\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_002263;\
      \ type=passage; page=205]\n  由于TIG焊焊接过程稳定，保护效果好和焊接质量优异，所以该法应用十分广泛。但是由于钨极的载流能力有限，焊接熔深浅，在不开坡口平板对接焊时只能焊接 $3\\mathrm{mm}$\
      \ 以下的板，从而使应用受到限制。在焊接厚度为 $6\\mathrm{mm}$ 以上的材料时，一般都采用多道焊。为此，乌克兰巴顿焊接研究所于20世纪60年代发明了活性焊剂TIG焊（Activate flux TIG焊，简称A-TIG焊）。发明了活性剂，用以焊接不锈钢和钛合金，取得了较大的熔深和良好的效益。\n\
      - [constraint_000464] 材料: 焊接板厚 $12\\mathrm{mm}$ 以下的不锈钢材料\n  来源 Unit: unit_002265\n  作用域: {\"scope_type\": \"unit_range\"\
      , \"start_unit_id\": \"unit_002265\", \"end_unit_id\": \"unit_002310\", \"target_unit_ids\": [], \"candidate_ranges\"\
      : []}\n  [unit_002265; type=passage; page=205]\n  在相同焊接参数、相同设备的条件下，活性焊剂TIG焊的熔深比常规的TIG焊增加 $1\\sim 3$ 倍，在焊接板厚 $12\\mathrm{mm}$\
      \ 以下的不锈钢材料时，无需开坡口，可一次焊接完成，并实现单面焊双面成形。同时由于活性剂在电弧高温下分解的作用，\n- [constraint_000468] explicit_condition: 熔池金属中存在某种微量元素或接触到活性气氛\n\
      \  来源 Unit: unit_002286\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\": \"unit_002286\", \"end_unit_id\"\
      : \"unit_002310\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_002286; type=passage; page=207]\n  （3）表面张力理论\
      \ 表面张力理论认为，熔池金属流动状态对焊缝的熔深起到重要影响，一般的熔池金属具有负的表面张力温度系数，此时温度越高，其表面张力越小，因熔池中心的温度比熔池周边的高，则熔池中心的表面张力小于熔池周边，于是在熔池表面形成以熔池中心向熔池周边的表面张力流，结果得到浅而宽的焊缝。但当熔池金属中存在某种微量元素或接触到活性气氛时，熔池金属的表面张力数值降低转变为正温度系数，从而使熔池金属形成以熔池周边向着熔池中心的表面张力流，在熔池中心的液态金属携带电弧热量从熔池表面直接流向熔池底部，从而加强了对熔池底部的加热效率，而增大了熔深。\n\
      \n核心正文:\n[unit_002289; type=passage; page=207]\n1）A-TIG焊对于提高焊接效率具有明显作用。不仅能提高效率，而且能降低成本。在焊接参数不变的情况下，与常规TIG焊相比，A-TIG焊可以提高熔深一倍以上（厚\
      \ $12\\mathrm{mm}$ 不锈钢可以单道焊一次焊透），而且不增加正面焊缝宽度。中等厚度的材料可以开坡口一次焊透，如图4-52所示；更厚的焊件可以减少焊道的层数\n\n支撑内容:\n[unit_002261; type=title;\
      \ page=205]\n4.6.1 A-TIG焊技术\n\n资源文字化:\n[unit_002293; type=figure; page=207]\n题注: a)  b)  图4-52 6.0mm厚1Cr18N9Ti不锈钢TIG焊缝和A-TIG焊缝金相形貌对比a）TIG焊缝形貌b）A-TIG焊缝形貌\n\
      原始文字:\na)  b)  图4-52 6.0mm厚1Cr18N9Ti不锈钢TIG焊缝和A-TIG焊缝金相形貌对比a）TIG焊缝形貌b）A-TIG焊缝形貌\n资源标题: 6.0mm厚1Cr18N9Ti不锈钢TIG焊缝和A-TIG焊缝金相形貌对比\n\
