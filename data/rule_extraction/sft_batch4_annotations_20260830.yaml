annotations:
  - id: context_000025
    difficulty_tags: [数量级, 等价解释, 截断句]
    construction_rationale: 常压焊接电弧是闭合事实的共同场景。电子作为主要载流粒子、维持正常导电所需电子密度、满足小电流导电所需实效电离度分别抽取；“一万个中性粒子中一个被电离”是10^-4数量级的等价解释。末尾强迫冷却等内容被截断，不补写趋势。
    output: |-
      规则组1
      C: 焊接电弧|常压
      R: 电弧带电粒子|组成 —[主要为]→ 带电粒子类型|电子
      R: 电子密度|10^14个/cm³数量级 —[可维持]→ 电弧导电状态|正常
      R: 实效电离度|10^-4数量级 —[可满足]→ 小电流电弧导电需要|满足
      R: 中性粒子总数|1万个 —[对应]→ 被电离中性粒子数量|1个
      R: 一般焊接电弧|电离度 —[对应]→ 电离度数量级|0.1×10^-3~0.6×10^-3

  - id: context_000057
    difficulty_tags: [材料分类, 阈值判据, 次要作用]
    construction_rationale: K、Na、Ca等低逸出功元素与Fe、Cu、W等重金属对应不同光谱区，作为两类材料事实分别表达。入射波长小于临界波长是发生光发射的直接判据；电弧光谱覆盖可见光和紫外线，因此可能引起电极光发射，但光量较弱又限定其在阴极发射中仅处于次要地位。
    output: |-
      规则组1
      C: 无
      R: 低逸出功元素|K、Na、Ca等 —[对应]→ 光发射临界波长|可见光区间
      R: 重金属|Fe、Cu、W等 —[对应]→ 光发射临界波长|紫外线区间
      R: 入射光波长λ|小于临界波长λ₀′ —[使]→ 光发射|发生
      R: 电弧光辐射|包含可见光和紫外线 —[可能引起]→ 电极|光发射
      R: 电弧光量|较弱 —[使]→ 光发射在阴极发射中的地位|次要

  - id: context_000120
    difficulty_tags: [频率对比, 动特性, 热惯性链, 图片核对]
    construction_rationale: 3000Hz高频、中低频和正弦波频率升高是三个不同作用域，分别建组。高频下电流与电压同向变化且过零所需再引燃电压较低；中低频仍需一定电压。正弦波频率升高后，过零变快，再结合热惯性导致电弧空间和电极来不及冷却，最终易再引燃。
    output: |-
      规则组1
      C: 焊接方法|交流电弧 + 电极材料|热阴极材料 + 交流电频率|3000Hz
      R: 焊接电流|增加 —[使]→ 电弧电压|增高
      R: 焊接电流|减小 —[使]→ 电弧电压|降低
      R: 焊接电流|过零 —[对应]→ 所需再引燃电压|较低
      规则组2
      C: 焊接方法|交流电弧 + 交流电频率|中低频
      R: 焊接电流|过零 —[仍需要]→ 再引燃电压|一定数值
      规则组3
      C: 焊接方法|交流电弧 + 电流波形|正弦波
      R: 交流焊接电流频率|增高 —[使]→ 电流过零变化速度|加快
      R: 焊接电弧|存在热惯性 —[使]→ 电弧空间及电极冷却状态|来不及冷却
      R: 电弧空间及电极|来不及冷却 —[使]→ 极性转换时电弧再引燃难易|容易

  - id: context_000361
    difficulty_tags: [表格映射, 趋势关系, 工艺替代]
    construction_rationale: 方波替代正弦波是为加快过零并保持较高电离度，不能反写成“正弦波过零慢导致消电离慢”。换向前EN半波电流增大使再引燃电压降低为趋势；表4-12四行逐值抽取，正文另给200A时无需再引燃电压且电弧连续燃烧，也作为闭合结果保留。
    output: |-
      规则组1
      C: 焊接方法|交流TIG焊
      R: 交流电流波形|正弦波 —[替代为]→ 交流电流波形|方波
      R: 交流电流波形|方波 —[加快]→ 电流过零速度|加快
      R: 电流过零速度|加快 —[有利于保持]→ 电弧电离度|较高
      规则组2
      C: 焊接方法|交流TIG焊 + 换向前极性|EN半波
      R: 焊接电流|增大 —[使]→ 再引燃电压|降低
      R: 焊接电流|20A —[对应]→ 再引燃电压|300V
      R: 焊接电流|60A —[对应]→ 再引燃电压|200V
      R: 焊接电流|100A —[对应]→ 再引燃电压|100V
      R: 焊接电流|150A —[对应]→ 再引燃电压|90V
      R: 焊接电流|200A —[对应]→ 再引燃电压|不需要
      R: 焊接电流|200A —[使]→ 电弧燃烧状态|连续

  - id: context_000406
    difficulty_tags: [截断开头, 图片核对, 多步因果链]
    construction_rationale: 标题和段落共同确定A-TIG焊场景，但包中的厚度、材料约束来自更远的前文，不能证明限定当前机理链。正文从电弧自动收缩开始语义闭合，依次连接电压增加、热量集中、用于熔化母材的热量增多与熔深增加；图片只核对收缩模型，不增加图像推断。
    output: |-
      规则组1
      C: 焊接方法|A-TIG焊
      R: 电弧|自动收缩 —[使]→ 电弧电压|增加
      R: 电弧电压|增加 —[使]→ 电弧热量分布|集中
      R: 电弧热量分布|集中 —[使]→ 熔化母材所用热量|增多
      R: 熔化母材所用热量|增多 —[使]→ 焊接熔深|增加

  - id: context_000440
    difficulty_tags: [阈值防孔, 脱氧链, 公式反应]
    construction_rationale: CO2焊是共同场景，硅质量分数大于0.2%直接防止CO气孔；凝固温度只限定硅的强脱氧作用。硅与氧化亚铁反应后阻止碳氧化，脱氧焊丝最终得到致密焊缝。式(5-13)以实际反应物和生成物置于等式两端，完整反应式放箭头中，不写成式号自环。
    output: |-
      规则组1
      C: 焊接方法|CO2气体保护焊
      R: 焊缝金属硅质量分数|大于0.2% —[防止]→ CO气体所致气孔|形成
      R: 焊缝金属|处于凝固温度 + 硅|存在 —[使]→ 硅脱氧作用|强烈
      R: 硅|与氧化亚铁作用 —[阻止]→ 碳氧化|发生
      R: 脱氧焊丝|使用 —[使]→ 焊缝致密性|致密
      规则组2
      C: 无
      R: 反应物|2FeO(液)+Si(液) —[$2\mathrm{FeO}(液)+\mathrm{Si}(液)\rightleftharpoons2\mathrm{Fe}(液)+\mathrm{SiO_2}(液)\downarrow$]→ 生成物|2Fe(液)+SiO2(液)进入渣中

  - id: context_000442
    difficulty_tags: [表格核对, 阈值缺陷, 控制措施, 截断句]
    construction_rationale: CO2焊是整段场景。含水量增加同时提高氢分压和焊缝含氢量，是两个并列结果；1.92g/m³对应4.7mL/100g并开始出现单个气孔，保留数值链。继续增湿导致气孔增多，控制措施是减少CO2水分。表格只核对正文使用的数值，不批量抄录其余行。
    output: |-
      规则组1
      C: 焊接方法|CO2气体保护焊
      R: CO2气体含水量|增加 —[提高]→ 焊接区域氢分压|提高
      R: CO2气体含水量|增加 —[提高]→ 焊缝金属含氢量|提高
      R: CO2气体含水量|1.92g/m³ —[对应]→ 焊缝金属含氢量|4.7mL/100g
      R: 焊缝金属含氢量|4.7mL/100g —[使]→ 焊缝气孔|开始出现单个
      R: CO2气体含水量|进一步增加 —[使]→ 焊缝气孔数量|增加
      R: CO2气体水分|减少 —[控制]→ 氢气孔|减少

  - id: context_000488
    difficulty_tags: [备选焊接位置, 工艺性能, 多层焊]
    construction_rationale: 平焊和平角焊是备选位置，当前DSL不使用OR，因此拆成两组并分别保留抗风、外观和脱渣性能，不能用“平焊或平角焊”制造复合状态。厚板平焊另组，熔渣型药芯焊丝允许不除渣多层焊，高效率金属型药芯焊丝也是该场景下的推荐选择。
    output: |-
      规则组1
      C: 焊接位置|平焊
      R: 焊丝类型|熔渣型药芯焊丝 —[获得]→ 抗风能力|稍好
      R: 焊丝类型|熔渣型药芯焊丝 —[获得]→ 焊道形状和外观|良好
      R: 焊丝类型|熔渣型药芯焊丝 —[获得]→ 脱渣性|优良
      规则组2
      C: 焊接位置|平角焊
      R: 焊丝类型|熔渣型药芯焊丝 —[获得]→ 抗风能力|稍好
      R: 焊丝类型|熔渣型药芯焊丝 —[获得]→ 焊道形状和外观|良好
      R: 焊丝类型|熔渣型药芯焊丝 —[获得]→ 脱渣性|优良
      规则组3
      C: 焊接位置|厚板平焊
      R: 焊丝类型|熔渣型药芯焊丝 —[允许]→ 多层焊除渣要求|可以不除渣
      R: 焊丝类型|金属型药芯焊丝 —[对应]→ 焊接效率|高

  - id: context_000643
    difficulty_tags: [设备标准, 百分比范围, 公式计算]
    construction_rationale: MIG焊机是共同设备场景。额定电流不高于200A时，最小电流由企业标准规定；高于200A时才受25%上限约束，两种范围必须分组。最大电流下限独立表达。约定负载电压公式以约定焊接电流I2为输入、U2为输出，并把完整公式放入箭头。
    output: |-
      规则组1
      C: 焊接设备|MIG焊机 + 额定焊接电流|200A及以下
      R: 最小焊接电流|取值依据 —[由]→ 企业标准|规定
      规则组2
      C: 焊接设备|MIG焊机 + 额定焊接电流|200A以上
      R: 最小焊接电流|数值 —[不大于]→ 额定焊接电流占比|25%
      规则组3
      C: 焊接设备|MIG焊机
      R: 最大焊接电流|数值 —[不小于]→ 额定焊接电流占比|100%
      R: 约定焊接电流|I2 —[$U_2=14+0.05I_2$]→ 约定负载电压|U2

  - id: context_000718
    difficulty_tags: [截断开头, 方法比较, 表格参数拆分, 图片尺寸]
    construction_rationale: 开头侧壁打火缺少原因，不抽取。短路过渡的夹渣和熔合不良、大电流射流过渡的裂纹与热输入问题分别成组。锅炉联箱案例用壁厚和坡口宽度作共同C；表6-10在φ3mm焊丝下给出五项独立参数，逐属性拆R，避免塞进一个不可检索的长状态。
    output: |-
      规则组1
      C: 熔滴过渡形式|短路过渡
      R: 焊接过程|进行 —[容易形成]→ 夹渣|发生
      R: 焊接过程|进行 —[容易形成]→ 熔合不良|发生
      规则组2
      C: 熔滴过渡形式|大电流射流过渡
      R: 焊缝成形系数|增加 —[容易产生]→ 裂纹|发生
      R: 焊接热输入|过大 —[使]→ 焊缝金属综合性能|不满足要求
      规则组3
      C: 焊接对象|锅炉联箱 + 壁厚|30~50mm + 坡口宽度|10~12mm
      R: 焊接方法|脉冲氩弧焊 —[获得]→ 焊接结果|满意
      规则组4
      C: 焊接对象|锅炉联箱 + 焊丝直径|φ3mm
      R: 脉冲频率f|取值 —[对应]→ 参数值|50~100Hz
      R: 峰值电流Ip|取值 —[对应]→ 参数值|450A
      R: 基值电流Ib|取值 —[对应]→ 参数值|240A
      R: 焊接速度vs|取值 —[对应]→ 参数值|7~9m/h
      R: 保护气体|成分 —[对应]→ 气体配比|Ar + O2 2%
