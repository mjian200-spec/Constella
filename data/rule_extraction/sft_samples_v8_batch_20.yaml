    R: 熔化金属温度|升高 —[使]→ 表面张力|减小

    R: 表面张力|随温度升高而减小 —[形成]→ 熔池表面流动方向|由中心区向周边区

    R: 熔池表面流动|由中心区向周边区 —[相反于]→ 电磁对流|方向

    规则组4

    C: 焊接电流|小

    R: 表面张力对流|由中心区向周边区 —[使]→ 熔深|变浅'
