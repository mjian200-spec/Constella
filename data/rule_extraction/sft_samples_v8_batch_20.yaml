      核心正文:

      [unit_003162; type=passage; page=299]

      $\mathrm{CO}_{2}$ 焊焊接时根据焊枪移动方向的不同分为左焊法和右焊法， $\mathrm{CO}_{2}$ 焊时多用左焊法，而右焊法也有许多特点，如图5-84所示。


      支撑内容:

      [unit_003165; type=passage; page=299]

      细丝大电流 $\mathrm{CO}_{2}$ 焊时电弧指向性很强，倾斜焊枪时它的指向就是电弧力的作用方向（一般称为电弧挺度）。由于焊枪的倾角不同，所以焊缝形状和熔深也


      [unit_003167; type=passage; page=299]

      289


      资源文字化:

      [unit_003164; type=figure; page=299]

      题注: b)  图5-84 平焊时焊枪倾角的影响

      原始文字:

      b)  图5-84 平焊时焊枪倾角的影响

      资源标题: b) 图5-84 平焊时焊枪倾角的影响

      资源描述: 该图展示了平焊时采用“右焊法”的示意图。图中包含一个水平放置的工件，左侧有一个已完成的焊缝截面（呈椭圆形，内部有斜线填充）。右侧显示了一个焊接工具（焊枪），其轴线与垂直虚线之间形成一个夹角，标注为“10°~20°”。焊枪向右倾斜，指向焊接点。在焊枪左侧，有文字“右焊法”和一个指向右侧的箭头，表示焊接方向。'
    images:
    - unit_id: unit_003164
      type: figure
      page: 299
      caption: b)  图5-84 平焊时焊枪倾角的影响
      path: /CODE/jm/Constella/GMAW/hybrid_ocr/images/241b9a0eabd3b493026911da558aa860234bf643df79ab871e5b6d892e431f21.jpg
  output: '规则组1

    C: 焊接方法|CO2焊

    R: 焊枪移动方向|不同 —[划分]→ 焊接操作方法|左焊法

    R: 焊枪移动方向|不同 —[划分]→ 焊接操作方法|右焊法

