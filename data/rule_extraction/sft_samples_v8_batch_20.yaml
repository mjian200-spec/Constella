- id: context_001801
  route: text
  difficulty_tags:
  - 对流方向
  - 浮力影响
  - 表面张力对流
  - 小电流
  construction_rationale: 熔池电磁对流方向先作为一般事实；平焊时高表面温度使金属受浮力停留表面并削弱电磁对流。通常表面张力随温度升高而减小，形成与电磁对流反向的中心到周边流动；小电流时该表面张力对流导致熔深变浅，不能直接写成“小电流导致浅熔深”。
  source:
    context_cache: outputs/rule_extraction_full_20260829/cache/contexts/context_001801.json
    model_output_cache: outputs/rule_extraction_full_20260829/cache/model_outputs/context_001801
    prompt_id: rule_generator_routed__text
    prompt_version: base@6+text@2
  input:
    text: '上下文包编号: context_001801


      标题路径:

      第3章 熔滴过渡与焊缝成形 > 3.3 母材熔化与焊缝成形 > 3.3.2 熔池金属的对流和对流驱动力


      核心正文:

      [unit_001655; type=passage; page=147]

      电磁对流在熔池的中心区是向下方流动，在表面上是从熔池边界区向中心区流动。由于熔池表面的温度较高，对于平焊情况，表面的熔化金属因浮力有留在表面的倾向，对电磁对流有减弱的作用。熔化金属的表面张力通常情况是随温度的上升而减小，因此形成从中心区向周边区的流动，仍然是与电磁对流反向。小电流焊接时，表面张力对流使熔深变浅。


      支撑内容:

      [unit_001653; type=passage; page=147]

      图3-77d是由于熔池底部熔化金属密度差引起的对流，称做浮力对流，与通常的热对流有相同的机制。焊接情况下，熔池内部的温度是从电弧正下方的高温区向固液界面处的熔点温度变化着的，形成了熔池内部的空间温度场。液态金属是温度越高密度越低，密度高的部分受到浮力的作用向着重力的反方向运动。


      [unit_001654; type=passage; page=147]

      电弧焊情况下，这些对流中以等离子气流引起的对流、表面张力流及电磁对流最为重要。


      [unit_001656; type=passage; page=147]

      2. 表面张力流与微量元素的影响'
  output: '规则组1

    C: 无

    R: 熔池中心区|电磁对流 —[对应]→ 流动方向|向下

    R: 熔池表面|电磁对流 —[对应]→ 流动方向|由边界区向中心区

    规则组2

    C: 焊接位置|平焊

    R: 熔池表面温度|较高 —[使]→ 表面熔化金属|受浮力而倾向留在表面

    R: 表面熔化金属|倾向留在表面 —[减弱]→ 电磁对流|减弱

