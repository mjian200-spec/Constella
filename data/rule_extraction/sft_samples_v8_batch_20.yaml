- id: context_001311
  route: text+image
  difficulty_tags:
  - 方法比较
  - 空间位置约束
  - 熔渣作用
  - 截断句
  construction_rationale: 药芯焊丝与实心焊丝CO2焊在可用电流上作同属性比较；空间位置焊接时，熔渣作用进一步允许更大电流。图5-86虽展示多直径曲线，但正文在低电流趋势处截断，初稿的工件厚度和截面形状规则来自别处，均不进入金标。
  source:
    context_cache: outputs/rule_extraction_full_20260829/cache/contexts/context_001311.json
    model_output_cache: outputs/rule_extraction_full_20260829/cache/model_outputs/context_001311
    prompt_id: rule_generator_routed__text__image
    prompt_version: base@6+text@2+image@4
  input:
    text: '上下文包编号: context_001311


      标题路径:

      第5章 $\mathrm{CO}_{2}$ 气体保护焊 > 5.4 $\mathrm{CO}_{2}$ 焊的焊接工艺 > 5.4.4 药芯焊丝 $\mathrm{CO}_{2}$ 焊工艺


      核心正文:

      [unit_003189; type=passage; page=301]

      （2）焊接电流与电弧电压 与实心焊丝 $\mathrm{CO}_{2}$ 焊相比，药芯焊丝 $\mathrm{CO}_{2}$ 焊可以采用较大的焊接电流。尤其是在空间位置焊接时，由于熔渣的作用允许焊接电流更大些。图5-86所示为碳钢药芯焊丝
      $\mathrm{CO}_{2}$ 焊的送丝速度与焊接电流的关系。细丝在改变相同的送丝速度时，焊接电流在低电流范围内改


      支撑内容:

      [unit_003187; type=passage; page=301]

      （1）焊丝直径 药芯焊丝的焊丝直径通常有 $1.2\mathrm{mm}$ 、 $1.4\mathrm{mm}$ 、 $1.6\mathrm{mm}$ 、 $2.0\mathrm{mm}$ 、 $2.4\mathrm{mm}$ 、
      $2.8\mathrm{mm}$ 和 $3.2\mathrm{mm}$ 等几种。小规格细丝（包括直径为 $1.2\mathrm{mm}$ 、 $1.4\mathrm{mm}$ 、 $1.6\mathrm{mm}$ 和 $2.0\mathrm{mm}$
      ）多用O形截面，而大规格焊丝（包括直径为


      [unit_003188; type=passage; page=301]

      2.4mm、2.8mm和3.2mm）多用复杂形状截面。焊丝直径根据工件厚度来选择，随着工件厚度的增大，药芯焊丝直径也应增大。


      [unit_003192; type=passage; page=301]

      291


      资源文字化:

      [unit_003190; type=figure; page=301]

      题注: 图5-86 碳钢药芯焊丝 $\mathrm{CO}_{2}$ 焊的送丝速度与焊接电流的关系

      原始文字:

      图5-86 碳钢药芯焊丝 $\mathrm{CO}_{2}$ 焊的送丝速度与焊接电流的关系

      资源标题: 碳钢药芯焊丝 CO₂ 焊的送丝速度与焊接电流的关系

      资源描述: 该图为二维坐标图，展示了碳钢药芯焊丝在CO₂保护焊中，不同直径焊丝对应的送丝速度与焊接电流的关系。横坐标为焊接电流，单位A，刻度范围从100到800，间隔100。纵坐标为送丝速度，单位cm/min，刻度范围从0到2400，间隔300。图中包含六条带阴影的斜向条带，分别代表不同直径的焊丝，条带随电流增加向右上方倾斜。具体标注如下：

      1. φ1.2mm：位于左上方，电流范围约150-300A，送丝速度范围约800-2100cm/min。

      2. φ1.6mm：位于中部，电流范围约200-400A，送丝速度范围约500-1300cm/min。

      3. φ2.0mm：位于中右部，电流范围约300-500A，送丝速度范围约400-900cm/min。

      4. φ2.4mm：位于右侧，电流范围约400-550A，送丝速度范围约350-700cm/min。

      5. φ2.8mm：位于右下方，电流范围约450-650A，送丝速度范围约300-600cm/min。

      6. φ3.2mm：位于最右下方，电流范围约500-700A，送丝速度范围约300-500cm/min。'
    images:
    - unit_id: unit_003190
      type: figure
      page: 301
      caption: 图5-86 碳钢药芯焊丝 $\mathrm{CO}_{2}$ 焊的送丝速度与焊接电流的关系
      path: /CODE/jm/Constella/GMAW/hybrid_ocr/images/3abb68ccc43de4c8e2a9efb1adcf0398605f6e5ae6ddd29572ae9c3dff06aa92.jpg
  output: '规则组1

    C: 无

    R: 药芯焊丝CO2焊|可采用焊接电流 —[大于]→ 实心焊丝CO2焊|可采用焊接电流

    规则组2

    C: 焊接方法|药芯焊丝CO2焊 + 焊接位置|空间位置

    R: 熔渣|作用 —[允许]→ 可采用焊接电流|更大'
- id: context_001343
  route: text+image
  difficulty_tags:
  - 抗干扰比较
  - 固定扰动
  - 图片核对
  - 越界删除
  construction_rationale: 亚射流铝合金MIG且送丝速度受扰约10%限定电源比较。恒流电源下熔深变化很小；恒压下熔深和形状变化很大，分别输出。缓存的固有调节系统及保护气体清理扰动来自邻段，当前核心未陈述，删除。图片仅核对焊缝截面差异。
  source:
    context_cache: outputs/rule_extraction_full_20260829/cache/contexts/context_001343.json
    model_output_cache: outputs/rule_extraction_full_20260829/cache/model_outputs/context_001343
    prompt_id: rule_generator_routed__text__image
    prompt_version: base@6+text@2+image@4
  input:
    text: '上下文包编号: context_001343


      标题路径:

      第6章 熔化极氩弧焊 > 6.3 MIG/MAG 焊熔滴过渡 > 6.3.3 亚射流过渡


      核心正文:

      [unit_003515; type=passage; page=332]

      采用这种控制系统具有较强的抗干扰能力，例如送丝速度在外界干扰下变化约 $10\%$ 时，焊缝形状变化如图6-18所示。可见，采用恒流电源时，熔深变化很小，而采用恒压电源时，熔深和焊缝形状变化却很大。


      支撑内容:

      [unit_003514; type=passage; page=332]

      铝合金MIG焊在亚射流过渡区内电弧具有较强的固有自身调节作用，所以等速送丝配合恒流电源就能保证焊接过程稳定性。


      [unit_003517; type=passage; page=332]

      同时，保护气体状况和焊缝与母材表面清理程度变化时，也将影响焊缝成形。当采用恒流电源时，电流不受外界干扰，而保持恒定，所以焊缝成形变化不大。恒压电源却恰好相反，焊缝成形有较大变化。


      [unit_003518; type=passage; page=332]

      2. 电弧固有自调节作用机理


      资源文字化:

      [unit_003516; type=figure; page=332]

      题注: 图6-18 亚射流过渡焊接时送丝速度变化（ $10\%$ ）的情况下对焊缝形状的影响

      原始文字:

      图6-18 亚射流过渡焊接时送丝速度变化（ $10\%$ ）的情况下对焊缝形状的影响

      资源标题: 亚射流过渡焊接时送丝速度变化（10%）的情况下对焊缝形状的影响

      资源描述: 该图展示了亚射流过渡焊接时，送丝速度变化对焊缝形状的影响。横坐标为焊接电流 $I_a$ (A)，范围从200A到360A；纵坐标为电弧电压 $U_a$ (V)，范围从20V到35V。图中绘制了多条虚线，分别标记为“恒流特性
      (C.C.)”和“恒压特性 (C.P.)”。图中分布着多个表示焊缝横截面的图形，这些图形被分为两组，分别对应送丝速度为800和900（单位未标明，但根据上下文推测为mm/min或cm/min，图中右上角标注了1000cm/min作为参考）。每个焊缝截面图形旁标注了A1、A2、A''1、A''2等符号，表示不同的焊接参数点。图的右下角有一个文本框，列出了具体的焊接参数：5183:
      1.6mm, 5083: 1.6mm, 30cm/min, Ar 平焊。'
    images:
    - unit_id: unit_003516
      type: figure
      page: 332
      caption: 图6-18 亚射流过渡焊接时送丝速度变化（ $10\%$ ）的情况下对焊缝形状的影响
      path: /CODE/jm/Constella/GMAW/hybrid_ocr/images/7bc89a2d30c4d13177a48ec11b44efad6a08bc55a1f3bf27d83bdd25294d610a.jpg
  output: '规则组1

    C: 焊接方法|铝合金MIG焊 + 熔滴过渡形式|亚射流过渡 + 送丝速度|受外界干扰变化约10%

    R: 电源类型|恒流电源 —[使]→ 熔深变化幅度|很小

    R: 电源类型|恒压电源 —[使]→ 熔深变化幅度|很大

    R: 电源类型|恒压电源 —[使]→ 焊缝形状变化幅度|很大'
- id: context_001348
  route: text+image
  difficulty_tags:
  - 电感分区
  - 短路机理链
  - 图片曲线
  construction_rationale: 高电压无短路区和降压瞬时短路区必须分组。前者电感对曲线无影响；后者较大电感同时限制短路电流增长、延长短路时间，两者共同使等熔化曲线提前右转并进入短路过渡区。图6-22用于核对有无电感曲线位置，不抄视觉近似值。
  source:
    context_cache: outputs/rule_extraction_full_20260829/cache/contexts/context_001348.json
    model_output_cache: outputs/rule_extraction_full_20260829/cache/model_outputs/context_001348
    prompt_id: rule_generator_routed__text__image
    prompt_version: base@6+text@2+image@4
  input:
    text: '上下文包编号: context_001348


      标题路径:

      第6章 熔化极氩弧焊 > 6.3 MIG/MAG 焊熔滴过渡 > 6.3.3 亚射流过渡


      核心正文:

      [unit_003539; type=passage; page=334]

      （3）焊接回路电感的影响回路电感值对等熔化特性曲线的影响如图6-22所示。从图6-22可见，在电压较高的无短路区域时，电感没有影响。而降低电压，并开始瞬时短路时，若回路电感较大，该曲线提前向右转。这是因为短路时电感将限制短路电流的增长速度，同时相应增加短路持续时间，使得曲线提前转入短路过渡区。


      支撑内容:

      [unit_003538; type=passage; page=334]

      同理，当气流受到扰动或者焊丝或焊件清理不良、表面氧化膜较厚时，皆使曲线向右移。


      [unit_003541; type=title; page=334]

      6.3.4 高效 MAG 焊


      [unit_003542; type=passage; page=334]

      在焊接厚板时，为了降低生产成本和提高生产率，常常采取提高送丝速度方法来提高熔敷效率。现在大量使用的MAG焊采用 $\phi 1.2\mathrm{mm}$ 焊丝，最大电流为


      资源文字化:

      [unit_003540; type=figure; page=334]

      题注: 图6-22 电感对等熔化特性曲线的影响

      原始文字:

      图6-22 电感对等熔化特性曲线的影响

      资源标题: 图6-22 电感对等熔化特性曲线的影响

      资源描述: 该图为二维坐标图，展示了电感对等熔化特性曲线的影响。纵轴为电压 $U_a$（单位：V），刻度从0到30；横轴为电流 $I_a$（单位：A），刻度从0到300，0与200之间有波浪线表示断轴。图中包含两条曲线：左侧曲线标记为“无电感”，右侧曲线标记为“有电感”。两条曲线均呈现先下降后上升的趋势，且“有电感”曲线整体位于“无电感”曲线的右侧。图右侧列出了实验参数：Ar气流量600L/h，喷嘴
      $d=30mm$，恒压电源，$v_m=660cm/min$，材料为Al，直径 $\phi1.6mm$。'
    images:
    - unit_id: unit_003540
      type: figure
      page: 334
      caption: 图6-22 电感对等熔化特性曲线的影响
      path: /CODE/jm/Constella/GMAW/hybrid_ocr/images/eef9d9d4889a01d668899005c646ad0069d2f480f0bf0d3f66b703f0aebbd10b.jpg
  output: '规则组1

    C: 熔滴过渡形式|亚射流过渡 + 电弧电压|较高 + 短路状态|无短路

    R: 焊接回路电感|存在 —[对应]→ 等熔化特性曲线影响|无影响

    规则组2

    C: 熔滴过渡形式|亚射流过渡 + 电弧电压|降低并开始瞬时短路

    R: 焊接回路电感|较大 —[限制]→ 短路电流增长速度|减慢

    R: 焊接回路电感|较大 —[增加]→ 短路持续时间|增加

    R: 短路电流增长速度|减慢 + 短路持续时间|增加 —[使]→ 等熔化特性曲线|提前向右转

    R: 等熔化特性曲线|提前向右转 —[使]→ 熔滴过渡状态|提前进入短路过渡区'
