      核心正文:

      [unit_001733; type=passage; page=154]

      焊接缺陷有多种，如内部缺陷和外部缺陷、微观组织缺陷和宏观缺陷等，气孔、夹渣、裂纹等缺陷除与焊接参数和工艺有关外，更主要的是受到焊缝冶金因素和焊接热循环的影响，相对比较复杂。在此仅仅探讨焊缝成形方面所表现出的明显缺陷。


