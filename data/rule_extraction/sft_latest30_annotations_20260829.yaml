      R: 稳弧措施|无 —[对应]→ 稳定焊接最小电流|120A
      R: 稳弧措施|电压脉冲120V —[对应]→ 稳定焊接最小电流|70A
      R: 稳弧措施|电流脉冲300A —[对应]→ 稳定焊接最小电流|20A
      R: 稳弧措施|电压脉冲120V + 稳弧措施|电流脉冲300A —[对应]→ 稳定焊接最小电流|10A

  - id: context_000132
    difficulty_tags: [能量损耗, 平特性, 多方法拆分]
    construction_rationale: 周边散热、金属蒸气和等离子流损耗共同构成能量消耗背景，但具体趋势由电流增加直接触发。特定电流区间保持电场强度不变，再对应电弧静特性为平特性。埋弧焊、焊条电弧焊和大电流TIG焊是三个独立示例，分别输出，不能用加号伪装共同方法。
    output: |-
