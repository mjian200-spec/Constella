    construction_rationale: 阴极压降区存在是整条机理的共同场景，包中其他远距条件不参与当前链。正离子先受电场加速、动能增加，到达阴极后再转为热能，随后加强阴极加热和热发射，最终提供足量电子。每个中间状态都是下一关系的直接输入，不能压成一个长跳跃规则。
    output: |-
      规则组1
      C: 焊接电弧|存在阴极压降区
      R: 正离子|通过阴极区 —[受到]→ 电场加速|加速
      R: 电场加速|作用 —[增加]→ 正离子动能|增加
      R: 正离子|到达阴极 —[转换]→ 热能|由动能转换
      R: 热能|增加 —[加强]→ 阴极加热作用|增强
      R: 阴极加热作用|增强 —[增强]→ 阴极热发射|增强
      R: 阴极热发射|增强 —[提供]→ 阴极区电子数量|足够

  - id: context_000091
    difficulty_tags: [能量去向, 固定条件, 不制造直接利用]
    construction_rationale: 一般电弧焊是第一组共同场景，弧柱热量不能直接加热与少量辐射传热是两个独立事实。第二组只有在电流较大且产生等离子流时成立，等离子流把弧柱热量带到焊件，再增加焊件热量。括号中的流向用于说明作用方向，不另生成无必要规则。
    output: |-
      规则组1
      C: 焊接过程|一般电弧焊
      R: 弧柱热量|存在 —[不能直接用于]→ 焊条、焊丝及母材|加热
      R: 弧柱热量|少量 —[通过辐射传递]→ 焊条、焊丝及焊件|接收热量
      规则组2
      C: 焊接过程|一般电弧焊 + 焊接电流|较大 + 等离子流|产生
      R: 等离子流|由焊接电极端流向焊件 —[携带]→ 弧柱热量|一部分
      R: 弧柱热量|由等离子流带到焊件 —[增加]→ 焊件热量|增加

  - id: context_000922
    difficulty_tags: [公式抽取, 比例趋势, 角度变量]
    construction_rationale: 资源文字化给出圆锥电弧中A点压力完整公式，因此公式放在箭头中，左右两端保留适用对象和计算结果。正文另外明确电流平方正比、L平方反比及角度影响，分别生成趋势规则；不从等压力曲线图片推导额外数值，也不把绘图动作当领域规则。
    output: |-
      规则组1
      C: 电弧形状|圆锥体
      R: 电弧任意点A|压力p —[$p=\frac{2I^2}{\pi L^2(1-\cos\theta)^2}\lg\frac{\cos(\varphi/2)}{\cos(\theta/2)}$]→ 压力值|计算结果
      规则组2
      C: 无
      R: 焊接电流平方|增大 —[使]→ A点电磁压力|成正比增大
      R: L平方|增大 —[使]→ A点电磁压力|成反比减小
      R: θ角|变化 —[影响]→ A点电磁压力|变化
      R: φ角|变化 —[影响]→ A点电磁压力|变化

