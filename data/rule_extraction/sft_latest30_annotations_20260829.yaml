      R: 电源电压|过零时施加脉冲电压 —[提高]→ 电弧再引燃能力|提高
      R: 焊接电流|小 —[可采用]→ 稳弧措施|施加电流脉冲
      R: 电流脉冲|施加 + 电压脉冲|施加 —[获得]→ 电弧再引燃效果|更好
