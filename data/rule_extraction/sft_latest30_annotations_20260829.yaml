    output: |-
      规则组1
      C: 焊接方法|气体保护焊
      R: 坡口截面积|减小 —[减少]→ 焊条药皮浪费|减少
      R: 坡口截面积|减小 —[减少]→ 焊条头浪费|减少
      R: CO2焊|耗电量 —[仅为]→ 焊条电弧焊|耗电量的34.6%
      R: 生产效率|高 —[缩短]→ 焊接时间|缩短
