      C: 电弧能量损耗|存在周边散热、金属蒸气及等离子流附加损耗
      R: 焊接电流|增加 —[使]→ 能量消耗|增加
      R: 焊接电流|处于特定区间 —[保持]→ 电弧电场强度|不变
      R: 电弧电场强度|不变 —[对应]→ 电弧静特性|平特性
      R: 焊接方法|埋弧焊 —[具有]→ 电弧静特性|平特性
      R: 焊接方法|焊条电弧焊 —[具有]→ 电弧静特性|平特性
      R: 焊接方法|大电流TIG焊 —[具有]→ 电弧静特性|平特性

  - id: context_001058
    difficulty_tags: [热惯性, 非单值关系, 同属性比较]
    construction_rationale: 直流脉动电流是所有结论的共同场景。伏安特性近似电阻特性与热惯性导致非单值是两个事实；上升和下降过程的电压差应直接写成同属性比较，而不是再生成“上升导致较高、下降导致较低”两条重复规则。图中实验参数仅核对曲线，不扩大一般结论作用域。
    output: |-
      规则组1
      C: 焊接电流类型|直流脉动
      R: 电弧伏安特性|变化 —[近似]→ 电阻特性|近似
      R: 等离子体热惯性|存在 —[使]→ 电弧动伏安特性|非单值对应
      R: 焊接电流上升过程|电弧电压 —[高于]→ 焊接电流下降过程|电弧电压

  - id: context_000924
    difficulty_tags: [原理定义, 公式备选, 共同约束]
    construction_rationale: 最小电压原理先作为最小能量消耗特性的定义表达。给定电流、边界条件和稳定燃烧共同限定后续公式。弧柱半径R与温度T是使E取最小值的两种调节变量，当前DSL没有OR，因此把两个偏导为零的条件拆成两条公式规则，避免把R和T错误写成同时必需。
    output: |-
      规则组1
      C: 无
      R: 最小电压原理|电弧特性 —[表征]→ 电弧能量消耗|最小
      规则组2
      C: 焊接电流|给定 + 边界条件|一定 + 电弧|稳定燃烧
      R: 弧柱半径R|取稳定值 —[$\frac{\partial E}{\partial R}=0$]→ 弧柱电场强度E|最小
      R: 弧柱温度T|取稳定值 —[$\frac{\partial E}{\partial T}=0$]→ 弧柱电场强度E|最小

  - id: context_000151
    difficulty_tags: [共同原因, 数值属性, 截断防推断]
    construction_rationale: 阴极斑点高电流密度和冷阴极压降高由“同时”共同导致正离子高速撞击，二者放在同一R左侧。10^6~10^8A/cm²必须绑定电流密度属性。正文最后只说“积聚很高”便截断，无法确认对象是温度、热量还是能量，因此金标在撞击事实处停止。
    output: |-
      规则组1
      C: 无
      R: 阴极斑点|存在 —[对应]→ 电流密度|10^6~10^8A/cm²
      R: 阴极斑点电流密度|很高 + 冷阴极压降|很高 —[使]→ 正离子|高速撞击阴极斑点表面

  - id: context_000171
    difficulty_tags: [保护气体配比, 渗碳链, 不使用远距条件]
    construction_rationale: 核心正文只闭合了不锈钢使用Ar+CO2 5%的作用，以及CO2过多引起渗碳和耐蚀性下降。最新模型输出混入了不在核心句中的Ar+O2规则，本金标不采用。气体配比作为一种完整成分保留，渗碳与抗腐蚀性下降按相邻因果链输出。
    output: |-
      规则组1
      C: 焊接对象|不锈钢
      R: 保护气体成分|Ar+CO2 5%体积分数 —[达到]→ 保护效果|加入O2的效果
      R: 保护气体中CO2含量|较多 —[引起]→ 焊缝金属|渗碳
      R: 焊缝金属|渗碳 —[降低]→ 抗腐蚀性|降低

  - id: context_000181
    difficulty_tags: [磁场均匀性, 定义, 空间方向链]
    construction_rationale: 磁场强度均匀和磁力线沿轴线均匀共同保证电弧轴向对称。均匀性破坏、四周受力不均和偏向一侧保留连续因果链，再单独给出磁偏吹定义。磁力线密集处产生推力并把电弧推向稀疏处是空间方向关系，图像只核对左右受力，不引入图中单次示例数值。
    output: |-
      规则组1
      C: 焊接对象|电弧
      R: 电弧周围磁场强度|均匀 + 磁力线分布|沿电弧轴线均匀 —[保持]→ 电弧位置|轴向对称
      R: 磁力线分布均匀性|破坏 —[使]→ 电弧四周受力|不均匀
      R: 电弧四周受力|不均匀 —[使]→ 电弧|偏向一侧
      R: 自身磁场不对称导致电弧偏离焊条轴线|发生 —[定义为]→ 现象|磁偏吹
      R: 空间磁力线|密集 —[产生]→ 电弧推力|增大
      R: 电弧推力|来自磁力线密集处 —[推向]→ 空间磁力线|稀疏处

  - id: context_001668
    difficulty_tags: [速度分量, 螺旋运动, 单调趋势]
    construction_rationale: 外加纵向磁场和电弧带电粒子构成共享场景。vz与vy两个速度分量共同决定以r为半径的螺旋路线，该路线在纵向磁场中沿磁力线方向运动。最后保留磁场强度越大、螺旋半径越小的反向趋势，不把速度分量分别误写成两个独立充分原因。
    output: |-
      规则组1
      C: 外加磁场方向|纵向 + 作用对象|电弧中带电粒子
      R: 运动速度分量|vz + 运动速度分量|vy —[形成]→ 实际运动路线|以r为半径的螺旋线
      R: 实际运动路线|螺旋线 —[沿着]→ 磁力线方向|螺旋运动
      R: 外加磁场强度|越大 —[使]→ 螺旋运动半径|越小

  - id: context_001676
    difficulty_tags: [过渡转换, 阶跃变化, 正比趋势]
    construction_rationale: 本段没有需要共享的材料条件，直接提取过渡形式和电流关系。大滴向喷射转变时熔化速度出现阶跃，正文进一步明确喷射过渡下速度明显降低，两者均保留。焊丝熔化速度与焊接电流成正比，应以电流变化为输入、熔化速度变化为结果，避免反向表述。
    output: |-
      规则组1
      C: 无
      R: 熔滴过渡形式|由大滴过渡转为喷射过渡 —[使]→ 焊丝熔化速度|出现阶跃
      R: 熔滴过渡形式|喷射过渡 —[对应]→ 焊丝熔化速度|明显降低
      R: 焊接电流|变化 —[使]→ 焊丝熔化速度|成正比变化

  - id: context_001689
    difficulty_tags: [分类定义, 通电状态, 互斥类型]
    construction_rationale: 接触过渡先按熔滴接触熔池表面的行为定义，再以液体金属小桥是否通电作为分类依据。短路过渡和搭桥过渡互斥，分别用通电与不通电两条R表达，不使用加号或含“或”的状态。章节范围足以限定熔滴过渡，无需额外制造过程入口规则。
    output: |-
      规则组1
      C: 无
      R: 熔滴过渡形式|接触过渡 —[定义为]→ 焊丝端头熔滴|接触熔池表面后过渡
      R: 液体金属小桥|通焊接电流 —[对应]→ 熔滴过渡形式|短路过渡
      R: 液体金属小桥|不通电 —[对应]→ 熔滴过渡形式|搭桥过渡

  - id: context_001694
    difficulty_tags: [公式结果偏差, 共同材料属性, 排除支撑扩写]
    construction_rationale: 液体金属总有一部分留在焊丝端头，因此实际熔滴尺寸与式(3-13)计算值略有不同，这是闭合因果。焊丝直径相同是比较熔滴形态的共同条件，表面张力系数和密度均不同共同导致形态不同。最新规则包混入其他段落的重力结论，本样本不采纳。
    output: |-
      规则组1
      C: 无
      R: 液体金属|部分保留在焊丝端头 —[使]→ 实际熔滴尺寸|与式(3-13)计算结果略有不同
      规则组2
      C: 焊丝直径|相同
      R: 表面张力系数|不同 + 液体金属密度|不同 —[使]→ 熔滴脱离前形态|不同

  - id: context_000233
    difficulty_tags: [临界电流, 比例趋势, 机理链]
    construction_rationale: 射流过渡是整段共同范围。焊丝直径增大既直接对应临界电流按比例增加，也先使端头熔滴增大；大熔滴要求弧根扩大和弧柱扩张，两项由原文共同要求更大能量，再提高临界电流。图中散点只验证正比例趋势，不把近似点值转成标准规则。
    output: |-
      规则组1
      C: 熔滴过渡形式|射流过渡
      R: 焊丝直径|增大 —[使]→ 射流过渡临界电流|成比例增加
      R: 焊丝直径|越大 —[使]→ 焊丝端头熔滴|越大
      R: 焊丝端头熔滴|增大 —[要求]→ 弧根面积|扩大
