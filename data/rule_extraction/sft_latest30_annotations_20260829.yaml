    output: |-
      规则组1
      C: 回路温度|室温 + 回路开关S|合上瞬间
      R: 电源电压E|存在 —[使]→ 回路及气体空间电流|微弱
      规则组2
      C: 无
      R: 电流流动|持续 —[要求]→ 气体空间导电性能|提高
      R: 电流流动|持续 —[要求]→ 带电粒子数量|增加
      R: 电源电场强度|达到5×10^5V/m —[使]→ 新带电粒子|迅速大量生成
      R: 新带电粒子|迅速大量生成 —[破坏]→ 气体绝缘|破坏
      R: 气体绝缘|破坏 —[形成]→ 带电粒子流动|连续
