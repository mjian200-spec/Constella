    difficulty_tags: [表格语义, 共同脉冲, 最小电流]
    construction_rationale: 正文先给交流TIG焊铝的三种稳弧选择，其中电流脉冲和电压脉冲由“同时”证明为共同输入。表格四行另组，除共享交流TIG焊铝场景外，还采用表题明确给出的双逆变式方波交流弧焊机约束，避免把最小电流数值推广到所有设备。
