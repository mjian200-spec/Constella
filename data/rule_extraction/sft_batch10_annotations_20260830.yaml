      C: 焊丝种类|实心焊丝
      R: 保护气体|Ar —[对应]→ 焊接方法|MIG焊
      R: 保护气体|He —[对应]→ 焊接方法|MIG焊
      R: 保护气体|富Ar混合气体 —[对应]→ 焊接方法|MAG焊
      R: 保护气体|CO2 —[对应]→ 焊接方法|CO2焊
      R: 保护气体|CO2 + O2混合气体 —[对应]→ 焊接方法|CO2焊
