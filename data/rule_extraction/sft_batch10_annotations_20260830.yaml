      R: 焊枪|相对管壁基本垂直 —[对应]→ 焊枪倾角|85°~90°

  - id: context_002226
    difficulty_tags: [焊法分类, 互斥气体, 多分支映射]
    construction_rationale: 焊丝种类和保护气体共同确定焊法名称。Ar与He、CO2与CO2+O2分别是备选气体，不能用加号表示同时成立，故拆成独立映射；混合气体内部的加号仍表示真实成分。药芯焊丝的有气和无气分支也分别保留。
    output: |-
