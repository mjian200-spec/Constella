    difficulty_tags: [方法优缺点, 应用限制, 参数分支]
    construction_rationale: 核心和相邻支撑共同说明连续直流、短路、射流与脉冲四类方案。优点不应被错误写成造成窄电流区的原因；窄区间才导致难可靠使用。短路和射流的限制分开，脉冲最小电流按一般与逆变特殊需求分组。
