      R: 外加保护气体|无 —[对应]→ 焊接方法|自保护药芯焊丝电弧焊

  - id: context_002275
    difficulty_tags: [形态效果, 电源约束, 问句越界]
    construction_rationale: 亚射流过渡是标题和紧邻正文共同确定的场景。半潜状电弧分别提高熔化系数并形成盆底状熔深；恒流源使熔深均匀。段末提出弧长如何调节但尚未回答，因此不能从问句生成固有调节机制规则。
    output: |-
      规则组1
      C: 熔滴过渡形式|亚射流过渡
      R: 电弧形态|半潜状 —[提高]→ 焊丝熔化系数|提高
      R: 电弧形态|半潜状 —[形成]→ 焊缝熔深形状|盆底状
      R: 电源类型|恒流源 —[使]→ 熔深均匀性|均匀

  - id: context_002280
    difficulty_tags: [固有调节, 并行原因, 趋势链]
    construction_rationale: 铝焊丝是共同对象。电弧和焊丝端头潜入熔池与电磁轴向压力是形成凹坑的两项原文原因，分别输出，避免伪造先后依赖；电流增大使电磁力增大，继而使潜入更深，按因果链保存便于图中复用中间状态。
