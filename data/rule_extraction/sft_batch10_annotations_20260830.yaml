annotations:
  - id: context_001012
    difficulty_tags: [公式等价, 符号绑定, 截断条件]
    construction_rationale: 式（3）是把前两式代入后得到的具体等价结果，公式本身必须放在箭头中，输入端绑定质量和碰前速度，输出端绑定动能变化量。符号下标虽暗示x方向，但原文没有把方向写成适用约束，因此C为空；后续特殊质量条件没有结果，也不制造规则。
    output: |-
      规则组1
      C: 无
      R: 粒子参数|m_1、m_2、u_{1x}、u_{2x} —[$\Delta E_k=\frac{m_1m_2(u_{1x}-u_{2x})^2}{2(m_1+m_2)}$]→ 碰撞动能变化量|ΔE_k

  - id: context_001675
    difficulty_tags: [极性分支, 影响强弱, 截断删除]
    construction_rationale: 保护介质影响熔化速度是总关系，CO2混合比在DCEP和DCEN下表现不同，必须按极性分组。DCEP只说明影响很小，DCEN只说明影响复杂；正文在下一具体比例处截断，不能补写比例增加后的方向或阈值。
    output: |-
      规则组1
      C: 无
      R: 保护介质|变化 —[影响]→ 焊丝熔化速度|变化
      规则组2
      C: 焊接极性|DCEP
      R: CO2混合比|变化 —[影响]→ 焊丝熔化速度|很小
      规则组3
      C: 焊接极性|DCEN
      R: CO2混合比|变化 —[影响]→ 焊丝熔化速度|十分复杂

  - id: context_001680
    difficulty_tags: [材料表面, 因果链, 多属性影响]
    construction_rationale: 一般关系中，焊丝材料和表面状态是两个独立影响源。具体活化涂层场景下，Ca、Cs等元素使逸出功降低，继而对应更低的阴极压降并使阴极产热下降；按原文顺序保留因果链，不把所有结果压成一个宽泛状态。
    output: |-
      规则组1
      C: 无
      R: 焊丝材料|变化 —[影响]→ 阴极压降|变化
      R: 焊丝材料|变化 —[影响]→ 逸出功|变化
      R: 焊丝表面状态|变化 —[影响]→ 阴极压降|变化
      R: 焊丝表面状态|变化 —[影响]→ 逸出功|变化
      规则组2
      C: 焊丝表面|涂有Ca、Cs等活化物质
      R: 活化物质涂层|存在 —[使]→ 逸出功|较低
      R: 逸出功|较低 —[对应]→ 阴极压降|更低
      R: 阴极压降|更低 —[使]→ 阴极产热|下降

  - id: context_001684
    difficulty_tags: [公式定义, 单位绑定, 越界控制]
    construction_rationale: 核心只完成熔化系数的定义和单位说明，输入端应列出公式变量，公式置于箭头，输出为αm。单位另作属性关系，避免把g/A·min当成裸对象。支撑段虽然解释物理意义和后续影响，但本样本聚焦当前核心，不扩展到后续材料实例。
    output: |-
      规则组1
      C: 无
      R: 焊丝熔化参数|U_m、I_a、R_s、c、T_f、H、J —[$\alpha_m=\frac{U_m+I_aR_s}{(cT_f+H)J}$]→ 熔化系数|α_m
      R: 熔化系数|α_m —[采用单位]→ 熔化系数单位|g/(A·min)

  - id: context_001698
    difficulty_tags: [空间形态, 力学链, 平方比例, 截断删除]
    construction_rationale: 长弧且未短路是整组共同场景。底部电弧形态使电流向下扩展，产生向内和向下的电磁力，其中向下分力促进脱滴。末句虽截断，但“电磁收缩力与电流平方成比例”本身已闭合，可保留比例关系而不续写缺失文字。
    output: |-
      规则组1
      C: 电弧|较长 + 熔滴|未与熔池液面短路
      R: 熔滴底部电弧形态|形成 —[使]→ 熔滴内电流分布|向下方扩展
      R: 熔滴内电流分布|向下方扩展 —[使]→ 电磁力方向|指向内侧和下方
      R: 电磁力|向下分力 —[促进]→ 熔滴|从焊丝端部脱离
      R: 焊接电流平方|增大 —[成比例增大]→ 电磁收缩力|增大

  - id: context_001702
    difficulty_tags: [力的来源, 因果链, 越界删除]
    construction_rationale: 当前段只讨论等离子气流促进熔滴脱落的机制。弧柱电磁压力差产生等离子气流，气流对熔滴形成摩擦力并促进脱落；等离子气流力还被归为电磁力的一部分。后续爆炸力属于另一小节，不能混入本组。
    output: |-
      规则组1
      C: 熔滴|从焊丝端部脱落过渡
      R: 电弧弧柱电磁压力|存在差值 —[产生]→ 等离子气流|形成
      R: 等离子气流|作用于熔滴 —[产生]→ 熔滴摩擦力|形成
      R: 熔滴摩擦力|作用 —[促进]→ 熔滴|从焊丝端部脱落
      R: 等离子气流力|作用 —[属于]→ 电磁力|一部分

  - id: context_001715
    difficulty_tags: [共同解释, 阈值, 表面张力]
    construction_rationale: 射流过渡是由标题及紧邻总结明确限定的场景。表面张力本来阻碍熔滴过渡；高温使表面张力系数略低，长径比超过3~5又使液柱失稳，两项共同解释阻碍作用较小。只有原文明示“两个因素”时才使用加号表示共同解释。
    output: |-
      规则组1
      C: 熔滴过渡形式|射流过渡
      R: 表面张力|作用 —[阻碍]→ 熔滴过渡|进行
      R: 铅笔尖液柱温度|很高 —[使]→ 表面张力系数|略低
      R: 液柱长径比L/d|大于3~5 —[使]→ 液柱|失稳
      R: 表面张力系数|略低 + 液柱|失稳 —[共同使]→ 表面张力阻碍作用|较小

  - id: context_002202
    difficulty_tags: [备选运弧, 位置分段, 支撑补全]
    construction_rationale: 直线形和小月牙形是根据根部间隙二选一的运弧方式，当前DSL尚不引入OR，因此拆成两条可选方法，并分别关联相同目的。三个钟点区间对应各自倾角，最后区间由紧邻支撑正文完整补足，不把三个区间用加号合并。
    output: |-
      规则组1
      C: 焊接工序|根焊
      R: 运弧方式|直线形 —[可根据根部间隙选用以保证]→ 坡口两侧熔合|良好
      R: 运弧方式|小月牙形摆动 —[可根据根部间隙选用以保证]→ 坡口两侧熔合|良好
      规则组2
      C: 焊接工序|根焊 + 管周位置|12点~2点
      R: 焊枪|相对管切线倾斜 —[对应]→ 焊枪倾角|65°~70°
