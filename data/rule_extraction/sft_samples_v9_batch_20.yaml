      : \"unit_000675\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000654; type=passage; page=54]\n  （3）电极（焊丝）直径\
      \ 焊丝直径越细，电流密度越大，电磁力越大，同时电弧呈现锥形越明显，等离子流力增大，使电弧的总压力增加。电弧在短弧长时，电极直径对电弧力的影响明显。（4）电极（焊丝）极性 电极（焊丝）极性对电弧力有很大的影响。对钨极氩弧焊（TIG焊），钨极接负极时允许流过较大的电流，阴极区收缩的程度大，将形成锥度较大的锥形电弧，产生的轴向推力大，电弧压力也大。反之，钨极接正极则形成较小的电弧压力，一是需要使用较粗的钨极，同时电弧在钨极上的覆\n\
      - [constraint_000113] 焊丝: 焊丝接负极\n  来源 Unit: unit_000658\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\":\
      \ \"unit_000658\", \"end_unit_id\": \"unit_000675\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_000658;\
      \ type=passage; page=55]\n  对于熔化极气体保护电弧焊（MIG焊），当焊丝接负极时，熔滴受到正离子的冲击，受到排斥作用。同时阴极斑点不稳定，不断地沿焊丝上爬和下滑，扩大了阴极表面积，使之难以形成较大的电磁力和等离子流力，因此电弧力小。在焊丝接正极时，所受到的斑点力小，容易形成细小的熔滴，有较大的电磁力和等离子流力，电弧力较大，如图2-37所示。\n\
