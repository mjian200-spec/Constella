      \n核心正文:\n[unit_000643; type=passage; page=53]\n重量为几十毫克。这些细颗粒在等离子流力的作用下，以很高的加速度（可达重力加速度的50倍以上）冲向熔池，到达熔池时其速度可达每秒几百米的数量级，这些细颗粒熔滴带有很大的动能，再加上电磁压力及等离子流力的作用，使焊缝极易形成指状的熔深（见图2-31）。\n\
