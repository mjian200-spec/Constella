      \ $60\\mathrm{Hz}$ 的交流电弧，随着焊接电流的增大，它的再引燃电压数值有所下降，但焊接电流为60A时，它的再引燃电压还维持在较高的数值。而对 $3000\\mathrm{Hz}$ 的高频交流电弧，它的再引燃电压数值可以近似看做一个固定的数值，焊铝时当焊接电流达到60A时，它的再引燃电压数值在150V以上。\n\
