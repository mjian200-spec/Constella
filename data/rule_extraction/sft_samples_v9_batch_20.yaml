      \n[unit_000675; type=figure; page=57]\n题注: 图2-42 电弧力随电流频率的变化\n原始文字:\n图2-42 电弧力随电流频率的变化\n资源标题: 图2-42 电弧力随电流频率的变化\n资源描述:\
