      \ type=passage; page=36]\n  压降。阴极附近的区域为阴极区，其电压称为阴极电压降。中间部分为弧柱区，其电压称为弧柱电压降。阳极区和阴极区在电弧长度方向的尺寸都很小，约为 $10^{-4}$ 和 $10^{-6}\\\
      mathrm{cm}$ 。在电弧长度变化时几乎不发生变化，但电压降值很高，在电弧总体电压降中占有相当大的比例，所以电场强度很高。而弧柱区的长度几乎等于电弧总长度，电压降沿弧长方向呈线性变化，其电场强度较低。之所以如此，是由于这些区域导电机构不同所决定的，电弧电压\
      \ $U_{\\mathrm{a}}$ 是上述各电压降之和。即\n\n核心正文:\n[unit_000450; type=passage; page=37]\n由于弧柱的上述性质决定了弧柱导电的电压降较低。弧柱导电性能的好坏，直接表现在弧柱导电时所要求的电场强度大小，它与电弧空间气体成分和电流大小有着密切的关系。几种气体的弧柱电场强度与电流的关系如图2-13所示。由图中可知，在较小电流区间，电场强度随电流的增加而减小。在较大电流区间，电场强度随电流的增加而增加。电弧电场强度与气体种类的关系，不仅与气体的电离度有关，而且还决定于气体的其他物理性质。\n\
      \n支撑内容:\n[unit_000193; type=title; page=18]\n2.1.2 带电粒子的产生和消失\n\n资源文字化:\n[unit_000455; type=figure; page=38]\n题注: 图2-13\
      \ 弧柱电场强度与气体种类和电流的关系\n原始文字:\n图2-13 弧柱电场强度与气体种类和电流的关系\n资源标题: 弧柱电场强度与气体种类和电流的关系\n资源描述: 这是一张双对数坐标图，展示了弧柱电场强度 $E$ 与电流 $I$\
