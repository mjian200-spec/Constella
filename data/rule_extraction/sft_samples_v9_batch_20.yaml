      \n上排左侧图显示电流波形：电流在100A和200A之间呈方波跳变，高电平持续时间为5ms。\n上排右侧图显示对应的电流波形：电流呈正弦波变化，峰值约为200A，谷值约为100A，半个周期（峰值到谷值）的时间跨度标注为5ms。\n\n\
