      end_unit_id\": \"unit_001312\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_001229; type=passage; page=108]\n\
      \  射滴过渡是一种稳定的熔滴过渡形式，研究射滴过渡的有关规律是十分必要的。射滴过渡时熔滴过渡频率与焊接电流的关系如图3-23所示。可见，铝合金氩弧焊、钢焊丝MAG焊和 $\\mathrm{CO}_{2}$ 焊等均有射滴过渡形式。还可看到射滴过渡时熔滴过渡频率都随焊接电流的增加而增加，而熔滴尺寸却减小。从图3-23b可以看到射滴过渡是介于小电流的粗滴过渡（也称大滴过渡）和大电流的射流过渡之间的一种转变形式。钢焊丝MAG焊时，存在着一个稳定的射滴过渡区间，可是在钢焊丝MIG焊时，该电流区间却十分窄，所以国际焊接学会（IIW）的文件曾有钢焊丝不存在射滴过渡之说。对于铝合金氩弧焊和钢焊丝\
      \ $\\mathrm{CO}_{2}$ 焊的稳定自由过渡形式只有射滴过渡。在正常参数下难以形成射流过渡。这里所说的钢焊丝 $\\mathrm{CO}_{2}$ 焊就是通常所说的 $\\mathrm{CO}_{2}$ 焊喷射过渡。\n\
      - [constraint_000261] 电流: 260A附近\n  来源 Unit: unit_001245\n  作用域: {\"scope_type\": \"unit_range\", \"start_unit_id\"\
      : \"unit_001245\", \"end_unit_id\": \"unit_001311\", \"target_unit_ids\": [], \"candidate_ranges\": []}\n  [unit_001245;\
      \ type=passage; page=110]\n  焊接电流较小时，熔滴过渡形式为大（粗）滴过渡和射滴过渡，当焊接电流增加到某值后，熔滴过渡突然发生了明显的变化，焊接过程也变得十分稳定，这时的电流称为射流过渡的临界焊接电流。例如直径为\
      \ $\\phi 1.6\\mathrm{mm}$ 的低碳钢焊丝，在 $\\mathrm{Ar} + \\mathrm{O}_21\\%$ （体积分数）的保护气体中，采用直流反接法焊接时的熔滴过渡特点如图3-26所示。在电流较小时为大滴过渡，但随着电流增加，熔滴体积略有减小，而每秒过渡的熔滴数却变化不大。当电流增加到260A附近，却发生了急剧的变化，熔滴过渡频率由255A时的15滴/s变到265A时的240滴/s。而熔滴尺寸由\
      \ $\\phi 4\\mathrm{mm}$ 变到 $\\phi 1\\mathrm{mm}$ 。当焊接电流超过265A后，进一步增加电流时，熔滴过渡频率增加较慢。265A即为射流过渡临界电流。在MIG焊时，由于射滴过渡区间很窄，所以有人取射滴过渡的平均值（此处为260A）作为射流过渡临界电流值。\n\
