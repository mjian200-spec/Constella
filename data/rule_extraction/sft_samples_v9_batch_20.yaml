      \ page=209]\n  预热焊丝用的电源可以是直流电源也可以是交流电源，由于流过焊丝的电流所产生的磁场影响，电弧会产生磁偏吹，在这种情况下，当加热电流不超过焊接电流的 $60\\%$ ，电弧摆动幅度被限制在 $30^{\\circ}$\
