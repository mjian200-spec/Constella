      题注: \n原始文字:\n$$\\frac {U _ {\\mathrm {j}}}{L _ {\\mathrm {j}}} \\geqslant E \\tag {3-17}$$\n公式摘要: 缩颈液体金属上的电压降与缩颈长度的比值大于或等于弧柱的电场强度\n\
