    difficulty_tags: [多材料比较, 温度推断, 烧损原因]
    construction_rationale: TIG钨极场景下，以ThO2(2%)-W为共同比较基准，三种掺杂钨极温度分别较低。实测阴极附近温度趋势用于推断工作部位同样较低；不同工作温度被认为造成各电极熔化烧损差异。不能把“温度低”直接写成烧损一定减少，因为原文只说存在差异。
    output: |-
      规则组1
      C: 焊接方法|TIG焊
      R: La2O3(2%)-W电极|温度 —[低于]→ ThO2(2%)-W电极|温度
      R: Y2O3(2%)-W电极|温度 —[低于]→ ThO2(2%)-W电极|温度
      R: CeO2(1%)-W电极|温度 —[低于]→ ThO2(2%)-W电极|温度
      R: 阴极附近电极温度|较低 —[可推断]→ 阴极工作部位温度|同样较低
      R: 阴极工作部位温度|存在差异 —[被认为造成]→ 电极熔化烧损|存在差异

  - id: context_001903
    difficulty_tags: [非线性电阻, 再引燃瞬时, 波形, 截断句]
    construction_rationale: 铝合金交流TIG是共同场景。电弧作为非线性电阻，其电压波形与正弦波差异很大；再引燃瞬时电流很小、电压较高是两个并列状态，共同形成图示电压波形。末尾电源句截断，不补写电源电压或外特性关系。
    output: |-
      规则组1
      C: 焊接方法|交流TIG焊 + 焊接对象|铝合金
      R: 电弧|电阻特性 —[对应]→ 电阻类型|非线性电阻
      R: 电弧|非线性电阻 —[使]→ 电弧电压波形|与正弦波差异很大
      R: 电弧再引燃瞬时|焊接电流很小 + 电弧再引燃瞬时|电弧电压较高 —[形成]→ 电弧电压波形|典型再引燃波形

  - id: context_002006
    difficulty_tags: [脱氧产物, 多属性共同上浮, OCR校正, 截断开头]
    construction_rationale: 开头SiO2结论残缺，删除。MnO高密度导致不易上浮并形成夹渣；区域Ⅱ的FeO-MnO-SiO2溶液由低熔点、小密度、流动性好、易凝聚四项共同促使上浮，继而有利于纯净焊缝。1270%的OCR按熔点属性校正为1270℃。
    output: |-
      规则组1
      C: 焊接方法|CO2气体保护焊 + 脱氧生成物|MnO
      R: MnO|密度约5.11g/cm³ —[使]→ MnO上浮难易|不容易浮出熔池
      R: MnO|不容易浮出熔池 —[形成]→ 焊缝缺陷|夹渣
      规则组2
      C: 焊接方法|CO2气体保护焊 + 生成区域|区域Ⅱ
      R: FeO-MnO-SiO2溶液|熔点约1270℃ + FeO-MnO-SiO2溶液|密度3.6g/cm³ + FeO-MnO-SiO2溶液|流动性好 + FeO-MnO-SiO2溶液|容易凝聚 —[使]→ 脱氧生成物|容易浮出熔池表面
      R: 脱氧生成物|容易浮出熔池表面 —[有利于]→ 焊缝纯净度|提高

  - id: context_002018
    difficulty_tags: [气瓶储存, 测量方法, 压力机理, 温度映射]
    construction_rationale: 焊接CO2液态储存在气瓶中，数量只能称重，不能由压力测定。瓶内同时有液相和气相，压力是气态CO2饱和蒸气压而非液态数量，并随环境温度变化；0~20℃对应5~7MPa。气瓶颜色和标记是标识事实，不影响数量关系，可不抽取。
    output: |-
      规则组1
      C: 保护气体|焊接用CO2 + 储存方式|液态储存于气瓶
      R: 气瓶内CO2数量|测定 —[应采用]→ 测定方法|称重法
      R: 气瓶内CO2数量|测定 —[不能采用]→ 测定方法|气瓶压力法
      R: 气瓶内气体压力|大小 —[不能表征]→ 液态CO2数量|多少
      R: 气瓶内|同时存在液态与气态CO2 —[使]→ 瓶内气体压力|气态CO2饱和蒸气压
      R: 环境温度|变化 —[影响]→ 气态CO2饱和蒸气压|变化
      R: 环境温度|0~20℃ —[对应]→ 气瓶压力|5~7MPa

  - id: context_002023
    difficulty_tags: [焊丝共性, 成分比较, 力学性能比较]
    construction_rationale: ER49-1和ER50-6是我国主要CO2焊丝，共同具有工艺好、飞溅小、抗孔好和力学性能达标。ER50-6的Mn、Si稍低于ER49-1，但两者焊缝强度相当，ER50-6塑性与韧性更好。比较均保持同属性两端，不把两种焊丝合成一个实体用于比较。
    output: |-
