      R: 焊接工艺|实施 —[对应]→ 低频脉冲频率|5Hz
      R: 焊接工艺|实施 —[对应]→ 焊接速度|80cm/min
      R: 结构形式|由整体铸造改为焊接结构 —[获得]→ 焊缝成形|良好
      R: 结构形式|由整体铸造改为焊接结构 —[获得]→ 焊缝内部气孔|无
      R: 结构形式|由整体铸造改为焊接结构 —[降低]→ 生产成本|降低

