    construction_rationale: 双脉冲MIG焊汽车进气管是实例场景。法兰AC2C、管子A5052和2mm板厚共同限定四项参数，分别绑定电流、电压、低频和速度。由整体铸造改焊接结构后，良好成形、无内部气孔和成本降低是三个并列结果，图片只核对部件及焊接位置。
    output: |-
