  - id: context_001856
    difficulty_tags: [设备按钮时序, 引弧, 收弧, 延时通气]
    construction_rationale: TIG开始与结束操作分组。开始时按下按钮同时通气和加高频，高频引弧后自动停止，再释放开关开始焊接；结束时按按钮进入填坑，释放后进入延时通气。保持原文事件顺序，多个同步输出分别拆R，不将on/off状态误作约束。
    output: |-
      规则组1
      C: 焊接方法|TIG焊 + 操作阶段|开始
      R: 控制按钮|按下on —[接通]→ 保护气体|开始供气
      R: 控制按钮|按下on —[施加]→ 高频电压|开始
      R: 高频电压|施加 —[引燃]→ 电弧|引燃
      R: 电弧|引燃 —[使]→ 高频电压|自动停止
      R: 控制按钮|释放off —[开始]→ 焊接过程|开始
      规则组2
      C: 焊接方法|TIG焊 + 操作阶段|结束
      R: 控制按钮|再次按下on —[进入]→ 控制阶段|填充弧坑
      R: 控制按钮|再次释放off —[进入]→ 控制阶段|延时通气

