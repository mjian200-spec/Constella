        第5章 $\mathrm{CO}_{2}$ 气体保护焊 > 5.4 $\mathrm{CO}_{2}$ 焊的焊接工艺 > 5.4.2 $\mathrm{CO}_{2}$ 焊焊接参数的影响

        包约束候选（需按作用域筛选）:
        - [constraint_000656] 焊丝: 焊丝熔化速度不变
        - [constraint_000662] 间隙: $2\mathrm{mm}$ 以上时
        - [constraint_000663] explicit_condition: 平板堆焊
        - [constraint_000668] parameter: 250A以上
        - [constraint_000669] 焊接电流: 焊接电流在250A以上

        核心正文:
        [unit_003094; type=passage; page=291]
        焊接参数对焊缝成形的影响并不是孤立的，常常是相互影响的。如表5-28所示的焊缝成形照片，是在 $\phi1.2\mathrm{mm}$ 实心焊丝，纯 $\mathrm{CO}_{2}$ 气体保护和板厚为 $9\mathrm{mm}$ 的低碳钢板条件下，当保持焊接速度为 $0.4\mathrm{m/min}$ 不变时，只改变焊接电流与电弧电压时进行平板堆焊的焊缝成形。可以清楚地看到，随着焊接电流增加，在电弧电压适当匹配的情况下，焊缝的熔深、熔宽和余高都增大，当电弧电压增加时，在电流一定的条件下，焊缝的熔宽都明显增大，余高减小，熔深不定，也就是在某一电压时熔深最大，而电压过低或过高时，熔深均降低。

        支撑内容:
        [unit_003046; type=title; page=286]
        5.4.2 $\mathrm{CO}_{2}$ 焊焊接参数的影响

