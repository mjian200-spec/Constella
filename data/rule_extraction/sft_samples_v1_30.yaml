  - id: context_000017
    route: text
    difficulty_tags: [定义, 弹性碰撞, 非弹性碰撞, 阈值链]
    construction_rationale: |-
      先保留“碰撞传递”的定义，再按低动能弹性碰撞与高动能非弹性碰撞两条路径展开。弹性碰撞只改变速度和温度，不能产生激励或电离；非弹性碰撞则把动能转为内能。激励电压、电离电压是不同阈值，分别建R，并保留被激励粒子继续碰撞后的累积电离链。
    input:
      text: |-
        上下文包编号: context_000017

        标题路径:
        第2章 焊接电弧 > 2.1 电弧的物理基础 > 2.1.2 带电粒子的产生和消失

        包约束候选（需按作用域筛选）:
        - [constraint_000004] 电流: 低电压和大电流
        - [constraint_000006] 焊接电流: 焊接电流较小
        - [constraint_000007] 温度: 几万度时可以出现二次或三次电离
        - [constraint_000015] 电压: $7.9\mathrm{V}$

        核心正文:
        [unit_000215; type=passage; page=21]
        （1）碰撞传递 气体粒子在空间总是处于不规则的运动状态，只有在绝对零度（K）时，气体粒子才停止运动。各个粒子以某一速度运动时，具有一定的动能，而且可能互相频繁地碰撞，粒子在相互碰撞时将进行能量转移，以这种形式传递能量称为碰撞传递。气体粒子的相互碰撞可能有两种情况：非破坏性的弹性碰撞和破坏性的非弹性碰撞。弹性碰撞时气体粒子间只产生动能的传递和再分配，相互碰撞的两粒子动能之和基本不变，粒子的内部结构不发生任何变化，这种碰撞的结果只能使粒子的运动速度发生变化。因此，弹性碰撞只能引起粒子温度的变化，不能产生电离与激励过程。弹性碰撞是在气体粒子拥有的动能较低时产生的。当气体粒子拥有较大的动能时，则产生非弹性碰撞，使被碰撞的气体粒子内部结构发生变化，在碰撞时部分或全部动能转换为内能，如果此内能大于激励电压，则粒子被激励，如果此能量大于电离电压，则粒子将产生电离。被激励的粒子如果继续受到非弹性碰撞，内能积累达到电离电压时也将产生电离。只有非弹性碰撞才产生电离过程，为气体空间制造带电粒子。

        支撑内容:
        [unit_000193; type=title; page=18]
        2.1.2 带电粒子的产生和消失
      images: []
    output: |-
