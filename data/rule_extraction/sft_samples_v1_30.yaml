schema_version: 1
dataset: constella_rule_extraction_sft_sample_30
language: zh-CN
task: 从真实焊接文档上下文包抽取规则DSL
notes: |-
  本文件是首批30条人工标准答案样例，保留真实上下文包中的标题、约束候选、核心正文、支撑内容和多模态资源引用。
  input.text对应模型文本输入；input.images按顺序对应随消息传入的原始图片。
  output只包含目标DSL，不包含分析、审核意见或反思补丁。
source_issue_log:
  - context_id: context_000004
    issue: 原文“设备的逆变化”疑似OCR或原书用词异常；金标保留原文，不自行改成“逆变化”。
  - context_id: context_000022
    issue: 核心正文以“越大”开头，缺少前句主语；金标不抽取该残句。
  - context_id: context_000124
    issue: 核心正文以“可以看到，这两”截断；金标不补写后续结论。
  - context_id: context_000400
    issue: 核心正文以“目的之一”截断；金标只抽取此前已经闭合的命题。
  - context_id: context_000422
    issue: 核心正文以“可以不开坡口或”截断；金标不抽取未完成的坡口规则。
  - context_id: context_000074
    issue: 核心正文以“电子数量不足，必然”截断；金标不推断后续空间电荷结论。
  - context_id: context_000186
    issue: 平行电弧只说明随电流方向不同可能吸引或排斥，未给出方向到结果的具体映射；金标不抽取证据未闭合的平行电弧关系。
  - context_id: context_000357
    issue: 正文以“可以采用以下几种方法”结束，具体消除直流分量的方法缺失；金标只抽取必须限制或消除的要求。
  - context_id: context_000449
    issue: 正文以“脱氧能力按递减次序排”截断；金标不补写元素排序。
samples:
  - id: context_000126
    route: text+image
    difficulty_tags: [共同条件, 数值绑定, 图片核对]
    construction_rationale: |-
      先用标题和正文确定交流电弧、铝合金及极性转换的共同场景，再按两种稳弧方案划分命题。20A方案明确“不加电压脉冲”，三项需共同进入R左侧；15A方案由“同时”证明130V、300A和15A缺一不可。图片只核对波形及数值，不额外生成曲线规则。
    input:
      text: |-
        上下文包编号: context_000126

        标题路径:
        第2章 焊接电弧 > 2.3 交流电弧的特点 > 2.3.2 交流电弧动特性与电弧稳定性的关系

        包约束候选（需按作用域筛选）:
        - [constraint_000131] 材料: 一对热阴极材料（如钨极对钨极）的
        - [constraint_000133] 极性: 极性转换
        - [constraint_000139] explicit_condition: 埋弧焊
        - [constraint_000142] 焊接电流: 焊接电流过零

        核心正文:
        [unit_000726; type=passage; page=63]
        根据这一思路，如何提高在小电流时的电弧再引燃性能呢？北京工业大学提出了一种新方法，即在铝合金焊件由正极转为负极之前，先向电弧施加一个较大的电流脉冲，这将有利于再引燃电弧。如图2-51所示，在焊件由正极转为负极前在电流波形的后沿加一个电流脉冲，这时焊接电流仅为20A，即使不加电压稳弧脉冲，也可以得到稳定的焊接过程，如图2-52所示。同时施加电源电压脉冲（130V）和电流脉冲（300A），可以在更小的焊接电流（15A）下获得稳定的电弧再引燃过程

        支撑内容:
        [unit_000689; type=title; page=59]
        2.3.2 交流电弧动特性与电弧稳定性的关系
      images:
        - unit_id: unit_000730
          page: 63
          caption: 图2-51 单独施加脉冲电流稳弧的焊接电流和电弧电压波形（焊接电流为20A）
          path: /CODE/jm/Constella/GMAW/hybrid_ocr/images/8d7a3f503c5c41669256f28f5b5f815da84a740c5cdbf7173e6fa68aec59d112.jpg
        - unit_id: unit_000733
          page: 64
          caption: 图2-52 电流脉冲与电压脉冲同时施加的焊接电流和电弧电压波形（焊接电流为15A）
          path: /CODE/jm/Constella/GMAW/hybrid_ocr/images/05df1c3435a05dd70f2edc4cdb7526e87c6341f182b8efeed85463b69a6b8317.jpg
    output: |-
      规则组1
      C: 焊接对象|铝合金焊件 + 极性转换阶段|焊件由正极转为负极之前
      R: 电流脉冲|较大 —[有利于]→ 电弧再引燃性能|提高
      R: 电流脉冲|施加 + 焊接电流|20A + 电压稳弧脉冲|不施加 —[获得]→ 焊接过程|稳定
      R: 电源电压脉冲|130V + 电流脉冲|300A + 焊接电流|15A —[获得]→ 电弧再引燃过程|稳定

  - id: context_000539
    route: text+image
    difficulty_tags: [备选措施拆分, 因果链, 工艺阶段]
    construction_rationale: |-
      按短路小桥即将爆断、燃弧期间和燃弧后三个阶段分组。负脉冲与较低峰值电流由“或”连接，必须拆成两条备选R；燃弧能量的三种提高方式也分别表达。熔滴整形、柔顺接触及短路保持原有先后链，图示仅用于确认阶段，不逐点转录波形。
    input:
      text: |-
        上下文包编号: context_000539

        标题路径:
        第5章 $\mathrm{CO}_{2}$ 气体保护焊 > 5.3 $\mathrm{CO}_{2}$ 焊的熔滴过渡 > 5.3.2 $\mathrm{CO}_{2}$ 焊短路过渡的工艺特点与控制

        包约束候选（需按作用域筛选）:
        - [constraint_000545] 弧长: 该熔滴的悬挂长度时
        - [constraint_000559] 电弧电压: 最佳值在 $14\sim 18\mathrm{V}$ 的 $A$ 区中
        - [constraint_000565] 送丝速度: 一定值后开始稳定的短路过程
        - [constraint_000588] 电压: 电压变化率达到某一临界值
        - [constraint_000608] 焊接电流: 焊丝直径或焊接电流改变
        - [constraint_000609] 频率: $20\mathrm{kHz}$ 左右
        - [constraint_000610] 焊丝: 焊丝端头与熔池刚一接触短路

        核心正文:
        [unit_002886; type=passage; page=272]
        电流继续增大，一直到短路小桥发生爆断，这时的短路电流为短路峰值电流 $(I_{\mathrm{max}})$ ③，产生很大的金属飞溅损失。所以此处（即将爆断时）应加负脉冲电流④或保持较低的峰值电流值，可以降低飞溅率。在燃弧期间，为了改善焊缝成形，应当增加燃弧能量，主要方式有通过调节燃弧电压下降斜率来减小燃弧电流下降速度⑤或提高稳定电流值或在燃弧时附加脉冲电流。随后再向电弧施加诱导负脉冲⑥，给焊丝端头的熔滴整形，以便柔顺地与熔池接触并短路，同时保持低电流⑦。理想的短路过渡的电流波形如图5-46所示。

        支撑内容:
        [unit_002668; type=title; page=250]
        5.3.2 $\mathrm{CO}_{2}$ 焊短路过渡的工艺特点与控制
      images:
        - unit_id: unit_002883
          page: 271
          caption: 图5-46 典型短路电流波形示意图
          path: /CODE/jm/Constella/GMAW/hybrid_ocr/images/f6bea9f9d485000808c191b081d4744124e10d9bd42b8ebcb49d26a1e4c6c411.jpg
    output: |-
      规则组1
      C: 焊接方法|CO2焊 + 熔滴过渡形式|短路过渡 + 短路小桥|即将爆断
      R: 短路电流|达到短路峰值电流 —[导致]→ 金属飞溅损失|很大
      R: 电流|加负脉冲 —[降低]→ 飞溅率|降低
      R: 峰值电流|保持较低 —[降低]→ 飞溅率|降低
      规则组2
      C: 焊接方法|CO2焊 + 熔滴过渡形式|短路过渡 + 焊接阶段|燃弧期间
      R: 燃弧能量|增加 —[改善]→ 焊缝成形|改善
      R: 燃弧电压下降斜率|调节 —[减小]→ 燃弧电流下降速度|降低
      R: 燃弧电流下降速度|降低 —[增加]→ 燃弧能量|增加
      R: 稳定电流值|提高 —[增加]→ 燃弧能量|增加
      R: 脉冲电流|燃弧时附加 —[增加]→ 燃弧能量|增加
      规则组3
      C: 焊接方法|CO2焊 + 熔滴过渡形式|短路过渡 + 焊接阶段|燃弧后
      R: 诱导负脉冲|施加 —[整形]→ 焊丝端头熔滴|适于柔顺接触
      R: 焊丝端头熔滴|整形后 —[接触并短路]→ 熔池|柔顺接触
      R: 电流|保持低 —[对应]→ 焊接阶段|短路

  - id: context_000595
    route: text+image
    difficulty_tags: [完整覆盖, 并列原因拆分, 因果链, 阈值]
    construction_rationale: |-
      先列出正文首句四个并列保护失效因素，逐项生成规则，避免只关注图片所示的空气流动。随后保留保护气流吹散、焊接区暴露、保护破坏的完整因果链。1.5m/s与2m/s分别对应无影响和气孔增加，只有后者与正常流量构成明确共同条件。
    input:
      text: |-
        上下文包编号: context_000595

        标题路径:
        第5章 $\mathrm{CO}_{2}$ 气体保护焊 > 5.4 $\mathrm{CO}_{2}$ 焊的焊接工艺 > 5.4.2 $\mathrm{CO}_{2}$ 焊焊接参数的影响

        包约束候选（需按作用域筛选）:
        - [constraint_000662] 间隙: $2\mathrm{mm}$ 以上时
        - [constraint_000669] 焊接电流: 焊接电流在250A以上
        - [constraint_000670] 电压: 某一电压
        - [constraint_000671] 电流: 电流一定的
        - [constraint_000674] 板厚: $9\mathrm{mm}$ 的低碳钢板条件下
        - [constraint_000683] 焊接速度: $1\mathrm{m / min}$ 左右
        - [constraint_000686] 电弧电压: 电弧电压更低
        - [constraint_000687] 焊丝: 焊丝直径较大
        - [constraint_000688] parameter: 200A以下焊接薄板

        核心正文:
        [unit_003120; type=passage; page=295]
        影响有效保护的主要因素是空气流动、保护气体流量不足、喷嘴高度过大和喷嘴上附着大量飞溅物。特别是空气流动的影响十分显著，在空气流动的作用下，保护气流被吹散，使得熔池、电弧甚至焊丝端头暴露在空气中，破坏保护，如图5-79所示。当空气流动的速度在 $1.5\mathrm{m / s}$ 以下时，对气体保护效果无影响。当空气流动的速度 $>2\mathrm{m / s}$ 时，在使用正常保护气流量时，焊缝中气孔明显增加，如图5-80所示。为此必须增加保护气体流量，才能保护焊缝。

        支撑内容:
        [unit_003046; type=title; page=286]
        5.4.2 $\mathrm{CO}_{2}$ 焊焊接参数的影响
      images:
        - unit_id: unit_003123
          page: 296
          caption: 图5-79 空气流动对保护气体的影响
          path: /CODE/jm/Constella/GMAW/hybrid_ocr/images/957e00bb6a5a642245a80224c760b8e522aac3b22e231def956c701e252afe66.jpg
        - unit_id: unit_003125
          page: 296
          caption: 图5-80 空气流动速度对保护气流量的影响
          path: /CODE/jm/Constella/GMAW/hybrid_ocr/images/5d114a69e085593f7150bdbe7d2f5904ffc26cc55a28abd6941225983adf5d3a.jpg
    output: |-
      规则组1
      C: 焊接方法|CO2焊
      R: 空气流动|存在 —[破坏]→ 有效保护|效果
      R: 保护气体流量|不足 —[破坏]→ 有效保护|效果
      R: 喷嘴高度|过大 —[破坏]→ 有效保护|效果
      R: 喷嘴附着飞溅物|大量 —[破坏]→ 有效保护|效果
      R: 空气流动|存在 —[吹散]→ 保护气流|分散
      R: 保护气流|分散 —[使]→ 熔池、电弧及焊丝端头|暴露在空气中
      R: 熔池、电弧及焊丝端头|暴露在空气中 —[破坏]→ 有效保护|效果
      R: 空气流动速度|≤1.5m/s —[对应]→ 气体保护效果|无影响
      R: 空气流动速度|>2m/s + 保护气体流量|正常 —[导致]→ 焊缝气孔|明显增加
      R: 空气流动速度|>2m/s —[要求]→ 保护气体流量|增加

  - id: context_000169
    route: text
    difficulty_tags: [互斥材料, 备选气体, 质量等级, 机理链]
    construction_rationale: |-
      碳钢与低合金钢是两个独立适用材料，不能用加号合成一个条件，因此分为两组并保留原文明示的共同规则。低、高质量要求下的气体方案均由“或”连接，分别拆R。氧化物生成、阴极斑点固定和电弧稳定保持相邻机理链，板厚趋势分别绑定CO2与O2比例。
    input:
      text: |-
        上下文包编号: context_000169

        标题路径:
        第2章 焊接电弧 > 2.5 焊接用保护气体 > 2.5.4 焊接方法与保护气体的选择

        核心正文:
        [unit_000901; type=passage; page=81]
        焊接碳钢和低合金钢，如果采用纯氩作为保护气体将影响电弧的稳定性和焊缝成形，所以常常需要加入少量的氧化性气体如 $\mathrm{O}_2$ 和 $\mathrm{CO}_{2}$，这样将提高生产成本。为此，人们发现用廉价的 $\mathrm{CO}_{2}$ 气体保护焊焊接碳钢和低合金钢时，可以得到良好的效果，但是却降低了焊接接头的韧性。所以根据对焊接质量的要求不同，要选择不同的保护气体。要求低时，可以采用纯 $\mathrm{CO}_{2}$ 气体保护或（$\mathrm{CO}_{2}+\mathrm{O}_2$）混合气体保护；而要求较高时，可以采用富氩混合气体（$\mathrm{Ar+O}_2$）或（$\mathrm{Ar}+\mathrm{CO}_{2}$），这时因为有氧化性气体，在阴极破碎氧化膜的同时，还不断地生成新的氧化物，使阴极斑点被固定在熔池上，使得电弧稳定，并改善了焊缝成形。同时还应根据母材的板厚来选择混合气体，随着板厚的增加，应适当提高混合气体中 $\mathrm{CO}_{2}$ 和 $\mathrm{O}_2$ 的比例。

        支撑内容:
        [unit_000892; type=title; page=79]
        2.5.4 焊接方法与保护气体的选择
      images: []
    output: |-
      规则组1
      C: 母材材质|碳钢
      R: 保护气体|纯Ar —[影响]→ 电弧稳定性|受影响
      R: 保护气体|纯Ar —[影响]→ 焊缝成形|受影响
      R: 保护气体|加入少量O2 —[提高]→ 生产成本|提高
      R: 保护气体|加入少量CO2 —[提高]→ 生产成本|提高
      R: 保护气体|CO2 —[获得]→ 焊接效果|良好
      R: 保护气体|CO2 —[降低]→ 焊接接头韧性|降低
      R: 焊接质量要求|低 —[可采用]→ 保护气体|纯CO2
      R: 焊接质量要求|低 —[可采用]→ 保护气体|CO2+O2
      R: 焊接质量要求|高 —[可采用]→ 保护气体|Ar+O2
      R: 焊接质量要求|高 —[可采用]→ 保护气体|Ar+CO2
      R: 氧化性气体|存在 —[破碎]→ 阴极氧化膜|破碎
      R: 氧化性气体|存在 —[生成]→ 新氧化物|持续生成
      R: 新氧化物|持续生成 —[固定]→ 阴极斑点|位于熔池上
      R: 阴极斑点|固定在熔池上 —[使]→ 电弧|稳定
      R: 阴极斑点|固定在熔池上 —[改善]→ 焊缝成形|改善
      R: 母材板厚|增加 —[要求提高]→ 混合气体中CO2比例|提高
      R: 母材板厚|增加 —[要求提高]→ 混合气体中O2比例|提高
      规则组2
      C: 母材材质|低合金钢
      R: 保护气体|纯Ar —[影响]→ 电弧稳定性|受影响
      R: 保护气体|纯Ar —[影响]→ 焊缝成形|受影响
      R: 保护气体|加入少量O2 —[提高]→ 生产成本|提高
      R: 保护气体|加入少量CO2 —[提高]→ 生产成本|提高
      R: 保护气体|CO2 —[获得]→ 焊接效果|良好
      R: 保护气体|CO2 —[降低]→ 焊接接头韧性|降低
