        核心正文:
        [unit_002989; type=passage; page=280]
        2）细颗粒过渡。随着焊接电流的增加，斑点面积也增加。当焊接电流达到240A时斑点面积增加，斑点直径大于焊丝直径时，电磁力改变了方向，由阻碍熔滴过渡到推动熔滴过渡，使熔滴过渡频率增加（为24滴/s），熔滴尺寸减小，熔滴直径为焊丝直径的1.5倍左右，这种形式为细滴过渡，如图5-58b所示。由于电弧只能在药芯焊丝薄钢带的筒壁上存在，所以电弧的阳极弧根随熔滴绕渣柱旋转，并附在渣柱壁上，这时其界面张力较小，使熔滴旋转的同时，还沿渣柱滑落到熔池中或者在电磁力作用下自由飞落到熔池中。由于电弧力的排斥作用较小，所以悬挂在焊丝端头上的熔滴偏离焊丝轴线不大，熔滴基本上落入熔池中而表现为飞溅小和过程稳定。在金属熔滴过渡过程中，部分药芯在电弧及过热熔滴的作用下也不断地熔化和伴随过渡。实际上细滴过渡是钛型药芯焊丝熔滴过渡的主要过渡形式。3）短路过渡。在小电流和低电压时（160A，20V，$\mathrm{CO}_{2}$气体保护），因弧长较短，熔滴极易与熔池短路。这时熔滴在表面张力作用下向熔池铺展，同时在焊丝与熔滴之间形成缩颈，在此处通过的焊接电流逐渐增大，该缩颈在电磁收缩力作用下，加速压缩和减小缩颈尺寸，直至拉断，完成短路过渡过程。此时熔滴直径较小，约为焊丝直径的1.1倍，过渡频率较大，为68滴/s。前面已介绍过，通常实心 $\mathrm{CO}_{2}$ 焊短路过渡是十分稳定的过渡形式，而药芯焊丝却不然，由于渣柱的存在，往往在短路小桥爆断时产生飞溅，所以药芯焊丝 $\mathrm{CO}_{2}$ 焊的短路过渡过程并不是最好的过渡形式。（2）电弧电压 电弧电压是配合焊接电流决定电弧长度的因子。电弧电压对电弧稳定性、飞溅、焊缝成形和焊接气孔等影响很大。提高电弧电压，电弧长度增加，焊缝就变宽，而熔深及余高随之减少。

