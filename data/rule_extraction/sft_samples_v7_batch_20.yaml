  input:
    text: '上下文包编号: context_000009


      标题路径:

      第2章 焊接电弧 > 2.1 电弧的物理基础 > 2.1.1 气体放电的基本概念


      核心正文:

      [unit_000187; type=passage; page=17]

      众所周知，金属导电时其中流过的电流与电压的关系遵守欧姆定律 $I = U / R$ 。而气体放电则不然，其不遵守欧姆定律，而是一个十分复杂的关系，如图2-2所示。它是在大气压为 $100\mathrm{Pa}$ 、电极距离为数厘米时的放电电流—电压特性。在较小的电流区间（
      $10^{-10} \sim 10^{-8}\mathrm{A}$ ），气体放电所需要的带电粒子不能通过导电过程本身产生，而需要外部注入带电粒子，否则它将失去导电性，这种气体导电现象被称为非自持放电。当电流变大时，气体导电过程本身就可以产生维持导电所需的带电粒子，这种放电过程称为自持放电。在自持放电区间，放电机构根据电流的不同其特性具有显著的差异。自持放电又分为暗放电、辉光放电和电弧放电三种基本形式。暗放电时电压较高，电流很小，约为
      $10^{-8} \sim 10^{-4}\mathrm{A}$ ，没有光亮。电流进一步提高到 $10^{-4}\mathrm{A}$ 以上一直到0.1A左右，具有明亮的辉光现象。电弧放电在


      支撑内容:

      [unit_000183; type=title; page=17]

      2.1.1 气体放电的基本概念


      资源文字化:

      [unit_000190; type=figure; page=18]

      题注: 图2-2 直流放电的电压与电流特性及放电形式

      原始文字:

      图2-2 直流放电的电压与电流特性及放电形式

      资源标题: 图2-2 直流放电的电压与电流特性及放电形式

      资源描述: 该图为直流放电的电压-电流特性曲线图。纵轴表示电压（单位：V），刻度从0到1000，间隔200；横轴表示电流（单位：A），为对数坐标，刻度从10⁻¹⁰到1000。图中包含一条实线曲线和一条虚线曲线。实线曲线展示了不同放电阶段的电压变化：在电流极小时电压较低，随后在约10⁻⁴
      A处电压降至约300 V并保持平稳，在约10⁻¹ A处电压急剧上升至约900 V的峰值，随后在电流增大时电压迅速下降。虚线曲线位于实线左侧，在电流约10⁻¹⁰ A处电压达到约1000 V的峰值，随后下降。图上方标注了不同的放电形式区域，从左至右依次为：绝缘破坏、暗放电、迁移区、辉光放电、异常辉光、迁移区、电弧放电。这些区域由垂直虚线分隔。'
