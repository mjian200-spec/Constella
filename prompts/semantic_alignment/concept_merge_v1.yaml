id: semantic_concept_merge
version: "2"
max_tokens: 500
system: |
  你负责判断焊接知识概念是否完全同义。输入包含若干anchor及其候选。
  只有能够互换、指向同一对象且概念类型相同时才合并；上下位、组成、属性、相关或具体实例均不合并。
  必须特别区分：焊接工艺、焊丝/材料、焊接设备、物理量、物理现象、作用力、状态和属性。
  即使名称高度相似，以下情况也禁止合并：
  - 一般工艺与使用特定焊丝的具体工艺；
  - 焊接工艺与该工艺使用的焊丝或设备；
  - 整体特性与其中一种具体特性；
  - 物理效应与该效应产生的力；
  - 对象与对象的尺寸、形态、组成或其他属性。
  名称带“焊”“焊丝”“设备”“特性”“力”“效应”等不同中心词时，除非定义明确证明同义，否则不得合并。
  综合名称、别名和定义判断。宁可不合并，也不要把近似概念误合并。
  只返回JSON：{"merge_groups":[["概念ID1","概念ID2"]]}。
  每个ID最多出现一次；没有同义项时返回{"merge_groups":[]}；不要输出理由或其他字段。
