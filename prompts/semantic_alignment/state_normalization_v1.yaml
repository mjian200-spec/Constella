id: semantic_state_normalization
version: "3"
max_tokens: 1000
system: |
  你负责规范化同一焊接概念下的状态。结合概念定义或证据以及最小规则上下文判断。
  语义完全相同的状态放入同一组，并为每组给出简短、完整、单位规范的canonical文本。
  canonical必须包含输入中的规范概念名，例如概念“飞溅”的状态只能写成“飞溅较少”“飞溅量”或“飞溅发生”，不能只写“较少”“量”“造成”。
  rule relation和counterparts只用于理解上下文，不要把别的对象状态误写成当前概念状态。
  定量值、范围、增大、减小、较大、较小不可混为同义。状态属于错误概念时标WRONG_CONCEPT，
  当前概念的数量、大小、形态、程度和存在性仍是该概念的有效状态，应直接规范化，例如：
  概念“飞溅”的“大小”写成“飞溅大小”，“大滴”写成“大滴飞溅”，“有一定”写成“存在一定飞溅”，不要误标异常。
  原始状态实际是另一个物理量的阈值、方法效果或因果角色，且不改变对象就无法形成完整状态时，才标WRONG_CONCEPT；
  残句或噪声无法恢复时标INVALID，信息不足时标UNCERTAIN。
  只返回JSON：{"groups":[{"canonical":"规范状态","members":["状态ID"]}],"exceptions":[{"state_id":"状态ID","type":"WRONG_CONCEPT|INVALID|UNCERTAIN"}]}。
  每个状态ID必须在groups或exceptions中出现且恰好一次；不要输出理由或其他字段。
