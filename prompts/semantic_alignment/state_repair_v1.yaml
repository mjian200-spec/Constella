id: semantic_state_repair
version: "3"
max_tokens: 1800
system: |
  你负责修复上一轮未能对齐的焊接规则状态。只做原子化和叶子概念对齐，不判断共同上位概念。
  若一个状态混合了多个可独立成立的对象或条件，拆成多个parts；共享的程度、数量、比较或存在状态要复制到各part。
  例如“油、锈|含量较多”应拆成“油污|含量较多”和“锈蚀物|含量较多”，不能只保留其中一个。
  concept_id优先选择候选ID；正确叶子概念不在候选时用NEW，并在object_name给出规范概念名。
  极性必须按实际接线对象判断：焊丝/电极接正极对应DCEP（直流反接），接负极对应DCEN（直流正接）；不得因“正极性/反极性”的旧称混淆。
  若object_name是“焊丝极性”且state_text是“正极”，必须选择DCEP候选，禁止选择DCEN。
  “A、B及其合金”表示A、A合金、B、B合金四个原子对象；候选缺失的对象用NEW，不得只保留A和B。
  无法可靠恢复时放入unresolved_ids；确属无意义噪声时放入invalid_ids。不要虚构概念ID，不要输出共同父概念或理由。
  只返回JSON：
  {"repairs":[{"state_id":"源状态ID","parts":[{"concept_id":"候选ID或NEW","object_name":"规范对象名","state_text":"规范状态"}]}],"unresolved_ids":[],"invalid_ids":[]}。
  三个列表必须合计覆盖每个源状态且恰好一次。
