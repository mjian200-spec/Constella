id: rule_generator_table_specialist
version: 3
system: |-
  【表格专项】
  1. 表格不是单元格列表。先按“表题→分组表头→行头→列头→当前单元格→脚注/图例”恢复每个候选的完整语义路径，再决定是否生成规则。
  2. 只抽取表头路径完整、属于当前主题并明确表达参数、属性、方案、原因—措施、选择或比较的内容。实验原始数据、背景性能展示、重复正文、中间数据以及表头归属不明的单元格不强制抽取。大表存在不等于每行都必须生成。
  3. 恢复后的表题、分组表头、行头和列头分别标注其语义角色与作用域，再统一交由base决定C/R；本模块不根据物理行列位置直接规定C或R。去掉行头会改变当前单元格含义时，必须保留该行头提供的语义，不能只输出单元格值。
  4. 独立材料、方法、位置和备选方案保持为独立取值。多个气体比例共同组成一种成分，或多个参数共同组成一套明确参数包时可以保留组合。对象和状态不得倒置；逻辑拆分统一执行base规则。
  5. 只有图例明确给出符号含义和排序时，◎、○、●、△才是可入图的领域状态。图例缺失时应转而抽取核心正文中明示的结论，不能逐格转录符号、不能生成“◎对应◎”之类属性自环。物理列数、逻辑列数、合并单元格或OCR互相冲突且原图不能消歧时，应使用正文中证据闭合的概括规则，不生成具体单元格映射。
examples:
  - input: |-
      真实上下文包 context_000801
      标题路径：MIG/MAG焊工艺 > 焊接缺陷的成因和解决措施
      临近正文：MIG焊接铝及铝合金、MAG焊钢材时容易产生缺陷。
      表题/列头：缺陷种类｜成因｜解决措施
      当前行：气孔｜保护气体不纯｜提高气体纯度；保证预热器工作正常
      表格分析：标题和临近正文共同限定焊接方法为MIG/MAG焊；合并行头“气孔”统领当前两条措施，去掉后会把措施扩大到其他缺陷，因此二者进入C；具体成因是R左侧。
    output: |-
      规则组1
      C: 焊接方法|MIG/MAG焊 + 缺陷种类|气孔
      R: 保护气体|不纯 —[解决措施]→ 保护气体纯度|提高
      R: 保护气体|不纯 —[解决措施]→ 预热器|保证工作正常
  - input: |-
      真实上下文包 context_000786
      表题：铝合金脉冲MIG焊典型参数
      完整表头路径：母材5083→角焊缝→板厚6.0mm→焊丝5183 φ1.6mm→焊接姿势水平→平均电流190A、基值电流60A、电压24V、速度50cm/min、流量20L/min
      表格分析：材料、接头、板厚和焊丝统领参数组；焊接姿势选择当前参数组。
    output: |-
      规则组1
      C: 母材材质|5083 + 接头形式|角焊缝 + 板厚|6.0mm + 焊丝|5183 φ1.6mm
      R: 焊接姿势|水平 —[对应]→ 工艺参数|平均电流190A、基值电流60A、电弧电压24V、焊接速度50cm/min、气流量20L/min
  - input: |-
      真实上下文包 context_000488
      核心正文：在平焊和平角焊时，熔渣型药芯焊丝抗风能力稍好一些，焊道形状和外观良好、脱渣性优良。
      关联表格：使用◎、○、●、△比较多种焊丝工艺性，但当前上下文没有给出符号图例。
      表格分析：符号不能解释为等级，也不能转录成属性自环；只抽取正文直接说明且语义闭合的结论。
    output: |-
      规则组1
      C: 焊接位置|平焊或平角焊
      R: 熔渣型药芯焊丝|使用 —[获得]→ 焊道形状和外观|良好
      R: 熔渣型药芯焊丝|使用 —[获得]→ 脱渣性|优良
  - input: |-
      真实上下文包 context_000386
      核心正文：为了获得连续致密的焊缝，焊点之间要有一定重叠量，常用频率一般低于10Hz。
      表格：声明四个焊接速度列，但频率行出现五个数值，原图不能可靠确定错位值的列归属。
      表格分析：放弃具体速度—频率映射，保留正文中的明确要求和频率范围。
    output: |-
      规则组1
      C: 焊接方法|脉冲TIG焊
      R: 焊点之间|有一定重叠量 —[用于获得]→ 焊缝|连续致密
      R: 常用频率|一般 —[低于]→ 频率上限|10Hz
  - input: |-
      真实上下文包 context_000743
      标题路径：第6章 熔化极氩弧焊 > 6.5 各种金属的MIG/MAG焊工艺 > 6.5.2 低碳钢与低合金钢的MAG焊
      临近正文：对于不锈钢应选择轻氧化性气体。用Ar+CO2混合气体焊接不锈钢会增加焊缝金属含碳量并减少腐蚀电阻。特别是在多层焊时，应采用He 90% + Ar 7.5% + CO2 2.5%。
      包约束候选：电源外特性=平特性（与本条选气规则无直接作用域）
      关联表格：不锈钢焊接用保护气体组成。
      表格分析：章节中的低碳钢与低合金钢不覆盖当前明确讨论的不锈钢，不能加入C；不锈钢只统领混合气体影响和多层焊选气；多层焊是具体选择条件，保留在R左侧；无关电源约束不用。
    output: |-
      规则组1
      C: 无
      R: 母材材质|不锈钢 —[应选择]→ 保护气体类型|轻氧化性气体
      规则组2
      C: 母材材质|不锈钢
      R: 保护气体成分|Ar + CO2 —[增加]→ 焊缝金属含碳量|增加
      R: 保护气体成分|Ar + CO2 —[减少]→ 腐蚀电阻|降低
      规则组3
      C: 母材材质|不锈钢
      R: 焊接层次|多层焊 —[应采用]→ 保护气体成分|He 90% + Ar 7.5% + CO2 2.5%
