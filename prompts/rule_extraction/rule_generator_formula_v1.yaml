id: rule_generator_formula_specialist
version: 3
system: |-
  【公式专项】
  1. 先分类为普通计算/控制/参数关系、正文明确的公式等价/变换，或不抽取。中间推导、背景公式、重复结论、只有式号、变量无法辨认、正文目标量与公式左端不一致的公式不生成规则。
  2. 普通公式的完整公式必须放在箭头方括号中：“R: 对象|适用状态 —[完整公式]→ 目标量或关系|含义”。普通公式不得放在左右两端充当对象或状态。
  3. 只有原文明示等价、恒等变形、化简或变换时，才把两侧完整公式分别放在箭头两端：“R: 式号|完整原公式 —[可化简为/等价于/变换为]→ 式号|完整结果公式”。任一侧只有式号、名称或占位词时不生成变换规则；输出中绝不出现“未知、待补、原公式、简化公式”等占位状态。若当前包只有一侧完整公式，可将该式按普通公式抽取，但不能自行推导缺失的另一侧。
  4. 核对正文引用句、式号、完整LaTeX、公式左端目标量和变量释义是否绑定一致。保留上下标、分式、正负号和运算符，不用OCR简写替换。
  5. 明确识别公式变换的成立假设、普通公式的适用工况、自变量和目标量，并保留它们与当前公式的证据作用域；C/R归位统一执行base规则，本模块不另设默认位置。
examples:
  - input: |-
      真实上下文包 context_000896
      核心正文：电弧电压与弧长的关系见式（2-39）。
      支撑公式：Ua=Uao+EL。
      公式分析：这是普通目标量关系，不是两式变换。
    output: |-
      规则组1
      C: 无
      R: 焊接电弧|弧长变化 —[Ua=Uao+EL]→ 电弧电压|与弧长的关系
  - input: |-
      真实上下文包 context_000540
      核心正文：如果K0/(R0+B0K0)=K1、L≈0，则式(5-30)可简化为式(5-31)。
      支撑公式：
      式(5-30)：\frac{U_o}{U_g}=\frac{K_0K_2R}{T_2LS^2+(R+B_0K_0)T_2S+K_0K_2B_2R}=\frac{\frac{K_0K_2R}{R+B_0K_0}}{\frac{T_2L}{R+B_0K_0}S^2+T_2S+\frac{K_0K_2B_2R}{R+B_0K_0}}
      式(5-31)：\frac{U_0}{U_g}=\frac{\frac{K_0K_2R}{R_0+B_0K_0}}{T_2S+\frac{K_0K_2B_2R}{R_0+B_0K_0}}=\frac{\frac{1}{B_2}}{\frac{T_2}{K_1K_2B_2R}S+1}
      公式分析：正文明确化简，成立条件进入C，两端必须保存完整等式而非“原公式/简化公式”占位词。
    output: |-
      规则组1
      C: K0/(R0+B0K0)|等于K1 + L|约等于0
      R: 式(5-30)|\frac{U_o}{U_g}=\frac{K_0K_2R}{T_2LS^2+(R+B_0K_0)T_2S+K_0K_2B_2R}=\frac{\frac{K_0K_2R}{R+B_0K_0}}{\frac{T_2L}{R+B_0K_0}S^2+T_2S+\frac{K_0K_2B_2R}{R+B_0K_0}} —[可化简为]→ 式(5-31)|\frac{U_0}{U_g}=\frac{\frac{K_0K_2R}{R_0+B_0K_0}}{T_2S+\frac{K_0K_2B_2R}{R_0+B_0K_0}}=\frac{\frac{1}{B_2}}{\frac{T_2}{K_1K_2B_2R}S+1}
  - input: |-
      真实上下文包 context_000904
      核心正文：CO2在电弧高温下发生分解反应。
      支撑公式：CO2⇌CO+1/2O2-Q。
      公式分析：反应式是普通关系，应放在箭头中。
    output: |-
      规则组1
      C: 焊接方法|CO2焊
      R: CO2气体|受电弧高温作用 —[CO2⇌CO+1/2O2-Q]→ 分解反应|发生
  - input: |-
      真实上下文包 context_000908
      核心正文：内环输入信号为Ig'，输出电流为I0，其传递函数见式(5-28)。已知逆变焊机直流电感很小，所以式(5-28)可简化为式(5-29)。
      关联公式：只有式(5-28)完整正文 I0/Ig'=[K0/(R0+B0K0)]/[1+L0S/(R0+B0K0)]，没有式(5-29)正文。
      公式分析：可以保存完整的普通传递函数；缺少结果式，不能输出公式变换，也不能用“未知”占位。
    output: |-
      规则组1
      C: 内环|工作
      R: 内环|输入Ig'、输出I0 —[I0/Ig'=[K0/(R0+B0K0)]/[1+L0S/(R0+B0K0)]]→ 传递函数|式(5-28)
