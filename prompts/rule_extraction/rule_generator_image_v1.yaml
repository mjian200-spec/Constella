id: rule_generator_image_specialist
version: 3
system: |-
  【图片专项】
  1. 先判断图片角色：独立证据、视觉核对或背景说明。只有图片直接补充了闭合且有规则意义的关系，才新增规则；正文已经完整表达同一事实时，图片只核对，不重复生成。
  2. 对尺寸图先沿尺寸线、引出线和箭头确定“数值描述哪个属性”，再读取数值和单位。不同方向或位置的尺寸不得共用一个含糊属性名。
  3. 对流程图和工艺示意图核对部件、流向、作用方向和步骤；对曲线核对横纵轴、图例、适用条件及原文明示的趋势区间。无法确认图例或标注归属时省略。
  4. 原图用于核对OCR易混字符、正负号、上下标、单位、合并单元格和箭头方向。冲突时采用图片中清晰可辨内容；仍不清楚就不生成。
  5. 图号、子图编号、波形点位、虚线/实线样式、绘图位置和“见图”不是领域对象，不得进入R。扫描表格或公式分别执行已命中的表格/公式模块。
examples:
  - input: |-
      真实上下文包 context_000391
      标题路径：第4章 钨极惰性气体保护焊 > 4.5 TIG焊工艺 > 4.5.3 TIG焊的工艺条件
      核心正文：为了保证良好的背面成形，焊接薄件时都要使用垫板，一般用不锈钢作垫板，且垫板不与接头对缝处贴紧，以免焊不透、焊缝背面成形不良或产生缺陷。垫板可以稍留槽隙。山形对接接头的背面不与垫板直接接触，可以采用平垫板。如果在垫板的气隙中通入保护气体，则更有利于形成圆滑的背面焊道。
      关联图4-45b：竖向尺寸线标注0.2~0.5mm，指向槽深；横向尺寸线标注5~10mm，指向槽宽。
      图片分析：两个数值属于不同尺寸属性，不能都命名为槽隙。
    output: |-
      规则组1
      C: 焊接方法|TIG焊 + 焊接对象|薄件
      R: 焊接薄件|使用垫板 —[保证]→ 背面成形|良好
      R: 垫板材质|不锈钢 —[一般选用]→ 垫板|使用
      R: 垫板|与接头对缝处贴紧 —[导致]→ 焊缝|焊不透
      R: 垫板|与接头对缝处贴紧 —[导致]→ 焊缝背面成形|不良
      R: 垫板|与接头对缝处贴紧 —[导致]→ 焊接缺陷|产生
      R: 垫板|留槽 —[对应]→ 槽深|0.2~0.5mm
      R: 垫板|留槽 —[对应]→ 槽宽|5~10mm
      规则组2
      C: 焊接方法|TIG焊 + 接头类型|山形对接接头
      R: 山形对接接头背面|不与垫板直接接触 —[可采用]→ 垫板类型|平垫板
      规则组3
      C: 焊接方法|TIG焊 + 垫板状态|存在气隙
      R: 保护气体|通入垫板气隙 —[有利于]→ 背面焊道|圆滑
  - input: |-
      真实上下文包 context_000505
      标题路径：第5章 CO2气体保护焊 > 5.3 CO2焊的熔滴过渡 > 5.3.2 CO2焊短路过渡的工艺特点与控制
      核心正文：通过该短路小桥，同时产生较大的电磁收缩力。在电磁收缩力作用下将发生两种可能的现象：一种是该熔滴被排斥开；另一种是该短路小桥因过电流而爆炸，因为爆炸力较大，同时该力又作用在熔滴与熔池之间，其作用力使熔滴远离熔池，而形成很大的飞溅，这种飞溅又称为瞬时短路飞溅。如果在回路中串入较大的不饱和直流电感，用来抑制短路电流的上升速度，使得熔滴能够柔顺地与熔池润湿汇合，从而避免了这种大飞溅。
      关联图片：图5-30b展示飞溅形式。
      图片分析：图片仅核对正文机理，图5-30b是文档位置，不能成为结果对象。
    output: |-
      规则组1
      C: 焊接方法|CO2焊 + 熔滴过渡形式|短路过渡
      R: 短路小桥|存在 —[产生]→ 电磁收缩力|较大
      R: 电磁收缩力|较大 —[导致]→ 熔滴|被排斥开
      R: 短路小桥|过电流 —[导致]→ 短路小桥|爆炸
      R: 短路小桥|爆炸 —[导致]→ 瞬时短路飞溅|产生
      R: 回路|串入较大不饱和直流电感 —[抑制]→ 短路电流上升速度|降低
      R: 短路电流上升速度|降低 —[导致]→ 熔滴|柔顺地与熔池润湿汇合
      R: 熔滴|柔顺地与熔池润湿汇合 —[避免]→ 大飞溅|形成
