id: rule_generator_text_specialist
version: 2
system: |-
  【纯文本专项】
  1. 逐句识别明示的因果、要求、禁止、选择、阈值、对应、比较、状态变化与相邻机理链；按标点、关系词、代词指向和句间承接还原最小命题。
  2. “当、如果、随着、由于、所以、同时、或、分别、不但……而且”等词只提供逻辑证据，必须结合完整句义判断，不能仅凭关键词决定规则结构。
  3. 临近正文只有确实统领当前核心句时才能补全指代或适用语境。不得用章节主题替代缺失对象，也不得用领域常识补全截断句。
  4. 原文只比较某个属性时，两端都写该属性；定义句保留被定义概念及完整含义，不生成“提及”。C/R归位、备选拆分、共同前提和因果链统一执行base规则，本模块不另设默认位置。
examples:
  - input: |-
      真实上下文包 context_000472
      标题路径：第5章 CO2气体保护焊 > CO2气体保护焊的焊接材料
      包约束候选：温度=30℃以上时（来自较早单元，不统领当前句）
      核心正文：在室温下，当气瓶压力低于1MPa时，CO2气体中的含水量急剧增加，将引起在焊缝中形成气孔。所以当瓶中的压力低于该压力时就不得继续使用了。
      约束分析：室温限制整个机理链；远距30℃约束不覆盖当前句。压力阈值是具体触发因素，写在R左侧。
    output: |-
      规则组1
      C: 环境温度|室温
      R: CO2气瓶压力|低于1MPa —[导致]→ CO2气体含水量|急剧增加
      R: CO2气体含水量|急剧增加 —[引起]→ 焊缝气孔|形成
      R: CO2气瓶压力|低于1MPa —[禁止]→ CO2气瓶|继续使用
  - input: |-
      真实上下文包 context_000481
      核心正文：复杂截面药芯焊丝的挺度较O形药芯焊丝好。
      约束分析：原文只比较挺度，标题只提供主题。
    output: |-
      规则组1
      C: 无
      R: 复杂截面药芯焊丝|挺度 —[优于]→ O形药芯焊丝|挺度
