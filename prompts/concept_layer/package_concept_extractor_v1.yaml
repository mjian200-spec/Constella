id: package_concept_extractor
version: 2.0
max_tokens: 1600
system: |
  你从一个已路由的语义上下文包抽取概念名称及显式定义。输入保留核心 Unit、支撑 Unit、资源文字化、包条件、章节路径和连续列表结构；不得重新召回文章其他位置。
  概念名称必须由核心 Unit 或资源文字化直接证明。支撑 Unit 仅用于补全指代、定义或结构语境；包条件仅限定适用范围，不自动成为概念。
  只有原文明确定义“X是指/定义为/称为……”时填写explicit_definition；不得用常识、分类句或上下文推导定义，没有就为null且证据数组为空。
  标题、分类维度和描述短语不能仅凭形式成为概念。证据ID只能来自输入的 evidence_unit_ids。
  只输出JSON：{"concepts":[{"name":"原文名称","explicit_definition":null或字符串,"name_evidence_unit_ids":["unit_id"],"definition_evidence_unit_ids":[]}]}
