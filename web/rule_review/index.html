<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Constella · 规则抽取审查</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="brand"><strong>Constella</strong><span>规则抽取审查台</span></div>
    <div class="run-status"><span id="run-badge" class="run-badge">读取中</span><small id="status">正在读取结果…</small></div>
  </header>
  <main>
    <section id="metrics" class="metrics" aria-label="结果概览"></section>
    <section id="progress" class="progress" aria-label="抽取进度"></section>
    <section id="route-summary" class="route-summary" aria-label="结构路由分布"></section>

    <section class="toolbar" aria-label="结果筛选">
      <input id="query" type="search" placeholder="搜索包编号、章节或核心正文">
      <select id="filter" aria-label="运行状态">
        <option value="">全部运行状态</option>
        <option value="success">成功</option><option value="no_rule">无规则</option><option value="failed">失败</option>
        <option value="pending">等待</option><option value="generating">生成中</option><option value="reflecting">反思中</option>
        <option value="applying_reflection">应用反思</option><option value="parsing">解析中</option><option value="writing_graph">写图中</option>
      </select>
      <select id="review-filter" aria-label="人工审核状态">
        <option value="">全部审核状态</option><option value="unreviewed">未审核</option>
        <option value="appropriate">合适</option><option value="inappropriate">不合适</option>
      </select>
      <select id="route-filter" aria-label="结构路由">
        <option value="">全部结构路由</option><option value="text">仅正文</option>
        <option value="image">含图片</option><option value="table">含表格</option>
        <option value="formula">含公式</option><option value="mixed">多专项混合</option>
      </select>
      <select id="rule-filter" aria-label="规则数量">
        <option value="">全部规则数量</option><option value="1-10">1–10 条</option><option value="11-20">11–20 条</option>
        <option value="21-40">21–40 条</option><option value="41+">超过 40 条</option><option value="0">0 条</option>
      </select>
      <select id="sort" aria-label="排序方式">
        <option value="id">按包编号</option><option value="rules-desc">规则数从高到低</option>
        <option value="rules-asc">规则数从低到高</option><option value="review">未审核优先</option>
      </select>
      <button id="refresh" type="button">刷新数据</button>
      <label class="live-control"><input id="live" type="checkbox"> 运行中自动刷新</label>
    </section>

    <section class="layout">
      <aside class="sidebar">
        <div id="list-meta" class="list-meta"></div>
        <div id="list" class="list"></div>
      </aside>
      <article id="detail" class="detail"><div class="empty">从左侧选择一个上下文包。</div></article>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
